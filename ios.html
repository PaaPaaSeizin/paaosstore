    <script>
/* iOS Safari compatibility layer for PaaOS.
   Native File System Access API is used unchanged when available.
   Otherwise a persistent IndexedDB-backed virtual filesystem is provided. */
(function () {
  if (typeof window.showDirectoryPicker === 'function' && typeof window.showOpenFilePicker === 'function') return;
  const DB='PaaOS_iOS_VFS', STORE='vfs';
  const openDB=()=>new Promise((resolve,reject)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
  async function readTree(){const db=await openDB();return new Promise((resolve,reject)=>{const q=db.transaction(STORE).objectStore(STORE).get('root');q.onsuccess=()=>{db.close();resolve(q.result||{kind:'directory',name:'PaaOS Storage',children:{}})};q.onerror=()=>{db.close();reject(q.error)}})}
  async function writeTree(tree){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(tree,'root');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
  const clone = x => x;
  class VFile {
    constructor(node,save){this.node=node;this.save=save;this.kind='file';this.name=node.name;}
    async getFile(){const data=this.node.data||new Blob([]);return new File([data],this.node.name,{type:this.node.type||'application/octet-stream',lastModified:this.node.lastModified||Date.now()})}
    async createWritable(){let chunks=[];return {write:async value=>{if(value&&typeof value==='object'&&'type' in value&&typeof value.arrayBuffer==='function')chunks=[value];else if(value instanceof ArrayBuffer||ArrayBuffer.isView(value))chunks=[new Blob([value])];else chunks=[new Blob([String(value)])]},close:async()=>{this.node.data=chunks[0]||new Blob([]);this.node.type=this.node.data.type||'application/octet-stream';this.node.lastModified=Date.now();await this.save()}}}
    async queryPermission(){return 'granted'} async requestPermission(){return 'granted'}
  }
  class VDir {
    constructor(node,save){this.node=node;this.save=save;this.kind='directory';this.name=node.name;}
    async getDirectoryHandle(name,{create=false}={}){if(!this.node.children[name]){if(!create)throw new DOMException('Directory not found','NotFoundError');this.node.children[name]={kind:'directory',name,children:{}};await this.save()}const n=this.node.children[name];if(n.kind!=='directory')throw new DOMException('Not a directory','TypeMismatchError');return new VDir(n,this.save)}
    async getFileHandle(name,{create=false}={}){if(!this.node.children[name]){if(!create)throw new DOMException('File not found','NotFoundError');this.node.children[name]={kind:'file',name,data:new Blob([]),type:'application/octet-stream'};await this.save()}const n=this.node.children[name];if(n.kind!=='file')throw new DOMException('Not a file','TypeMismatchError');return new VFile(n,this.save)}
    async removeEntry(name,{recursive=false}={}){const n=this.node.children[name];if(!n)throw new DOMException('Entry not found','NotFoundError');if(n.kind==='directory'&&!recursive&&Object.keys(n.children||{}).length)throw new DOMException('Directory not empty','InvalidModificationError');delete this.node.children[name];await this.save()}
    async *values(){for(const n of Object.values(this.node.children||{}))yield n.kind==='directory'?new VDir(n,this.save):new VFile(n,this.save)}
    async *entries(){for(const n of Object.values(this.node.children||{}))yield [n.name,n.kind==='directory'?new VDir(n,this.save):new VFile(n,this.save)]}
    async queryPermission(){return 'granted'} async requestPermission(){return 'granted'}
  }
  const root=async()=>{const tree=await readTree();const save=()=>writeTree(tree);return new VDir(tree,save)};
  if(typeof window.showDirectoryPicker!=='function') window.showDirectoryPicker=async()=>{const d=await root();d.name='PaaOS Storage';return d};
  if(typeof window.showOpenFilePicker!=='function') window.showOpenFilePicker=async(options={})=>new Promise((resolve,reject)=>{const input=document.createElement('input');input.type='file';input.multiple=!!options.multiple;input.accept=(options.types||[]).flatMap(t=>Object.values(t.accept||{}).flat()).join(',');input.style.display='none';document.body.appendChild(input);input.onchange=()=>{const files=Array.from(input.files||[]);input.remove();if(!files.length){reject(new DOMException('Selection cancelled','AbortError'));return}resolve(files.map(file=>({kind:'file',name:file.name,getFile:async()=>file,queryPermission:async()=> 'granted',requestPermission:async()=> 'granted'})))};input.addEventListener('cancel',()=>{input.remove();reject(new DOMException('Selection cancelled','AbortError'))});input.click()});
  if(typeof window.showSaveFilePicker!=='function') window.showSaveFilePicker=async(options={})=>{const name=options.suggestedName||'download.txt';return {kind:'file',name,createWritable:async()=>{let blob=new Blob([]);return {write:async v=>{blob=v instanceof Blob?v:new Blob([v])},close:async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}}}}};
  window.PaaOSIOSStorage={isVirtual:true,exportNote:'iOSではPaaOS内部ストレージはIndexedDBに保存されます。Safariのサイトデータ削除で消える場合があるため、定期的にPaaOSのバックアップ機能でZIPを書き出してください。'};
})();

        :root { 
    --bg: #000; 
    --accent: #ff3e3e; 
    --text: #fff; 
    --glass: rgba(255,255,255,0.15); 
    --win-bg: #fdfdfd; 
    --text-dark: #000;
    --bsod-bg: #0078d7;
    /* デフォルトはシステム標準フォント */
    --font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    --emoji-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
}


/* ↓↓↓ ここに追加 ↓↓↓ */
* {
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;   /* ★ 追加：タップ時の水色ハイライトを消す */
    -webkit-touch-callout: none;                /* ★ 追加：長押しメニューも抑制 */
    cursor: default;
}



/* 入力欄だけは普通に使えるようにする場合（任意） */
input, textarea {
    user-select: auto !important;
    -webkit-user-select: auto !important;
    cursor: text !important;
}
        
        html, body { 
    margin: 0; padding: 0; width: 100%; height: 100%; 
    overflow: hidden; position: fixed;
    touch-action: none;
    -webkit-user-drag: none;   /* ★ 追加：img/link のネイティブドラッグ抑止（PC対応） */
    background: #1a1a1a; color: var(--text); 
    font-family: var(--font-family);  /* ← ここを変更 */
}

       #device { 
    width: 375px; height: 812px; background: var(--bg); border-radius: 55px; 
    border: 12px solid #333; position: relative; overflow: hidden; 
    box-shadow: 0 0 100px rgba(0,0,0,0.5);
    margin: auto;
    will-change: transform; transform: translateZ(0);
    /* ★ FIX: 子孫のペイントを #device の箱（角丸込み）に強制クリップ。
       will-change で合成レイヤー化した子が親クリップを
       すり抜ける Chrome/Safari のバグを封じる */
    contain: paint;
}
        /* ★ パンチホールカメラ（デバッグ用） */
#punch-hole {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 18px;
    background: #000;
    border-radius: 50%;
    z-index: 13000;
    pointer-events: none;
    box-shadow: inset 0 0 2px 1px rgba(255,255,255,0.05),
                0 0 4px rgba(0,0,0,0.9);
    display: none;   /* JSで切替 */
}

        /* --- 壁紙システムレイヤー --- */
        #wallpaper-container {
            position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        #wallpaper-container iframe {
            width: 100%; height: 100%; border: none; pointer-events: none;
        }

        /* --- ステータスバー & クイックパネル --- */
        #status-bar { 
            position: absolute; top: 0; width: 100%; height: 44px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 35px; box-sizing: border-box; font-size: 13px; font-weight: 600; 
            z-index: 12000; cursor: pointer;
        }

/* 再生中インジケーター (Dynamic Island) */
#playing-indicator {
    position: absolute; 
    top: 9px; 
    left: 32%; 
    /* 初期状態：中央に配置しつつ、少し小さくしておく */
    transform: translateX(-50%) scale(0.8); 
    height: 24px; 
    min-width: 50px; /* ご希望のサイズ */
    background: #000; 
    border-radius: 14px;
    
    /* display: noneは使わず、常にflexにしておく（透明度で隠す） */
    display: flex; 
    align-items: center; 
    justify-content: center;
    padding: 0 12px; 
    gap: 8px; 
    z-index: 12500;
    border: 0.5px solid rgba(255,255,255,0.2);
    color: #fff; 
    font-size: 10px;

    /* 透明度とクリック不可の設定 */
    opacity: 0;
    pointer-events: none; 
    
    /* これが「開く時」も「閉じる時」も効きます */
    transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
}

/* 表示時の状態：ここをクラスの付け外しで制御する */
#playing-indicator.active {
    opacity: 1;
    transform: translateX(-50%) scale(1);
    pointer-events: auto;
}

/* 波のアニメーションなどはそのままでOK */
.playing-wave { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
.playing-wave span { width: 2px; background: var(--accent); animation: wave 0.8s infinite ease-in-out; }
.playing-wave span:nth-child(2) { animation-delay: 0.2s; }
.playing-wave span:nth-child(3) { animation-delay: 0.4s; }
@keyframes wave { 0%, 100% { height: 3px; } 50% { height: 10px; } }


/* ★ 共通パネル（クイック / 通知で共有） */
.slide-panel {
    position: absolute;
    top: -100px;
    left: 0;
    width: 100%;
    max-height: calc(75vh + 70px);    
    background: rgba(20, 20, 20, 0.7);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    z-index: 11500;
    border-radius: 0 0 40px 40px;
    border-bottom: 0.5px solid rgba(255,255,255,0.2);
    transform: translateY(-100%);
    transition: transform 0.35s ease-out;
    display: flex;
    flex-direction: column;
     padding: 120px 20px 20px 30px;     
    box-sizing: border-box;
    color: #fff;
    overflow-y: auto;
    overscroll-behavior: contain;
}
.slide-panel.active { transform: translateY(0); }
.slide-panel::-webkit-scrollbar { width: 3px; }
.slide-panel::-webkit-scrollbar-track { background: transparent; }
.slide-panel::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.3);
    border-radius: 10px;
}


/* ★ 追加：ステータスバー左右分割 */
#status-bar { touch-action: none; }
.status-half {
    height: 100%;
    display: flex;
    align-items: center;
    touch-action: none;                /* ★ ブラウザスクロールを完全に殺す */
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    /* ★ 念のため子要素もタッチ透過に */
    pointer-events: auto;
}
/* 子要素がタッチを吸わないように */
.status-half > * {
    pointer-events: none;
}
#status-left {
    flex: 1;
    justify-content: flex-start;
}
#status-right {
    flex: 1;
    justify-content: flex-end;
}

/* ★ 追加：パネル共通バックドロップ */
/* ===== パネル共通バックドロップ ===== */
#panel-backdrop {
    position: absolute;
    inset: 0;
    z-index: 11400;
    display: block;                 /* ★ 常にblock（display はアニメ不可） */
    pointer-events: none;
    background: rgba(0,0,0,0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition:
        backdrop-filter 0.35s cubic-bezier(0.32, 0.72, 0.24, 1),
        -webkit-backdrop-filter 0.35s cubic-bezier(0.32, 0.72, 0.24, 1),
        background 0.35s cubic-bezier(0.32, 0.72, 0.24, 1);
    /* ★ will-change は使わない（前回の filter と同様の問題が出るため） */
}
#panel-backdrop.active {
    pointer-events: auto;
    background: rgba(0,0,0,0.32);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
}
/* ★ 通知パネル固有の調整なし。
   .slide-panel の padding をそのまま使う */
#notification-panel {
    /* 左右だけ変えたい場合のみ書く。上下は書かない */
    padding-left: 20px;
    padding-right: 20px;
    /* ★ 画面の半分より下に行かないように制限
       .slide-panel は top:-100px なので +100px で下端=50vh になる */
    max-height: calc(50vh + 100px) !important;
}

.quick-grid {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;   /* ← center → flex-start に変更 */
    gap: 18px;
    padding: 1px 0;
    margin-top: 10px;
}
        .quick-item:active {
    background: rgba(255,255,255,0.25);
    transform: scale(0.92);
}
.quick-item {
    width: 64px;
    height: 64px;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;                       /* 完全な丸 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.08);
}
        .quick-icon {
    font-size: 26px;                          /* アイコンを少し大きく */
    line-height: 1;
}
.quick-item span {
    font-size: 9px;
    opacity: 0.8;
    line-height: 1.2;
    max-width: 56px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}


        /* ロック画面 */
        #lock-screen { 
            position: absolute; inset: 0; z-index: 10000; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; 
            padding: 100px 20px 80px; box-sizing: border-box; background: #000;
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.4s;
        }
        #lock-bg-blur { 
            position: absolute; inset: 0; background-size: cover; background-position: center; 
            filter: blur(20px); transform: scale(1.1); z-index: -1; opacity: 0.6;
        }
        #lock-clock { font-size: 80px; font-weight: 200; text-shadow: 0 0 20px rgba(0,0,0,0.3); }
        
        #slider-container { 
            width: 280px; height: 60px; background: rgba(255,255,255,0.1); 
            border-radius: 30px; position: relative; backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.2); overflow: hidden;
            touch-action: none;
        }
        #slider-track { 
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; 
            font-size: 14px; color: rgba(255,255,255,0.6); letter-spacing: 1px; pointer-events: none;
        }
        #slider-handle { 
            width: 50px; height: 50px; background: #fff; border-radius: 50%; 
            position: absolute; top: 5px; left: 5px; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); will-change: transform;
        }
        #lock-screen.unlocked { transform: scale(1.2) translateY(-20px); opacity: 0; pointer-events: none; }

                /* デスクトップ & アイコン移動システム */
        #desktop { 
            height: 100%; width: 100%; 
            position: relative; 
            padding: 60px 15px 120px; box-sizing: border-box; 
            background-size: cover; background-position: center; transition: opacity 0.3s; opacity: 0;
            overflow: hidden;
            z-index: 5;
        }
        #desktop.active { opacity: 1; }

/* ===== 壁紙ズーム（デスクトップが引く + 壁紙が放射状に拡張） ===== */
/* ===== 壁紙ズーム（デスクトップが引く + 壁紙が放射状に拡張） ===== */
#device {
    --zoom-ox: 50%;
    --zoom-oy: 50%;
}

/* 壁紙レイヤー（背面）が放射状に拡張 */
#wallpaper-container {
    transform-origin: var(--zoom-ox) var(--zoom-oy);
    transition: transform 0.55s cubic-bezier(0.32, 0.72, 0.24, 1);
    will-change: transform;
    background-size: cover;
    background-position: center;
}
#wallpaper-container.wallpaper-zooming {
    transform: scale(1.15) translateZ(0);
}

/* デスクトップ（アイコン）が縮んでぼける */
/* デスクトップ：filter は使わない。transform だけ */
#desktop {
    transform-origin: var(--zoom-ox) var(--zoom-oy);
    will-change: transform;               /* filter は外す */
    transition:
        opacity 0.3s,
        transform 0.5s cubic-bezier(0.32, 0.72, 0.24, 1);
    background: transparent !important;
}
#desktop.wallpaper-zooming {
    transform: scale(0.85) translateZ(0);
    pointer-events: none;
    /* filter は書かない */
}

/* 壁紙はそのまま */
#wallpaper-container {
    transform-origin: var(--zoom-ox) var(--zoom-oy);
    will-change: transform;
    transition: transform 0.55s cubic-bezier(0.32, 0.72, 0.24, 1);
    background-size: cover;
    background-position: center;
}
#wallpaper-container.wallpaper-zooming {
    transform: scale(1.15) translateZ(0);
}

/* ★ ぼかしレイヤー：常に存在し、opacity だけ動かす */
#wallpaper-blur-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 500;                         /* desktop(5) と window(1000) の間 */
    backdrop-filter: blur(14px) brightness(0.6);
    -webkit-backdrop-filter: blur(14px) brightness(0.6);
    opacity: 0;
    transition: opacity 0.5s cubic-bezier(0.32, 0.72, 0.24, 1);
    will-change: opacity;
}
#device.wallpaper-zooming #wallpaper-blur-overlay {
    opacity: 1;
}

/* （任意）重ね backdrop-filter による性能低下を避ける */
#device.wallpaper-zooming .app-icon .icon-box {
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
}
        
        .app-icon { 
            position: absolute; 
            display: flex; flex-direction: column; align-items: center; cursor: pointer; 
            width: 80px; height: 95px; 
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
            touch-action: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .app-icon.moving { 
            opacity: 0.8; 
            transform: scale(1.1); 
            z-index: 10000; 
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.4));
            transition: none;
        }
        .edit-mode .app-icon:not(.moving) {
            animation: shake 0.3s infinite ease-in-out;
        }
        @keyframes shake {
            0%   { transform: rotate(-1deg); }
            50%  { transform: rotate(1deg); }

        }

        .icon-box { width: 60px; height: 60px; background: var(--glass); border-radius: 16px; backdrop-filter: blur(15px); border: 0.5px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; overflow: hidden; font-size: 30px; pointer-events: none; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .icon-box img { width: 100%; height: 100%; object-fit: cover; }
        .icon-label { margin-top: 6px; font-size: 10px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.8); text-align: center; width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: none; }

        #window-layer { 
    position: absolute; inset: 0; pointer-events: none; z-index: 1000;
    perspective: 1000px;               /* ★ 追加：子の3D変形を投影 */
    perspective-origin: 50% 50%;       /* ★ 追加 */
}
#window-layer > * { pointer-events: auto; }
@property --win-rotate-y {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
}
.window { 
    position: absolute; inset: 0; background: var(--win-bg); color: var(--text-dark); 
    z-index: 1000; display: flex; flex-direction: column; 
    opacity: 0; pointer-events: none;
    border-radius: 200px;
    /* ★ rotateX と rotateY を両方組み込む */
    transform: 
        scale(0.1) scaleX(0.85)
        rotateX(var(--win-rotate-x, 0deg))
        rotateY(var(--win-rotate-y, 0deg));
    transform-origin: 50% 50%;
    transform-style: preserve-3d;         /* ★ 追加 */
    will-change: transform, opacity, border-radius;
    backface-visibility: hidden;
    overflow: hidden;
    /* ★ perspective は親 (#window-layer) に移したので削除 */
    --win-rotate-x: 0deg;                 /* ★ 追加 */
    --win-rotate-y: 0deg;
    transition: 
        transform 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        --win-rotate-x 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),  /* ★ 追加 */
        --win-rotate-y 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        border-radius 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        opacity 0.30s linear 0.12s;
}

.window.active { 
    transform: scale(1) scaleX(1) rotateX(0deg) rotateY(0deg);
    opacity: 1; pointer-events: auto; 
    left: 0 !important; top: 0 !important; 
    width: 100% !important; height: 100% !important; 
    /* ★ FIX: #device の border-radius(55px) - border(12px) = 43px
       ウィンドウ自身にも同じ角丸を付けることで、
       親の overflow:hidden クリッピングが合成タイミングで
       抜けても角丸が維持される（二重の安全策） */
    border-radius: 43px;
    overflow: hidden;
    transition: 
        transform 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        --win-rotate-x 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        --win-rotate-y 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        border-radius 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        opacity 0.14s linear;
}
.window.minimized { 
    transform: 
        scale(0.1) scaleX(0.85)
        rotateX(var(--win-rotate-x, 0deg))    /* ★ 追加 */
        rotateY(var(--win-rotate-y, 0deg)) !important; 
    opacity: 0; pointer-events: none;
    border-radius: 200px !important;
    /* ★ 閉じる時のフェードを早める */
    transition: 
        transform 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        --win-rotate-x 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),  /* ★ 追加 */
        --win-rotate-y 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        border-radius 0.42s cubic-bezier(0.32, 0.72, 0.24, 1),
        opacity 0.26s linear 0.06s;
}

  --fg-distortion-filter: none;

  position: relative;
  backdrop-filter: blur(var(--fg-blur));
  -webkit-backdrop-filter: blur(var(--fg-blur));
  background: rgba(255,255,255,0.08);
  box-shadow: var(--fg-box-shadow);
  border: 0.5px solid rgba(255,255,255,0.15);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
}

/* 疑似要素で光沢・反射・歪みを重ねる */
.fluid-glow::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--fg-tint);
  backdrop-filter: blur(var(--fg-blur));
  -webkit-backdrop-filter: blur(var(--fg-blur));
  filter: var(--fg-distortion-filter);
  pointer-events: none;
  border-radius: inherit;
}

.fluid-glow::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="url(%23glass-shine)" opacity="0.4"/></svg>');
  background-size: 100% 100%;
  opacity: var(--fg-shine-opacity);
  pointer-events: none;
  border-radius: inherit;
  mix-blend-mode: overlay;
}

/* 内部テキスト・アイコンは前面に */
.fluid-glow > * {
  position: relative;
  z-index: 2;
}

/* ---- レベル別 ---- */

/* OFF: 効果なし */
.fluid-glow-level-off .fluid-glow,
.fluid-glow-level-off .fluid-glow::before,
.fluid-glow-level-off .fluid-glow::after {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  filter: none !important;
  background: rgba(255,255,255,0.05) !important;
  box-shadow: none !important;
  border-color: rgba(255,255,255,0.05) !important;
}
.fluid-glow-level-off .fluid-glow::after {
  opacity: 0 !important;
}

/* LOW: 軽い歪み、低blur */
.fluid-glow-level-low .fluid-glow {
  --fg-blur: 10px;
  --fg-tint: rgba(255,255,255,0.10);
  --fg-shine-opacity: 0.25;
  --fg-distortion-filter: url(#glass-distortion-low);
  --fg-box-shadow: 0 4px 8px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.2);
}

/* MEDIUM: 標準 */
.fluid-glow-level-medium .fluid-glow {
  --fg-blur: 10px;
  --fg-tint: rgba(255,255,255,0.18);
  --fg-shine-opacity: 0.45;
  --fg-distortion-filter: url(#glass-distortion-medium);
  --fg-box-shadow: 0 8px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
}

/* HIGH: 強い歪み・光沢 */
.fluid-glow-level-high .fluid-glow {
  --fg-blur: 7px;
  --fg-tint: rgba(255,255,255,0.25);
  --fg-shine-opacity: 0.7;
  --fg-distortion-filter: url(#glass-distortion-high);
  --fg-box-shadow: 0 12px 40px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.05);
}

/* 全体的な適用対象を定義（将来の要素も含む） */
.fluid-glow-target,
#quick-panel,
#dock,
#lock-screen .quick-item,
#lock-screen #slider-container,
#desktop .app-icon .icon-box,
#switcher .switcher-card,
#switcher .switcher-card-header,
#switcher-actions .switcher-action-btn,
#passcode-pad,
#system-popup-layer .system-popup,
.modal-dialog,
.split-divider,
#yt-settings-overlay > div,
.quick-item,
.dock-item,
.setup-btn,
.passcode-btn,
.theme-option {
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2);
}


/* レベル別の上書き（各レベルで専用クラスを付与） */
.fluid-glow-level-low .fluid-glow-target,
.fluid-glow-level-low #quick-panel,
.fluid-glow-level-low #dock,
.fluid-glow-level-low #lock-screen .quick-item,
.fluid-glow-level-low #lock-screen #slider-container,
.fluid-glow-level-low #desktop .app-icon .icon-box,
.fluid-glow-level-low #switcher .switcher-card,
.fluid-glow-level-low #switcher .switcher-card-header,
.fluid-glow-level-low #switcher-actions .switcher-action-btn,
.fluid-glow-level-low #passcode-pad,
.fluid-glow-level-low #system-popup-layer .system-popup,
.fluid-glow-level-low .modal-dialog,
.fluid-glow-level-low .split-divider,
.fluid-glow-level-low #yt-settings-overlay > div,
.fluid-glow-level-low .quick-item,
.fluid-glow-level-low .dock-item,
.fluid-glow-level-low .setup-btn,
.fluid-glow-level-low .passcode-btn,
.fluid-glow-level-low .theme-option {
  --fg-blur: 5.5px;
  --fg-tint: rgba(255,255,255,0.10);
  --fg-shine-opacity: 0.25;
  --fg-distortion-filter: url(#glass-distortion-low);
  --fg-box-shadow: 0 4px 8px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.2);
  backdrop-filter: blur(var(--fg-blur));
  -webkit-backdrop-filter: blur(var(--fg-blur));
  background: rgba(255,255,255,0.08);
  box-shadow: var(--fg-box-shadow);
}

/* MEDIUM */
.fluid-glow-level-medium .fluid-glow-target,
.fluid-glow-level-medium #quick-panel,
.fluid-glow-level-medium #dock,
.fluid-glow-level-medium #lock-screen .quick-item,
.fluid-glow-level-medium #lock-screen #slider-container,
.fluid-glow-level-medium #desktop .app-icon .icon-box,
.fluid-glow-level-medium #switcher .switcher-card,
.fluid-glow-level-medium #switcher .switcher-card-header,
.fluid-glow-level-medium #switcher-actions .switcher-action-btn,
.fluid-glow-level-medium #passcode-pad,
.fluid-glow-level-medium #system-popup-layer .system-popup,
.fluid-glow-level-medium .modal-dialog,
.fluid-glow-level-medium .split-divider,
.fluid-glow-level-medium #yt-settings-overlay > div,
.fluid-glow-level-medium .quick-item,
.fluid-glow-level-medium .dock-item,
.fluid-glow-level-medium .setup-btn,
.fluid-glow-level-medium .passcode-btn,
.fluid-glow-level-medium .theme-option {
  --fg-blur: 10px;
  --fg-tint: rgba(255,255,255,0.18);
  --fg-shine-opacity: 0.45;
  --fg-distortion-filter: url(#glass-distortion-medium);
  --fg-box-shadow: 0 8px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
  backdrop-filter: blur(var(--fg-blur));
  -webkit-backdrop-filter: blur(var(--fg-blur));
  background: rgba(255,255,255,0.12);
  box-shadow: var(--fg-box-shadow);
}

/* HIGH */
.fluid-glow-level-high .fluid-glow-target,
.fluid-glow-level-high #quick-panel,
.fluid-glow-level-high #dock,
.fluid-glow-level-high #lock-screen .quick-item,
.fluid-glow-level-high #lock-screen #slider-container,
.fluid-glow-level-high #desktop .app-icon .icon-box,
.fluid-glow-level-high #switcher .switcher-card,
.fluid-glow-level-high #switcher .switcher-card-header,
.fluid-glow-level-high #switcher-actions .switcher-action-btn,
.fluid-glow-level-high #passcode-pad,
.fluid-glow-level-high #system-popup-layer .system-popup,
.fluid-glow-level-high .modal-dialog,
.fluid-glow-level-high .split-divider,
.fluid-glow-level-high #yt-settings-overlay > div,
.fluid-glow-level-high .quick-item,
.fluid-glow-level-high .dock-item,
.fluid-glow-level-high .setup-btn,
.fluid-glow-level-high .passcode-btn,
.fluid-glow-level-high .theme-option {
  --fg-blur: 18px;
  --fg-tint: rgba(255,255,255,0.25);
  --fg-shine-opacity: 0.7;
  --fg-distortion-filter: url(#glass-distortion-high);
  --fg-box-shadow: 0 12px 40px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.05);
  backdrop-filter: blur(var(--fg-blur));
  -webkit-backdrop-filter: blur(var(--fg-blur));
  background: rgba(255,255,255,0.18);
  box-shadow: var(--fg-box-shadow);
}

/* ダークモード対応 */
[data-theme="dark"] .fluid-glow-target,
[data-theme="dark"] #quick-panel,
[data-theme="dark"] #dock,
[data-theme="dark"] #lock-screen .quick-item,
[data-theme="dark"] #lock-screen #slider-container,
[data-theme="dark"] #desktop .app-icon .icon-box,
[data-theme="dark"] #switcher .switcher-card,
[data-theme="dark"] #switcher .switcher-card-header,
[data-theme="dark"] #switcher-actions .switcher-action-btn,
[data-theme="dark"] #passcode-pad,
[data-theme="dark"] #system-popup-layer .system-popup,
[data-theme="dark"] .modal-dialog,
[data-theme="dark"] .split-divider,
[data-theme="dark"] #yt-settings-overlay > div,
[data-theme="dark"] .quick-item,
[data-theme="dark"] .dock-item,
[data-theme="dark"] .setup-btn,
[data-theme="dark"] .passcode-btn,
    [data-theme="dark"] .theme-option {
      --fg-tint: rgba(0,0,0,0.25);
      background: rgba(0,0,0,0.20);
      border-color: rgba(255,255,255,0.08);
    }

    /* ===== 設定ページ遷移アニメーション ===== */
    @keyframes settingsSlideInRight {
        from { opacity: 0; transform: translateX(36px); }
        to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes settingsSlideInLeft {
        from { opacity: 0; transform: translateX(-36px); }
        to   { opacity: 1; transform: translateX(0); }
    }
    .settings-slide-in-right > *,
    .settings-slide-in-left  > * {
        animation-duration: 0.34s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        animation-fill-mode: both;
    }
    .settings-slide-in-right > * { animation-name: settingsSlideInRight; }
    .settings-slide-in-left  > * { animation-name: settingsSlideInLeft;  }

    /* メインリストのカードデザイン */
    .settings-group {
        margin: 8px 16px 20px;
        background: rgba(128,128,128,0.06);
        border-radius: 16px;
        overflow: hidden;
        border: 0.5px solid rgba(128,128,128,0.1);
    }
    .settings-group-title {
        font-size: 12px;
        font-weight: 700;
        opacity: 0.55;
        padding: 20px 20px 8px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }
    .settings-row {
        display: flex; align-items: center; gap: 14px;
        padding: 14px 16px;
        border-bottom: 0.5px solid rgba(128,128,128,0.08);
        cursor: pointer;
        transition: background 0.18s ease;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row:active { background: rgba(128,128,128,0.14); }
    .settings-row .ic {
        width: 32px; height: 32px; border-radius: 9px;
        display: flex; align-items: center; justify-content: center;
        font-size: 17px; color: #fff; flex-shrink: 0;
    }
    .settings-row .lbl { flex: 1; font-size: 15px; font-weight: 500; }
    .settings-row .arr { font-size: 18px; opacity: 0.4; }

    /* 設定ヘッダー */
    .settings-hero {
        padding: 32px 24px 24px;
        display: flex; align-items: center; gap: 16px;
        background: linear-gradient(135deg,
            color-mix(in srgb, var(--accent) 22%, transparent),
            transparent 70%);
    }
    .settings-avatar {
        width: 56px; height: 56px; border-radius: 50%;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 22px; font-weight: 700;
        box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .settings-hero-title { font-size: 20px; font-weight: 700; margin: 0; }
    .settings-hero-sub   { font-size: 12px; opacity: 0.55; margin: 4px 0 0; }

/* ============================================================
   Setup Wizard v2
   ============================================================ */
#setup-wizard {
    --setup-accent: #ff3e3e;
    --setup-bg-a: #0a0a12;
    --setup-bg-b: #1a0f1f;
    --setup-text: #ffffff;
    --setup-sub: rgba(255,255,255,0.55);
    --setup-surface: rgba(255,255,255,0.06);
    --setup-border: rgba(255,255,255,0.12);
    position: absolute; inset: 0;
    z-index: 20000;
    display: flex; flex-direction: column;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', 'Noto Sans JP', sans-serif;
    color: var(--setup-text);
    opacity: 0;
    /* ★ 色変数も一緒に補間する */
    transition: 
        opacity 0.55s ease,
        --setup-bg-a 0.7s cubic-bezier(0.4, 0, 0.2, 1),
        --setup-bg-b 0.7s cubic-bezier(0.4, 0, 0.2, 1),
        --setup-text 0.5s ease,
        --setup-sub 0.5s ease,
        --setup-surface 0.5s ease,
        --setup-border 0.5s ease;
}
#setup-wizard.visible { opacity: 1; }

/* 背景：1層 + background トランジション */
.setup-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at top left,
        color-mix(in srgb, var(--setup-accent) 22%, transparent),
        transparent 55%),
        linear-gradient(160deg, var(--setup-bg-a), var(--setup-bg-b));
    transition: background 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    z-index: 0;
    will-change: background;
}
.setup-bg-b { display: none; }

.setup-step-container {
    position: relative;
    flex: 1;
    overflow: hidden;
    z-index: 2;
}

.setup-step-inner {
    position: absolute;      /* ★ 重ねる */
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    gap: 14px;
    padding: 30px 26px 10px;
    box-sizing: border-box;
}
.setup-step-inner > *:not(.setup-logo-text):not(.setup-logo-sub) {
    opacity: 0;
    animation: setupItemIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.setup-step-inner > *:nth-child(1) { animation-delay: 0.04s; }
.setup-step-inner > *:nth-child(2) { animation-delay: 0.12s; }
.setup-step-inner > *:nth-child(3) { animation-delay: 0.20s; }
.setup-step-inner > *:nth-child(4) { animation-delay: 0.28s; }
.setup-step-inner > *:nth-child(5) { animation-delay: 0.36s; }
.setup-step-inner > *:nth-child(6) { animation-delay: 0.44s; }
.setup-step-inner > *:nth-child(7) { animation-delay: 0.52s; }
.setup-step-inner > *:nth-child(8) { animation-delay: 0.60s; }

@keyframes setupItemIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
}
.setup-step-inner.slide-in-right  { animation: stepInR  0.4s cubic-bezier(0.16,1,0.3,1) both; }
.setup-step-inner.slide-in-left   { animation: stepInL  0.4s cubic-bezier(0.16,1,0.3,1) both; }
.setup-step-inner.slide-out-left  { animation: stepOutL 0.25s ease-in both; }
.setup-step-inner.slide-out-right { animation: stepOutR 0.25s ease-in both; }
@keyframes stepInR  { from { opacity:0; transform: translateX(40px); }  to { opacity:1; transform: translateX(0); } }
@keyframes stepInL  { from { opacity:0; transform: translateX(-40px); } to { opacity:1; transform: translateX(0); } }
@keyframes stepOutL { to { opacity:0; transform: translateX(-40px); } }
@keyframes stepOutR { to { opacity:0; transform: translateX(40px); } }

/* ロゴ */
.setup-logo-text {
    font-size: 54px; font-weight: 200; letter-spacing: 10px;
    background: linear-gradient(135deg, #fff 30%, var(--setup-accent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 1;                                     /* ★ 追加 */
    animation: setupItemIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards,
               logoGlow 2.4s ease-in-out 0.55s infinite alternate;  /* ★ 2つ同時 */
}
.setup-logo-sub {
    font-size: 13px; font-weight: 500; letter-spacing: 4px;
    color: var(--setup-sub); margin-top: 6px;
    opacity: 1;   /* ★ 追加 */
}
@keyframes logoGlow {
    0%   { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--setup-accent) 40%, transparent)); }
    100% { filter: drop-shadow(0 0 24px color-mix(in srgb, var(--setup-accent) 65%, transparent)); }
}

.setup-title { font-size: 22px; font-weight: 700; margin: 6px 0 0; letter-spacing: 0.02em; }
.setup-desc  { font-size: 13.5px; line-height: 1.65; color: var(--setup-sub); margin: 0; }

.setup-icon-hero {
    font-size: 64px; line-height: 1;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.35));
    animation: heroFloat 3s ease-in-out infinite;
}
@keyframes heroFloat {
    0%,100% { transform: translateY(0)    rotate(-2deg); }
    50%     { transform: translateY(-8px) rotate(2deg); }
}

.setup-info-list { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.setup-info-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--setup-surface);
    border: 1px solid var(--setup-border);
    border-radius: 16px;
    text-align: left;
}
.setup-info-item .info-icon { font-size: 22px; flex-shrink: 0; }
.info-title { font-size: 13px; font-weight: 700; }
.info-sub   { font-size: 11.5px; color: var(--setup-sub); margin-top: 2px; }

.setup-btn-primary, .setup-btn-secondary {
    padding: 14px 30px;
    border-radius: 999px;
    border: none;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s cubic-bezier(0.16,1,0.3,1),
                background 0.2s, opacity 0.2s, box-shadow 0.3s, color 0.3s;
}
.setup-btn-primary {
    background: var(--setup-accent);
    color: #fff;
    box-shadow: 0 8px 26px color-mix(in srgb, var(--setup-accent) 45%, transparent);
}
.setup-btn-primary:active { transform: scale(0.94); }
.setup-btn-primary:disabled { opacity: 0.55; pointer-events: none; }
.setup-btn-primary.success {
    background: #34c759;
    box-shadow: 0 8px 26px rgba(52,199,89,0.5);
}
.setup-btn-secondary {
    background: var(--setup-surface);
    color: var(--setup-text);
    border: 1px solid var(--setup-border);
}
.setup-btn-secondary:active { transform: scale(0.94); }
.setup-btn-large { width: 100%; max-width: 300px; padding: 18px 30px; font-size: 16px; }

.setup-btn-row {
    display: flex; gap: 12px; justify-content: center;
    width: 100%; margin-top: 10px;
}
.setup-btn-row .setup-btn-primary,
.setup-btn-row .setup-btn-secondary { flex: 1; max-width: 160px; }

.setup-hint { font-size: 11px; color: var(--setup-sub); opacity: 0.7; margin: 4px 0 0; }

.setup-folder-status {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px;
    background: var(--setup-surface);
    border: 1px solid var(--setup-border);
    border-radius: 999px;
    font-size: 12.5px;
    transition: background 0.3s, border-color 0.3s;
}
.status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background 0.3s;
}
.setup-folder-status.loading .status-dot {
    background: var(--setup-accent);
    animation: pulseDot 1s ease-in-out infinite;
}
.setup-folder-status.success { background: rgba(52,199,89,0.15); border-color: rgba(52,199,89,0.4); }
.setup-folder-status.success .status-dot { background: #34c759; }
.setup-folder-status.error  { background: rgba(255,60,60,0.15); border-color: rgba(255,60,60,0.35); }
.setup-folder-status.error .status-dot { background: #ff3e3e; }
@keyframes pulseDot {
    0%,100% { transform: scale(1); opacity: 1; }
    50%     { transform: scale(1.6); opacity: 0.5; }
}

.setup-input-large {
    width: 100%; max-width: 300px;
    padding: 18px 22px;
    border-radius: 20px;
    border: 2px solid var(--setup-border);
    background: var(--setup-surface);
    color: var(--setup-text);
    font-size: 20px; text-align: center;
    outline: none;
    font-family: inherit;
    transition: border-color 0.25s, background 0.25s;
}
.setup-input-large:focus {
    border-color: var(--setup-accent);
    background: rgba(255,255,255,0.09);
}
.setup-input-large::placeholder { color: var(--setup-sub); }

.setup-theme-grid { display: flex; gap: 18px; justify-content: center; margin: 6px 0; }
.setup-theme-card {
    width: 110px; height: 150px;
    border-radius: 22px;
    border: 3px solid transparent;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    font-size: 13px; font-weight: 600;
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1),
                border-color 0.35s, box-shadow 0.35s;
}
.setup-theme-card.dark  { background: #0f0f14; color: #fff; }
.setup-theme-card.light { background: #f6f6f8; color: #111; }
.setup-theme-card .theme-emoji { font-size: 42px; }
.setup-theme-card.selected {
    border-color: var(--setup-accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--setup-accent) 30%, transparent),
                0 14px 40px rgba(0,0,0,0.35);
    transform: scale(1.05);
}
.setup-theme-card:active { transform: scale(0.96); }

.setup-swatches {
    display: grid;
    grid-template-columns: repeat(5, 44px);
    gap: 14px;
    justify-content: center;
    margin: 8px 0;
}
.setup-swatch {
    width: 44px; height: 44px; border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.25s cubic-bezier(0.16,1,0.3,1),
                box-shadow 0.25s, border-color 0.25s;
}
.setup-swatch.selected {
    border-color: #fff;
    box-shadow: 0 0 0 2px currentColor, 0 0 0 5px color-mix(in srgb, currentColor 30%, transparent);
    transform: scale(1.12);
}
.setup-swatch:active { transform: scale(0.92); }
.setup-swatch-custom {
    background: conic-gradient(#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000) !important;
    box-shadow: inset 0 0 0 4px #fff, 0 2px 8px rgba(0,0,0,0.3);
}

.setup-passcode-dots {
    font-size: 30px; letter-spacing: 14px;
    color: var(--setup-text);
    margin: 4px 0 12px;
}
.setup-passcode-pad {
    display: grid;
    grid-template-columns: repeat(3, 62px);
    gap: 14px;
    justify-content: center;
}
.setup-pk-btn {
    width: 62px; height: 62px; border-radius: 50%;
    background: var(--setup-surface);
    border: 1px solid var(--setup-border);
    color: var(--setup-text);
    font-size: 20px; font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.12s;
}
.setup-pk-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
.setup-pk-btn.wide { font-size: 13px; font-weight: 700; }

.setup-check {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #34c759, #28a745);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 46px;
    box-shadow: 0 12px 40px rgba(52,199,89,0.5);
    animation: checkPop 0.7s cubic-bezier(0.16, 1.6, 0.4, 1) both;
}
@keyframes checkPop {
    0%   { transform: scale(0);   opacity: 0; }
    60%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
}

.setup-progress {
    display: flex; gap: 8px; justify-content: center;
    padding: 16px 0 30px;
    z-index: 2;
}
.setup-progress-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    transition: background 0.35s, width 0.35s cubic-bezier(0.16,1,0.3,1);
}
.setup-progress-dot.active {
    width: 22px; border-radius: 4px;
    background: var(--setup-accent);
}
.setup-progress-dot.done { background: rgba(255,255,255,0.5); }
/* ===== テーマ切替時の文字・枠線もなめらかに ===== */
.setup-title,
.setup-desc,
.setup-hint,
.info-title,
.info-sub,
.setup-logo-sub,
.setup-passcode-dots,
.setup-folder-status,
.setup-info-item {
    transition: color 0.5s ease,
                background-color 0.5s ease,
                border-color 0.5s ease;
}
        /* ===== 設定アプリ：スクロールバー非表示 ===== */

    /* ============================================================
   PaaOS Rev.2 — テーマ変数・ライトモード視認性・通知・設定UI・スイッチャー
   ============================================================ */

/* ---- テーマ変数（テーマ別に自動切替） ---- */
:root {
    --surface:        rgba(255,255,255,0.72);
    --surface-2:      rgba(0,0,0,0.04);
    --surface-3:      rgba(0,0,0,0.07);
    --text-primary:   #0a0a0a;
    --text-secondary: rgba(0,0,0,0.62);
    --text-tertiary:  rgba(0,0,0,0.42);
    --border-color:   rgba(0,0,0,0.10);
    --shadow-color:   rgba(0,0,0,0.12);
    --shadow-strong:  rgba(0,0,0,0.22);

    --popup-bg:       rgba(255,255,255,0.92);
    --popup-fg:       #0a0a0a;
    --popup-title:    #0a0a0a;
    --popup-border:   rgba(0,0,0,0.08);
}
[data-theme="dark"] {
    --surface:        rgba(28,28,30,0.78);
    --surface-2:      rgba(255,255,255,0.06);
    --surface-3:      rgba(255,255,255,0.10);
    --text-primary:   #ffffff;
    --text-secondary: rgba(255,255,255,0.66);
    --text-tertiary:  rgba(255,255,255,0.42);
    --border-color:   rgba(255,255,255,0.14);
    --shadow-color:   rgba(0,0,0,0.45);
    --shadow-strong:  rgba(0,0,0,0.6);

    --popup-bg:       rgba(28,28,30,0.92);
    --popup-fg:       #ffffff;
    --popup-title:    #ffffff;
    --popup-border:   rgba(255,255,255,0.14);
}

/* ---- ステータスバー：明るい壁紙でも暗い壁紙でも読める ---- */
#status-bar { text-shadow: 0 1px 3px rgba(0,0,0,0.45); }
html[data-wallpaper-tone="light"] #status-bar { text-shadow: 0 1px 3px rgba(255,255,255,0.5); }

/* ---- アイコンラベル：ライト壁紙で影を弱く ---- */
.icon-label { text-shadow: 0 1px 3px rgba(0,0,0,0.85); }
html[data-wallpaper-tone="light"] .icon-label { text-shadow: 0 1px 3px rgba(255,255,255,0.75); color: #000; }

/* ---- ロック時計 ---- */
#lock-clock { text-shadow: 0 2px 20px rgba(0,0,0,0.45); }
html[data-wallpaper-tone="light"] #lock-clock { text-shadow: 0 2px 20px rgba(255,255,255,0.5); }

/* ---- 通知ポップアップ（テーマ連動 + Fluid Glow 強化） ---- */
.system-popup {
    background: var(--popup-bg) !important;
    color: var(--popup-fg) !important;
    border: 0.5px solid var(--popup-border) !important;
    box-shadow: 0 10px 30px var(--shadow-strong) !important;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
}
.system-popup strong { color: var(--popup-title); display:block; font-weight:700; }
.system-popup span   { color: var(--popup-fg); font-size: 13px; line-height:1.35; }

/* Fluid Glow 有効時はさらに濃く（文字コントラスト確保） */
.fluid-glow-level-low  .system-popup { background: color-mix(in srgb, var(--popup-bg) 100%, transparent) !important; }
.fluid-glow-level-medium .system-popup { background: color-mix(in srgb, var(--popup-bg) 100%, transparent) !important; }
.fluid-glow-level-high .system-popup  { background: color-mix(in srgb, var(--popup-bg) 100%, transparent) !important; }

/* ============================================================
   設定アプリ：統一コンポーネント
   ============================================================ */
.settings-page { padding: 0 0 40px 0; color: var(--text-primary); }

.settings-hero {
    padding: 32px 24px 22px;
    display: flex; align-items: center; gap: 16px;
    background: linear-gradient(135deg,
        color-mix(in srgb, var(--accent) 24%, transparent),
        transparent 72%);
    border-bottom: 0.5px solid var(--border-color);
}
.settings-avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px; font-weight: 700;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent);
}
.settings-hero-title { font-size: 20px; font-weight: 700; margin: 0; color: var(--text-primary); }
.settings-hero-sub   { font-size: 12px; color: var(--text-secondary); margin: 4px 0 0; }

.settings-section-title {
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    color: var(--text-secondary);
    text-transform: uppercase;
    padding: 22px 24px 8px;
}

.settings-group {
    margin: 0 16px 16px;
    background: var(--surface-2);
    border-radius: 16px;
    overflow: hidden;
    border: 0.5px solid var(--border-color);
}
.settings-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border-bottom: 0.5px solid var(--border-color);
    cursor: pointer;
    transition: background 0.18s ease;
    color: var(--text-primary);
    text-decoration: none;
}
.settings-row:last-child { border-bottom: none; }
.settings-row:active { background: var(--surface-3); }
.settings-row .ic {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #fff; flex-shrink: 0;
}
.settings-row .lbl { flex: 1; font-size: 15px; font-weight: 500; color: var(--text-primary); }
.settings-row .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.settings-row .arr { font-size: 18px; color: var(--text-tertiary); }
.settings-row .val { font-size: 13px; color: var(--text-secondary); }

/* 設定カード（画面ごとのまとまり） */
.settings-card {
    margin: 0 16px 16px;
    background: var(--surface-2);
    border-radius: 16px;
    padding: 4px 0;
    border: 0.5px solid var(--border-color);
}
.settings-card-title {
    font-size: 12px; font-weight: 700;
    color: var(--text-secondary);
    padding: 14px 16px 8px;
    letter-spacing: 0.04em;
}
.settings-card .settings-row { padding: 14px 16px; }

/* 入力欄 */
.settings-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: var(--surface-2);
    color: var(--text-primary);
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    font-family: inherit;
}
.settings-input:focus { border-color: var(--accent); }
.settings-input::placeholder { color: var(--text-tertiary); }

.settings-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
}

/* ボタン（統一） */
.settings-btn {
    width: 100%; padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s, background 0.2s, opacity 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.settings-btn:active { transform: scale(0.97); }
.settings-btn.primary { background: var(--accent); color: #fff; }
.settings-btn.danger  { background: #d32f2f; color: #fff; }
.settings-btn.warn    { background: #f57c00; color: #fff; }
.settings-btn.green   { background: #34c759; color: #fff; }
.settings-btn.blue    { background: #0a84ff; color: #fff; }
.settings-btn.purple  { background: #9C27B0; color: #fff; }
.settings-btn.ghost   { background: var(--surface-3); color: var(--text-primary); }

.settings-btn-row { display:flex; gap:10px; }

/* ヘッダー */
.settings-hero-title-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 20px 10px;
    border-bottom: 0.5px solid var(--border-color);
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: sticky; top: 0; z-index: 10;
}
.settings-hero-title-bar h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--text-primary); }
.settings-hero-title-bar .back { font-size: 18px; cursor: pointer; padding: 4px 8px; color: var(--accent); }

/* ============================================================
   アプリスイッチャー（iOS 風：重ね＋サムネのみ）
   ============================================================ */

#switcher {
    padding: 0 !important;
    /* scroll-snap-type は cardsContainer 側に任せる */
    gap: 0 !important;
    overflow: hidden;
    align-items: center;
    box-sizing: border-box;
}
#switcher::-webkit-scrollbar { width:0; height:0; display:none; }
#switcher.active { display: flex; }

.switcher-card {
    min-width: 82% !important;
    width: 82% !important;
    height: 460px !important;
    max-height: calc(100% - 40px) !important;
    border-radius: 28px !important;
    margin-right: -32px !important;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55) !important;
    scroll-snap-align: center;
    touch-action: none;   /* ★ 追加：横パンはブラウザに任せる */
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1),
                opacity 0.35s,
                box-shadow 0.35s;
    will-change: transform, opacity, border-radius;
    backface-visibility: hidden;
    transform-origin: center center;
}
.switcher-card.visible { opacity: 1 !important; transform: scale(1) !important; }
.switcher-card.closing { opacity: 0 !important; transform: translateY(-60%) scale(0.85) !important; }

.switcher-card-header {
    padding: 16px 18px !important;
    font-size: 14px !important;
    min-height: 54px;
    box-sizing: border-box;
    background: var(--surface-2) !important;
    color: var(--text-primary) !important;
    border-bottom: 0.5px solid var(--border-color) !important;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.switcher-card-body {
    background-size: cover !important;
    background-position: top center !important;
    background-color: #000 !important;
    overflow: hidden !important;
}

/* スイッチャー下部ボタン */
#switcher-actions {
    position: absolute;
    bottom: 68px;
    left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px;
    z-index: 20;
}
.switcher-action-btn {
    background: var(--surface) !important;
    color: var(--text-primary) !important;
    border: 0.5px solid var(--border-color) !important;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

/* ============================================================
   ホームバー（ジェスチャー用に少し拡大）
   ============================================================ */
#home-bar-container { height: 34px; }
#home-bar { 
    width: 140px; 
    height: 5px; 
    touch-action: none; 
    cursor: grab; 
    position: relative;              /* ★ 疑似要素の基準 */
}
#home-bar:active { cursor: grabbing; }

/* ★ ホームバー本体 + その下の空白を当たり判定にする */
#home-bar::after {
    content: '';
    position: absolute;
    top: 0;                          /* バー上端から */
    left: 0;                         /* 左右は拡張しない */
    right: 0;
    bottom: -50px;                   /* 下に50px（端末下端で自動クリップ） */
    pointer-events: auto;
    cursor: grab;
    /* デバッグで見えるようにする時だけ↓を有効化 */
    /* background: rgba(255, 0, 0, 0.25); */
}

/* ============================================================
   カラーピッカー（PaaOS 独自）
   ============================================================ */
.paa-color-picker {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 25000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.25s ease;
    animation: fadeIn 0.2s ease forwards;
}
.paa-color-picker.active { opacity: 1; }

.paa-color-picker-inner {
    background: var(--surface);
    color: var(--text-primary);
    border-radius: 26px;
    padding: 22px;
    width: 86%;
    max-width: 340px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    animation: popIn 0.28s cubic-bezier(0.16,1,0.3,1) both;
}
.paa-color-sv {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 16px;
    overflow: hidden;
    cursor: crosshair;
    touch-action: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
}
.paa-color-sv canvas { display:block; width:100%; height:100%; }
.paa-color-sv-dot {
    position: absolute;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,0.4), 0 3px 8px rgba(0,0,0,0.35);
    transform: translate(-50%,-50%);
    pointer-events: none;
    transition: transform 0.05s;
}
.paa-color-hue {
    position: relative;
    height: 22px;
    margin-top: 16px;
    border-radius: 11px;
    cursor: pointer;
    touch-action: none;
    background: linear-gradient(90deg,
        #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%,
        #0000ff 67%, #ff00ff 83%, #ff0000 100%);
}
.paa-color-hue-dot {
    position: absolute;
    top: 50%;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: transparent;
    border: 2.5px solid #fff;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,0.4), 0 3px 8px rgba(0,0,0,0.35);
    transform: translate(-50%,-50%);
    pointer-events: none;
}
.paa-color-preview-row {
    display: flex; align-items: center; gap: 12px;
    margin-top: 16px;
}
.paa-color-preview {
    width: 48px; height: 48px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    flex-shrink: 0;
}
.paa-color-hex {
    flex: 1;
    font-family: monospace;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: var(--surface-2);
    color: var(--text-primary);
    outline: none;
}
.paa-color-actions {
    display: flex; gap: 10px; margin-top: 18px;
}
.paa-color-actions button {
    flex: 1; padding: 12px;
    border-radius: 14px;
    border: none;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
}
.paa-color-actions .ok  { background: var(--accent); color: #fff; }
.paa-color-actions .cancel { background: var(--surface-3); color: var(--text-primary); }

@keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
/* ============================================================
   Fluid Glow ライトモード：背景を20%暗く
   （黒20%オーバーレイを background-image で重ねる）
   ============================================================ */
html[data-theme="light"].fluid-glow-level-low .fluid-glow-target,
html[data-theme="light"].fluid-glow-level-medium .fluid-glow-target,
html[data-theme="light"].fluid-glow-level-high .fluid-glow-target,

html[data-theme="light"].fluid-glow-level-low #quick-panel,
html[data-theme="light"].fluid-glow-level-medium #quick-panel,
html[data-theme="light"].fluid-glow-level-high #quick-panel,

html[data-theme="light"].fluid-glow-level-low #dock,
html[data-theme="light"].fluid-glow-level-medium #dock,
html[data-theme="light"].fluid-glow-level-high #dock,

html[data-theme="light"].fluid-glow-level-low #lock-screen #slider-container,
html[data-theme="light"].fluid-glow-level-medium #lock-screen #slider-container,
html[data-theme="light"].fluid-glow-level-high #lock-screen #slider-container,

html[data-theme="light"].fluid-glow-level-low #desktop .app-icon .icon-box,
html[data-theme="light"].fluid-glow-level-medium #desktop .app-icon .icon-box,
html[data-theme="light"].fluid-glow-level-high #desktop .app-icon .icon-box,

html[data-theme="light"].fluid-glow-level-low #switcher-actions .switcher-action-btn,
html[data-theme="light"].fluid-glow-level-medium #switcher-actions .switcher-action-btn,
html[data-theme="light"].fluid-glow-level-high #switcher-actions .switcher-action-btn,

html[data-theme="light"].fluid-glow-level-low #system-popup-layer .system-popup,
html[data-theme="light"].fluid-glow-level-medium #system-popup-layer .system-popup,
html[data-theme="light"].fluid-glow-level-high #system-popup-layer .system-popup,

html[data-theme="light"].fluid-glow-level-low .modal-dialog,
html[data-theme="light"].fluid-glow-level-medium .modal-dialog,
html[data-theme="light"].fluid-glow-level-high .modal-dialog,

html[data-theme="light"].fluid-glow-level-low .quick-item,
html[data-theme="light"].fluid-glow-level-medium .quick-item,
html[data-theme="light"].fluid-glow-level-high .quick-item,

html[data-theme="light"].fluid-glow-level-low .dock-item,
html[data-theme="light"].fluid-glow-level-medium .dock-item,
html[data-theme="light"].fluid-glow-level-high .dock-item,

html[data-theme="light"].fluid-glow-level-low .setup-btn,
html[data-theme="light"].fluid-glow-level-medium .setup-btn,
html[data-theme="light"].fluid-glow-level-high .setup-btn,

html[data-theme="light"].fluid-glow-level-low .passcode-btn,
html[data-theme="light"].fluid-glow-level-medium .passcode-btn,
html[data-theme="light"].fluid-glow-level-high .passcode-btn,

html[data-theme="light"].fluid-glow-level-low .theme-option,
html[data-theme="light"].fluid-glow-level-medium .theme-option,
html[data-theme="light"].fluid-glow-level-high .theme-option {
    background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)) !important;
}

/* ===== ダイアログ 閉じアニメーション ===== */
.modal-dialog-overlay {
    transition: opacity 0.22s ease;
}
.modal-dialog-overlay.closing {
    opacity: 0;

    /* ★ OOM直前の RangeError を捕まえて BSOD を出す */
initOOMDetector() {
    // メモリ関連エラーの判定パターン
    const isOOMError = (msg) => {
        if (!msg) return false;
        msg = String(msg);
        return /out of memory|allocation failed|array buffer|invalid array length|array length|maximum call stack|heap|memory limit|RangeError/i.test(msg);
    };

    const handle = (errMsg, source) => {
        if (!isOOMError(errMsg)) return false;
        if (this._oomBSODTriggered) return true;
        this._oomBSODTriggered = true;

       
        try { this._preBSODCleanup(); } catch (_) {}
        this.triggerBSOD('0x000000EF_OUT_OF_MEMORY', 'JS_Engine');
        return true;
    };

    // ---- 1) メインフレームのエラー ----
    window.addEventListener('error', (e) => {
        handle(e.message, 'main:error');
    }, true);

    // ---- 2) Promise の未処理拒否 ----
    window.addEventListener('unhandledrejection', (e) => {
        const msg = e.reason?.message || e.reason || '';
        handle(msg, 'main:rejection');
    });

    // ---- 3) 各iframeのエラーを横取り ----
    //    PaaOSのアプリはiframeで動くので、そちらのエラーも拾う
    this._installIframeErrorHook = (frame) => {
        const attach = () => {
            try {
                const w = frame.contentWindow;
                if (!w || w.__paaosOOMHooked) return;
                w.__paaosOOMHooked = true;
                w.addEventListener('error', (ev) => {
                    handle(ev.message, 'iframe:error');
                }, true);
                w.addEventListener('unhandledrejection', (ev) => {
                    const msg = ev.reason?.message || ev.reason || '';
                    handle(msg, 'iframe:rejection');
                });
            } catch (_) { /* cross-origin は無視 */ }
        };
        frame.addEventListener('load', attach);
        // 既にロード済みの場合
        attach();
    };

    // 既存のiframeに適用
    document.querySelectorAll('iframe').forEach(f => this._installIframeErrorHook(f));

    // 新規iframeを監視（launch で作られるものも捕捉）
    if (!this._oomIframeObserver) {
        this._oomIframeObserver = new MutationObserver((muts) => {
            for (const m of muts) {
                for (const node of m.addedNodes) {
                    if (node.nodeType === 1) {
                        if (node.tagName === 'IFRAME') {
                            this._installIframeErrorHook(node);
                        }
                        node.querySelectorAll?.('iframe').forEach(f => this._installIframeErrorHook(f));
                    }
                }
            }
        });
        this._oomIframeObserver.observe(document.getElementById('device') || document.body, {
            childList: true, subtree: true
        });
    }


}

    /* ★ パンチホールカメラ（デバッグ用）
       <head> 内の const displaycamera で ON/OFF を切り替える */
    initPunchHole() {
        if (typeof displaycamera === 'undefined' || !displaycamera) return;
        const el = document.getElementById('punch-hole');
        if (el) {
            el.style.display = 'block';

    // 再生状態を監視するシステム
    initMediaWatcher() {
    setInterval(() => {
        const indicators = document.getElementById('playing-indicator');
        let isAnyMediaPlaying = false;
        let currentPlayingId = null;

        // 1. システム内部アプリのメディアチェック
        const videos = document.querySelectorAll('video');
        const audios = document.querySelectorAll('audio');
        [...videos, ...audios].forEach(el => {
            if (!el.paused && !el.ended && el.readyState > 2) {  // ← !el.paused（pausedがfalseが再生中）
                isAnyMediaPlaying = true;
                let parent = el.closest('.window');
                if (parent) currentPlayingId = parent.id.replace('win-', '');
            }
        });

        // 2. iframe内のメディアチェック
        const iframes = document.querySelectorAll('iframe');  // ← iframes で宣言
        iframes.forEach(frame => {  // ← iframes を使う
            try {
                const frameDocs = frame.contentDocument || frame.contentWindow.document;
                const fVideos = frameDocs.querySelectorAll('video');
                const fAudios = frameDocs.querySelectorAll('audio');
                [...fVideos, ...fAudios].forEach(el => {
                    if (!el.paused && !el.ended && el.readyState > 2) {
                        isAnyMediaPlaying = true;
                        let parent = frame.closest('.window');
                        if (parent) currentPlayingId = parent.id.replace('win-', '');
                    }
                });
            } catch(e) {
                // クロスドメインの場合は無視
                if (frame.id?.includes('sys.youtube') || frame.src?.includes('youtube.com')) {
                    isAnyMediaPlaying = true;
                    currentPlayingId = 'sys.youtube';
                }
            }
        });

        if (isAnyMediaPlaying && currentPlayingId) {
            this.mediaAppId = currentPlayingId;
            indicators.classList.add('active');
            document.getElementById('playing-label').innerText = this.apps[this.mediaAppId]?.name || "再生中";
        } else {
            indicators.classList.remove('active');
        }
    }, 1000);
}

// 緊急コンソール (Shift+Ctrl+H) – 青背景・白文字・プログレスバー対応

initEmergencyConsole() {
    // 既存のモジュール側リスナーを上書きするため、先に削除
    document.removeEventListener('keydown', this._emergencyHandler, { capture: true });
    document.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.ctrlKey && (e.key === 'h' || e.key === 'H')) {
            e.preventDefault();
            e.stopPropagation();
            this.launchEmergencyConsole();
        }
    }, { capture: true });
}

launchEmergencyConsole() {

    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'emergency-console';
    overlay.style.cssText = `
