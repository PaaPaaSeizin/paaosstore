/* ============================================================
   クイックパネル：ドラッグ追従 + ばね挙動 + 背景ブラー
   ============================================================ */

/**
 * ドラッグ中：パネルの位置と背景ブラーを指に追従させる
 * @param {number} dy  スワイプ開始点からのY移動量（下方向が正）
 */
_updatePanelDrag(dy) {
    const panel = document.getElementById('quick-panel');
    const backdrop = document.getElementById('panel-backdrop');
    if (!panel) return;

    clearTimeout(this._panelDragCleanupTimer);

    const panelHeight = panel.offsetHeight || 400;
    const DRAG_DISTANCE = Math.min(panelHeight, 250);
    const ratio = panelHeight / DRAG_DISTANCE;

    if (this._panelDragBase === undefined) {
        const cs = getComputedStyle(panel);
        if (cs.transform && cs.transform !== 'none') {
            const m = new DOMMatrix(cs.transform);
            this._panelDragBase = m.m42;
        } else {
            this._panelDragBase = this.panelActive ? 0 : -panelHeight;
        }
    }

    let translateY = this._panelDragBase + dy * ratio;

    // ★ FIX: 開きすぎ防止
    //   パネルは top:-100px + padding-top:120px の設計なので、
    //   translateY が 0 を超えると「パネル上部の余白」が画面内に
    //   大きく覗き、コンテンツが下にずれて見える。
    //
    //   → 自然な開き位置（translateY = 0）に到達したら、
    //     それ以上の下方向追従はごく僅かなバウンスのみ許可し、
    //     上限（MAX_OPEN_OVERSHOOT）で頭打ちにする。
    //     指数的に減衰させることで「ばねが止まる」自然な手応えを維持。
    if (translateY > 0) {
        const MAX_OPEN_OVERSHOOT = 6;   // 最大バウンス量（px）
        // 漸近曲線: 小さい追従ではバウンスし、大きい追従では頭打ち
        translateY = MAX_OPEN_OVERSHOOT *
                     (1 - Math.exp(-translateY / MAX_OPEN_OVERSHOOT));
    } else if (translateY < -panelHeight) {
        // 閉じ方向のオーバーシュート（既存のまま）
        translateY = -panelHeight + (translateY + panelHeight) * 0.15;
    }

    panel.style.transition = 'none';
    panel.style.transform  = `translateY(${translateY}px)`;
    if (!panel.classList.contains('active')) panel.classList.add('active');
    if (backdrop) backdrop.classList.add('active');

    const progress = Math.max(0, Math.min(1, 1 + translateY / panelHeight));
    this._updateBackdropProgress(progress, false);
}

/**
 * 背景ブラー進捗更新
 * @param {number} p  0=透明 / 1=最大ブラー
 */
_updateBackdropProgress(p, animate = false) {
    const backdrop = document.getElementById('panel-backdrop');
    if (!backdrop) return;

    // ドラッグ中は transition を切って1:1追従、確定時は CSS に任せる
    backdrop.style.transition = animate ? 'opacity 0.35s ease' : 'none';
    backdrop.style.opacity = String(Math.max(0, Math.min(1, p)));
}

initStatusBarGestures() {
    const left  = document.getElementById('status-left');
    const right = document.getElementById('status-right');

    const attach = (el) => {
        if (!el) return;

        let startX = 0, startY = 0, startTime = 0;
        let tracking = false;
        let isDragging = false;
        let activePointerId = null;

        const TAP_MAX_MS      = 320;
        const MOVE_TOLERANCE  = 12;
        const DRAG_THRESHOLD  = 6;

        const onDown = (e) => {
            if (e.button !== undefined && e.button !== 0) return;
            if (tracking) return;
            tracking       = true;
            isDragging     = false;
            activePointerId = e.pointerId;
            startX         = e.clientX;
            startY         = e.clientY;
            startTime      = Date.now();
            try { el.setPointerCapture(e.pointerId); } catch (_) {}
            el.style.transition = 'transform 0.12s ease-out';
        };

        const onMove = (e) => {
            if (!tracking || e.pointerId !== activePointerId) return;
            const dy = e.clientY - startY;
            const dx = e.clientX - startX;

            if (!isDragging) {
                if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
                    if (Math.abs(dy) > Math.abs(dx)) {
                        // 縦ジェスチャ：向きが合っているか判定
                        if ((!this.panelActive && dy > 0) ||
                            (this.panelActive  && dy < 0)) {
                            isDragging = true;
                        } else {
                            // 向き違い → ステータスバーだけ軽く沈む
                            el.style.transform = `translateY(${Math.min(Math.abs(dy) * 0.15, 8)}px)`;
                            if (e.cancelable) e.preventDefault();
                            return;
                        }
                    } else {
                        // 横方向 → キャンセル
                        tracking = false;
                        el.style.transform = '';
                        return;
                    }
                } else {
                    // 微小移動：ステータスバーの押し込み表現のみ
                    if (dy > 0) {
                        el.style.transform = `translateY(${Math.min(dy * 0.35, 12)}px)`;
                    }
                    if (e.cancelable) e.preventDefault();
                    return;
                }
            }

            if (isDragging) {
                el.style.transform = '';
                if (e.cancelable) e.preventDefault();
                this._updatePanelDrag(dy);
            }
        };

        const onUp = (e) => {
            if (!tracking || e.pointerId !== activePointerId) return;
            tracking = false;
            const pid = e.pointerId;
            activePointerId = null;
            try { el.releasePointerCapture(pid); } catch (_) {}

            el.style.transform = '';

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const elapsed   = Date.now() - startTime;
            const moveDist  = Math.hypot(dx, dy);

            if (isDragging) {
                isDragging = false;
                this._finishPanelDrag(dy, elapsed, !!this.panelActive);
                return;
            }

            if (moveDist < MOVE_TOLERANCE && elapsed < TAP_MAX_MS) {
                this.togglePanel();
            }
        };

        const onCancel = (e) => {
            if (activePointerId !== null && e && e.pointerId !== activePointerId) return;
            tracking = false;
            isDragging = false;
            activePointerId = null;
            el.style.transform = '';
        };

        el.addEventListener('pointerdown', onDown);
        el.addEventListener('pointermove', onMove, { passive: false });
        el.addEventListener('pointerup', onUp);
        el.addEventListener('pointercancel', onCancel);
    };

    attach(left);
    attach(right);
}

/**
 * ドラッグ終了：しきい値/フリック判定で開閉を確定し、ばねアニメでスナップ
 * @param {number} dy        総移動量
 * @param {number} elapsed   経過ms
 * @param {boolean} isClosing  閉じ方向のドラッグだったか
 */
_finishPanelDrag(dy, elapsed, isClosing) {
    const panel    = document.getElementById('quick-panel');
    const backdrop = document.getElementById('panel-backdrop');
    if (!panel) return;

    const panelHeight   = panel.offsetHeight || 400;
    const DRAG_DISTANCE = Math.min(panelHeight, 250);
    const velocity      = elapsed > 0 ? Math.abs(dy) / elapsed : 0;
    const isFlick       = velocity > 0.5;

    let shouldOpen;
    if (isClosing) {
        // 上方向に 35% 以上 or 上向きフリック → 閉じる
        shouldOpen = !(dy < -DRAG_DISTANCE * 0.35 || (isFlick && dy < 0));
    } else {
        // 下方向に 35% 以上 or 下向きフリック → 開く
        shouldOpen = (dy > DRAG_DISTANCE * 0.35) || (isFlick && dy > 0);
    }

    this.panelActive = shouldOpen;

    // ばねっぽいイージング（オーバーシュート感）
    const EASE = 'cubic-bezier(0.34, 1.4, 0.64, 1)';
    panel.style.transition = `transform 0.4s ${EASE}`;
    panel.style.transform  = `translateY(${shouldOpen ? 0 : -panelHeight}px)`;

    if (shouldOpen) {
        panel.classList.add('active');
        this.renderQuickPanel();
        this.updateQuickPanel();
    } else {
        panel.classList.remove('active');
    }

    if (backdrop) {
        backdrop.style.transition = 'opacity 0.25s ease, background 0.3s ease, backdrop-filter 0.3s ease';
        if (shouldOpen) {
            backdrop.classList.add('active');
            backdrop.onclick = () => this.togglePanel();
            this._updateBackdropProgress(1);
        } else {
            backdrop.classList.remove('active');
            backdrop.onclick = null;
            this._updateBackdropProgress(0);
        }
    }

    // アニメ完了後にインライン transform / transition を掃除
    clearTimeout(this._panelDragCleanupTimer);
    this._panelDragCleanupTimer = setTimeout(() => {
        panel.style.transition = '';
        panel.style.transform  = '';
        if (backdrop) {
            backdrop.style.transition = '';
            if (!this.panelActive) {
                backdrop.style.backdropFilter = '';
                backdrop.style.webkitBackdropFilter = '';
                backdrop.style.background = '';
            }
        }
    }, 460);
}
/**
 * バックドロップ（パネル外）からの上スワイプで閉じる
 *  - パネル本体と同じ _updatePanelDrag / _finishPanelDrag を再利用
 *  - タップ → 従来通り togglePanel() で閉じる
 *  - ドラッグ → 追従＆ばねで閉じる（clickは抑止）
 */
_initBackdropSwipeToClose() {
    const backdrop = document.getElementById('panel-backdrop');
    if (!backdrop || backdrop._swipeBound) return;
    backdrop._swipeBound = true;

    let startY = 0, startX = 0;
    let tracking = false, isDragging = false, pointerId = null;
    let startTime = 0;
    let suppressClick = false;

    // ドラッグ直後の click による「再オープン/再クローズ」を抑止
    backdrop.addEventListener('click', (e) => {
        if (suppressClick) {
            e.stopImmediatePropagation();
            e.preventDefault();
        }
    }, true);

    const onDown = (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        if (!this.panelActive) return;
        // バックドロップ自身をタッチした時だけ反応（子要素に吸われない）
        if (e.target !== backdrop) return;

        tracking      = true;
        isDragging    = false;
        startY        = e.clientY;
        startX        = e.clientX;
        startTime     = Date.now();
        pointerId     = e.pointerId;
        suppressClick = false;
    };

    const onMove = (e) => {
        if (!tracking || e.pointerId !== pointerId) return;
        const dy = e.clientY - startY;
        const dx = e.clientX - startX;

        if (!isDragging) {
            if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) {
                if (dy < 0) {
                    // 上方向 → 閉じドラッグ開始
                    isDragging = true;
                    try { backdrop.setPointerCapture(e.pointerId); } catch (_) {}
                } else {
                    // 下方向 → 意味のある操作ではないので追跡終了
                    tracking = false;
                    return;
                }
            } else if (Math.abs(dx) > 8) {
                // 横方向 → キャンセル
                tracking = false;
                return;
            }
        }

        if (isDragging && dy < 0) {
            if (e.cancelable) e.preventDefault();
            this._updatePanelDrag(dy);
        }
    };

    const onUp = (e) => {
        if (!tracking || e.pointerId !== pointerId) return;
        const dy     = e.clientY - startY;
        const dx     = e.clientX - startX;
        const dt     = Date.now() - startTime;
        const moved  = Math.hypot(dx, dy);
        tracking     = false;
        pointerId    = null;

        if (isDragging) {
            isDragging = false;
            suppressClick = true;
            setTimeout(() => { suppressClick = false; }, 60);
            this._finishPanelDrag(dy, dt, true);
        } else if (moved > 12) {
            // ドラッグ判定には至らなかったが大きく動いた場合も、
            // うっかり click で閉じてしまうのを防ぐ
            suppressClick = true;
            setTimeout(() => { suppressClick = false; }, 60);
        }
        // 微小移動（タップ）→ suppressClick しない → 既存 onclick が発火して閉じる
    };

    const onCancel = () => {
        tracking   = false;
        isDragging = false;
        pointerId  = null;
    };

    backdrop.addEventListener('pointerdown', onDown);
    backdrop.addEventListener('pointermove', onMove, { passive: false });
    backdrop.addEventListener('pointerup', onUp);
    backdrop.addEventListener('pointercancel', onCancel);
}
/**
 * パネル自体の上スワイプで閉じる（コンテンツが最上部のときのみ）
 */
_initPanelSwipeToClose() {
    const panel = document.getElementById('quick-panel');
    if (!panel || panel._swipeBound) return;
    panel._swipeBound = true;

    let startY = 0, startX = 0, startScrollTop = 0;
    let tracking = false, isDragging = false, pointerId = null;
    let startTime = 0;

    const onDown = (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        if (!this.panelActive) return;
        if (e.target.closest('.quick-item')) return; // アイコンタップは無視

        tracking       = true;
        isDragging     = false;
        startY         = e.clientY;
        startX         = e.clientX;
        startScrollTop = panel.scrollTop;
        startTime      = Date.now();
        pointerId      = e.pointerId;
    };

    const onMove = (e) => {
        if (!tracking || e.pointerId !== pointerId) return;
        const dy = e.clientY - startY;
        const dx = e.clientX - startX;

        if (!isDragging) {
            // スクロール中はそちらを優先
            if (startScrollTop > 5) {
                if (Math.abs(dy) > 8) tracking = false;
                return;
            }
            if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) {
                if (dy < 0) {
                    // 上スワイプ開始 → 閉じドラッグ
                    isDragging = true;
                    panel.setPointerCapture(e.pointerId);
                    panel.style.transition = 'none';
                } else {
                    tracking = false;
                    return;
                }
            } else if (Math.abs(dx) > 8) {
                tracking = false;
                return;
            }
        }

        if (isDragging && dy < 0) {
            e.preventDefault();
            this._updatePanelDrag(dy);
        }
    };

    const onUp = (e) => {
        if (!tracking || e.pointerId !== pointerId) return;
        const dy     = e.clientY - startY;
        const dt     = Date.now() - startTime;
        tracking     = false;
        if (isDragging) {
            isDragging = false;
            this._finishPanelDrag(dy, dt, true);
        }
        pointerId = null;
    };

    const onCancel = () => {
        tracking   = false;
        isDragging = false;
        pointerId  = null;
    };

    panel.addEventListener('pointerdown', onDown);
    panel.addEventListener('pointermove', onMove, { passive: false });
    panel.addEventListener('pointerup', onUp);
    panel.addEventListener('pointercancel', onCancel);
}
togglePanel() {
    if (this.movingAppId) return;

    clearTimeout(this._panelDragCleanupTimer);
    const panel    = document.getElementById('quick-panel');
    const backdrop = document.getElementById('panel-backdrop');
    if (panel) {
        panel.style.transition = '';
        panel.style.transform  = '';
    }
    this._panelDragBase = undefined;      // ★ 追加

    this.panelActive = !this.panelActive;

    if (this.panelActive) {
        if (this.notificationPanelActive) this.closeNotificationPanel();
        panel.classList.add('active');
        if (backdrop) {
            backdrop.style.transition = '';       // ★ インライン解除
            backdrop.style.opacity = '';          // ★ CSS に任せる
            backdrop.classList.add('active');
            backdrop.onclick = () => this.togglePanel();
        }
        this.renderQuickPanel();
        this.updateQuickPanel();
    } else {
        panel.classList.remove('active');
        if (backdrop) {
            backdrop.style.transition = '';
            backdrop.style.opacity = '';
            backdrop.classList.remove('active');
            backdrop.onclick = null;
        }
    }
}

startPopupApp() {
    // スイッチャーを閉じる
    this.closeSwitcher();
    // アプリ選択ダイアログを表示
    this.showPopupAppPicker();
}

showPopupAppPicker() {
    const allApps = Object.keys(this.apps).filter(id => !this.config.hiddenApps.includes(id));
    if (allApps.length === 0) {
        this.showOSPopup('ポップアップ', 'アプリがありません');
        return;
    }

    // 選択用のシンプルなダイアログ（showDialog を流用）
    const options = {
        title: 'ポップアップで開くアプリを選択',
        html: `
            <div style="max-height:300px; overflow-y:auto; text-align:left;">
                ${allApps.map(id => `
                    <div style="display:flex; align-items:center; gap:10px; padding:8px; border-bottom:1px solid rgba(128,128,128,0.1); cursor:pointer;" onclick="kernel.launchPopupApp('${id}')">
                        <span style="font-size:20px;">${this.apps[id].icon}</span>
                        <span style="flex:1;">${this.apps[id].name}</span>
                    </div>
                `).join('')}
            </div>
        `,
        buttons: [
            { label: 'キャンセル', value: 'cancel' }
        ],
        style: { width: '300px' }
    };
    this.showDialog('ポップアップ', options.html, options.buttons, options);
}

launchPopupApp(appId) {
    // 既存のポップアップがあれば閉じる
    this.closePopupApp();

    const app = this.apps[appId];
    if (!app) {
        this.showOSPopup('エラー', 'アプリが見つかりません');
        return;
    }

    // ダイアログを閉じる（最前面のモーダルを削除）
    const overlay = document.querySelector('.modal-dialog-overlay');
    if (overlay) overlay.remove();

    // ポップアップウィンドウを作成
    const popup = this._createPopupWindow(appId);

    // 状態を保存
    this.popupState.active = true;
    this.popupState.appId = appId;
    this.popupState.window = popup;

    // runningApps に追加（launch と同じ扱い）
    if (!this.runningApps.includes(appId)) {
        this.runningApps.push(appId);
    }

    // アクティブアプリとして設定（ただし、ポップアップは独立）
    this.activeAppId = appId;

    // ドック・編集ボタンを隠す（ポップアップ中は非表示）
    document.getElementById('dock').classList.add('hidden');
    document.getElementById('edit-trigger').style.display = 'none';

    // ポップアップを表示
    popup.classList.add('active');

    // アプリのレンダリング
    this._renderPopupContent(appId, popup);
}

_createPopupWindow(appId) {
    const app = this.apps[appId];
    const state = this.popupState;

    // 既存のポップアップがあれば削除
    const old = document.getElementById('popup-window');
    if (old) old.remove();

    const popup = document.createElement('div');
    popup.id = 'popup-window';
    popup.className = 'popup-window';
    popup.style.left = state.x + 'px';
    popup.style.top = state.y + 'px';
    popup.style.width = state.width + 'px';
    popup.style.height = state.height + 'px';

    const iconHtml = this._isImageIcon(app.icon) ? `<img src="${app.icon}">` : app.icon;

    popup.innerHTML = `
        <div class="popup-header" id="popup-header">
            <div class="popup-title">
                ${iconHtml}
                <span>${app.name}</span>
            </div>
            <div class="popup-controls">
                <span onclick="kernel.minimizePopupApp()" title="最小化">─</span>
                <span class="popup-close" onclick="kernel.closePopupApp()" title="閉じる">✕</span>
            </div>
        </div>
        <div class="popup-body" id="popup-body-${appId}"></div>
        <div class="popup-resize-handle" id="popup-resize-handle"></div>
    `;

    document.getElementById('window-layer').appendChild(popup);

    // ドラッグ移動（ヘッダー）
    this._initPopupDrag(popup);

    // リサイズ
    this._initPopupResize(popup);

    return popup;
}


_renderPopupContent(appId, popup) {
    const app = this.apps[appId];
    const body = popup.querySelector('.popup-body');

    if (app.type === 'sys') {
        // システムアプリは専用のレンダリング
        // 既存の renderSysApp を流用するため、一時的に body を置き換える
        const tempBody = document.createElement('div');
        tempBody.id = 'body-' + appId;
        tempBody.style.height = '100%';
        body.appendChild(tempBody);
        // renderSysApp は id から body を取得するので、id を合わせる
        // ただし、renderSysApp は document.getElementById('body-${id}') を使うため、ここで id を設定
        tempBody.id = 'body-' + appId;
        this.renderSysApp(appId);
    } else {
        // 外部アプリは iframe
        const frame = document.createElement('iframe');
        frame.id = 'iframe-' + appId;
        frame.src = URL.createObjectURL(new Blob([app.content], { type: 'text/html' }));
        body.appendChild(frame);
    }
}

_initPopupDrag(popup) {
    const header = popup.querySelector('.popup-header');
    let isDragging = false;
    let offsetX = 0, offsetY = 0;

    const onStart = (e) => {
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
        isDragging = true;
        const rect = popup.getBoundingClientRect();
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        popup.style.transition = 'none';
        e.preventDefault();
    };

    const onMove = (e) => {
        if (!isDragging) return;
        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
        const parentRect = popup.parentElement.getBoundingClientRect();
        let newX = clientX - parentRect.left - offsetX;
        let newY = clientY - parentRect.top - offsetY;
        // 範囲制限（はみ出さないように）
        newX = Math.max(0, Math.min(parentRect.width - popup.offsetWidth, newX));
        newY = Math.max(0, Math.min(parentRect.height - popup.offsetHeight, newY));
        popup.style.left = newX + 'px';
        popup.style.top = newY + 'px';
        e.preventDefault();
    };

    const onEnd = () => {
        if (isDragging) {
            isDragging = false;
            // 位置を保存
            this.popupState.x = parseInt(popup.style.left);
            this.popupState.y = parseInt(popup.style.top);
        }
    };

    header.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    header.addEventListener('touchstart', onStart, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd, { passive: true });
}

_initPopupResize(popup) {
    const handle = popup.querySelector('.popup-resize-handle');
    let isResizing = false;
    let startX = 0, startY = 0;
    let startWidth = 0, startHeight = 0;

    const onStart = (e) => {
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
        isResizing = true;
        startX = clientX;
        startY = clientY;
        startWidth = popup.offsetWidth;
        startHeight = popup.offsetHeight;
        popup.style.transition = 'none';
        e.preventDefault();
        e.stopPropagation();
    };

    const onMove = (e) => {
        if (!isResizing) return;
        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
        const dx = clientX - startX;
        const dy = clientY - startY;
        let newWidth = Math.max(200, startWidth + dx);
        let newHeight = Math.max(150, startHeight + dy);
        popup.style.width = newWidth + 'px';
        popup.style.height = newHeight + 'px';
        e.preventDefault();
        e.stopPropagation();
    };

    const onEnd = () => {
        if (isResizing) {
            isResizing = false;
            this.popupState.width = parseInt(popup.style.width);
            this.popupState.height = parseInt(popup.style.height);
        }
    };

    handle.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    handle.addEventListener('touchstart', onStart, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd, { passive: true });
}

// ========== フォント・絵文字適用 ==========
// ========== フォント・絵文字適用 ==========
applyFontAndEmoji() {
    const fontMode = this.config.fontFamily || 'default';
    const emojiMode = this.config.emojiFamily || 'default';

    let baseFont = '-apple-system, "Segoe UI", Roboto, sans-serif';
    let finalFont = baseFont;

    if (fontMode === 'noto') {
        finalFont = "'Noto Sans JP', " + baseFont;
    }

    // ★ 絵文字フォントを**末尾**に追加（数字には影響しない）
    if (emojiMode === 'noto') {
        finalFont = finalFont + ", 'Noto Color Emoji'";
    }

    // body 全体に適用（絵文字だけが Noto Color Emoji で表示される）
    document.body.style.fontFamily = finalFont;
    document.documentElement.style.setProperty('--font-family', finalFont);

    // ★ 以前に特定要素に強制適用していたスタイルをクリア（不要になる）
    document.querySelectorAll(
        '.icon-box, .icon-label, .dock-item, .quick-icon, ' +
        '.app-icon, .switcher-card-header, .list-item, ' +
        '.notif-item, .settings-list-icon, .settings-list-label, ' +
        '.win-header, .system-popup, .modal-dialog'
    ).forEach(el => el.style.fontFamily = '');
}

minimizePopupApp() {
    if (!this.popupState.active) return;
    const popup = this.popupState.window;
    if (popup) {
        popup.classList.remove('active');
        // 最小化中はドックを表示
        document.getElementById('dock').classList.remove('hidden');
        document.getElementById('edit-trigger').style.display = 'block';
        // アクティブアプリをリセット
        this.activeAppId = null;
        this._updateStatusBarColor();   // ★ 追加
    }
}

closePopupApp() {
    if (!this.popupState.active) return;

    const appId = this.popupState.appId;
    const popup = this.popupState.window;

    // アプリを終了（runningApps から削除）
    if (appId && this.runningApps.includes(appId)) {
        this.runningApps = this.runningApps.filter(id => id !== appId);
        localStorage.removeItem(`paaos_thumb_${appId}`);
    }

    // ウィンドウ削除
    if (popup) {
        popup.remove();
    }

    // 状態リセット
    this.popupState.active = false;
    this.popupState.appId = null;
    this.popupState.window = null;
    if (this.activeAppId === appId) {
        this.activeAppId = null;
        this._updateStatusBarColor();   // ★ 追加
    }

    // ドックを表示
    document.getElementById('dock').classList.remove('hidden');
    document.getElementById('edit-trigger').style.display = 'block';
}


    
async takeSystemScreenshot() {
    // ============================================================
    // PaaOS スクリーンショット v2
    //  - 高画質（devicePixelRatio × 2）
    //  - iframe の同一オリジン HTML をインライン展開
    //  - SVGフィルタ / 透過 / blur / 反射もそのまま再現
    //  - 保存後にプレビューを右下に表示（自動で消える）
    //  - 連写対応（多重起動をキューで直列化）
    // ============================================================

    // --- 連写対応：進行中フラグ ---
    if (this._ssBusy) {
        // 既に処理中なら、終わるまで待ってから再実行
        if (!this._ssQueue) this._ssQueue = [];
        return new Promise((resolve) => {
            this._ssQueue.push(() => resolve(this.takeSystemScreenshot()));
        });
    }
    this._ssBusy = true;

    // パネルを閉じる
    if (this.panelActive) this.togglePanel();

    try {
        // --- html2canvas ライブラリの読み込み ---
        if (typeof html2canvas === 'undefined') {
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // --- パネルアニメ完了を待つ ---
        await new Promise(r => setTimeout(r, 350));

        // --- 描画対象 ---
        const target = document.getElementById('device');
        if (!target) throw new Error('device element not found');

        // --- 高画質スケール ---
        // 端末の pixelRatio に応じて ×2 でレンダリング（最低2倍）
        const dpr = Math.max(window.devicePixelRatio || 1, 2);
        const renderScale = Math.min(dpr * 2, 4);   // 最大4倍まで

        // --- 同一オリジン iframe の HTML を収集 ---
        //   onclone 内で「iframe → div（内側HTMLをベタ書き）」に置換するための材料
        const iframeSnapshots = this._collectIframeSnapshots();

        // --- html2canvas 実行 ---
        const canvas = await html2canvas(target, {
            useCORS: true,
            allowTaint: true,
            backgroundColor: null,
            scale: renderScale,
            logging: false,
            removeContainer: true,
            foreignObjectRendering: false,   // 構造を保つため無効
            imageTimeout: 5000,
                        onclone: (clonedDoc) => {
                // ---- 1. スマホ枠・角丸を除去（中身の見た目は保つ）----
                const clonedDevice = clonedDoc.getElementById('device');
                if (clonedDevice) {
                    clonedDevice.style.backgroundImage = 'none';
                    clonedDevice.style.border = 'none';
                    clonedDevice.style.boxShadow = 'none';
                    clonedDevice.style.padding = '0';
                    clonedDevice.style.margin = '0';
                    clonedDevice.style.borderRadius = '0px';
                    clonedDevice.style.clipPath = 'none';
                    clonedDevice.style.overflow = 'visible';
                    clonedDevice.style.width  = target.offsetWidth  + 'px';
                    clonedDevice.style.height = target.offsetHeight + 'px';
                }

                // ---- 2. iframe を「その中身のHTML」に置換 ----
                //   ★ src をキーに照合する（並び順に依存しない）
                const iframes = clonedDoc.querySelectorAll('iframe');
                iframes.forEach((frame) => {
                    try {
                        // プレビュー内は無視
                        if (frame.closest && frame.closest('#screenshot-preview')) return;

                        const key = frame.getAttribute('src') || '';
                        const snap = iframeSnapshots.get(key);
                        if (!snap) {
                            // マッチしない iframe（cross-origin 等）→ 透明化
                            frame.style.visibility = 'hidden';
                            frame.style.opacity = '0';
                            return;
                        }

                        // iframe を包む div を作成し、中身のHTMLを流し込む
                        const wrapper = clonedDoc.createElement('div');
                        wrapper.style.cssText = `
                            position:absolute; inset:0;
                            width:100%; height:100%;
                            overflow:hidden;
                            border-radius:0;
                            background:transparent;
                            transform-origin: top left;
                        `;

                        const inner = clonedDoc.createElement('div');
                        inner.style.cssText = `
                            position:absolute; inset:0;
                            width:100%; height:100%;
                            overflow:hidden;
                            font-family: inherit;
                            color: inherit;
                        `;

                        // <style> を先に注入 → 本文を流し込む
                        const styleTag = clonedDoc.createElement('style');
                        styleTag.textContent = snap.styles || '';
                        inner.appendChild(styleTag);

                        const bodyWrap = clonedDoc.createElement('div');
                        bodyWrap.innerHTML = snap.body || '';
                        bodyWrap.style.cssText = snap.bodyStyle || '';
                        inner.appendChild(bodyWrap);

                        wrapper.appendChild(inner);
                        frame.parentNode.replaceChild(wrapper, frame);

                    } catch (e) {
                        console.warn('[Screenshot] iframe 展開失敗:', e);
                        frame.style.visibility = 'hidden';
                        frame.style.opacity = '0';
                    }
                });

                clonedDoc.body.offsetHeight;
            }
        });

        // --- PNG Blob 生成（quality を最大に）---
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        if (!blob) throw new Error('canvas.toBlob 失敗');

        // --- ファイル名生成 ---
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const fileName =
            `ss_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}` +
            `_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}` +
            `_${Math.floor(Math.random()*900+100)}.png`;   // 連写でも重複しない

        // --- 保存 ---
        const picDir = await this.root.getDirectoryHandle('pictures', { create: true });
        const ssDir  = await picDir.getDirectoryHandle('screenshots', { create: true });
        const fileHandle = await ssDir.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();

        // --- プレビュー表示 ---
        this._showScreenshotPreview(canvas, fileName);

        // --- 通知（軽め）---


        if (navigator.vibrate) navigator.vibrate([50, 10, 50]);

    } catch (e) {
        console.error('[Screenshot] 失敗:', e);
        this.showOSPopup('スクリーンショット', '保存できませんでした。');
    } finally {
        // --- フラグ解除 & キュー再開 ---
        this._ssBusy = false;
        if (this._ssQueue && this._ssQueue.length > 0) {
            const next = this._ssQueue.shift();
            setTimeout(next, 50);
        }
    }
}
/**
 * 台形変形（rotateX / rotateY）を両方リセットする
 * @param {HTMLElement} win 
 */
_resetTrapezoidTransform(win) {
    if (!win) return;
    win.style.setProperty('--win-rotate-x', '0deg');   /* ★ 追加 */
    win.style.setProperty('--win-rotate-y', '0deg');
}
/**
 * 同一オリジン iframe の HTML / CSS を src をキーにして収集する。
 * html2canvas の onclone は並び順が保証されないので、
 * インデックスではなく src 一致で照合できるようにする。
 *
 * @returns {Map<string, {styles:string, body:string, bodyStyle:string}>}
 */
_collectIframeSnapshots() {
    const map = new Map();

    document.querySelectorAll('iframe').forEach(frame => {
        // スクリーンショットプレビュー内は除外
        if (frame.closest('#screenshot-preview')) return;

        const key = frame.getAttribute('src') || '';
        if (!key) return;

        try {
            const doc = frame.contentDocument || frame.contentWindow?.document;
            if (!doc || !doc.documentElement) return;

            // <style> を回収（CSSOM も合算）
            let styles = '';
            doc.querySelectorAll('style').forEach(s => {
                styles += s.textContent + '\n';
            });
            try {
                for (const sheet of doc.styleSheets) {
                    try {
                        for (const rule of sheet.cssRules) {
                            styles += rule.cssText + '\n';
                        }
                    } catch (_) { /* cross-origin */ }
                }
            } catch (_) {}

            const bodyStyle = doc.body
                ? `margin:0;padding:0;font-family:${doc.body.style.fontFamily || 'inherit'};` +
                  `color:${doc.body.style.color || 'inherit'};` +
                  `background:${doc.body.style.background || doc.body.style.backgroundColor || 'transparent'};`
                : 'margin:0;padding:0;';

            map.set(key, {
                styles,
                body: doc.body ? doc.body.innerHTML : '',
                bodyStyle
            });
        } catch (e) {
            // cross-origin は無視
        }
    });

    return map;
}

/**
 * 保存完了プレビューを右下に表示（2枚目以降はスタック風）
 */
_showScreenshotPreview(canvas, fileName) {
    // 連写対応：既存プレビューがあれば少し消してから新しいのを出す
    const existing = document.getElementById('screenshot-preview');
    if (existing) {
        existing.classList.remove('show');
        setTimeout(() => existing.remove(), 350);
    }

    const wrap = document.createElement('div');
    wrap.id = 'screenshot-preview';

    // サムネ画像生成
    const img = document.createElement('img');
    img.src = canvas.toDataURL('image/jpeg', 0.75);   // サムネは jpeg で軽量に
    wrap.appendChild(img);

    const label = document.createElement('div');
    label.className = 'ss-label';
    label.textContent = '保存しました';
    wrap.appendChild(label);

    // 少しずらしてスタック風（連写感）
    if (this._ssLastPreviewAt && Date.now() - this._ssLastPreviewAt < 2000) {
        wrap.classList.add('stack-1');
    }
    this._ssLastPreviewAt = Date.now();

    document.getElementById('device').appendChild(wrap);

    // フェードイン
    requestAnimationFrame(() => {
        requestAnimationFrame(() => wrap.classList.add('show'));
    });

    // 3秒後にフェードアウトして削除
    setTimeout(() => {
        wrap.classList.remove('show');
        setTimeout(() => wrap.remove(), 400);
    }, 3000);
}

// バックアップ作成（キャンセル可能）
async createBackup() {
    if (this._backupCancelled) this._backupCancelled = false;
    try {
        const backupDir = await this.root.getDirectoryHandle('backup', { create: true });
        const now = new Date();
        const timestamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
        const backupName = `backup_${timestamp}.paabak`;
        
        const progress = this._showProgressOverlay("バックアップ", "ファイル一覧を取得中...", "0%", true);
        
        // ファイル一覧を取得（キャンセルチェック付き）
        let fileList = [];
        let collectCancelled = false;
        const collectFiles = async (dirHandle, currentPath = '') => {
            if (this._backupCancelled) { collectCancelled = true; return; }
            for await (const entry of dirHandle.values()) {
                if (this._backupCancelled) { collectCancelled = true; return; }
                if (entry.kind === 'file') {
                    const file = await entry.getFile();
                    fileList.push({ path: currentPath, name: entry.name, size: file.size, handle: entry });
                } else if (entry.kind === 'directory') {
                    if (entry.name === 'backup') continue;
                    await collectFiles(await dirHandle.getDirectoryHandle(entry.name), currentPath + entry.name + '/');
                }
            }
        };
        await collectFiles(this.root);
        if (collectCancelled || this._backupCancelled) {
            this._hideProgressOverlay(progress);
            this.showOSPopup("バックアップ", "ユーザーによりキャンセルされました。");
            this._backupCancelled = false;
            return false;
        }
        
        if (fileList.length === 0) {
            this._hideProgressOverlay(progress);
            this.showOSPopup("バックアップ", "バックアップするファイルがありません。");
            return false;
        }
        
        const zip = new JSZip();
        let processed = 0;
        let skipped = 0;
        const MAX_FILE_SIZE = 100 * 1024 * 1024;
        
        for (const item of fileList) {
            if (this._backupCancelled) break;
            processed++;
            const percent = Math.round((processed / fileList.length) * 100);
            this._updateProgressOverlay(progress, `バックアップ中... (${processed}/${fileList.length})`, `${percent}%`, item.path + item.name);
            
            if (item.size > MAX_FILE_SIZE) {
                skipped++;
                continue;
            }
            try {
                const file = await item.handle.getFile();
                const arrayBuffer = await file.arrayBuffer();
                zip.file(item.path + item.name, arrayBuffer);
            } catch(e) {
                skipped++;
            }
        }
        
        if (this._backupCancelled) {
            this._hideProgressOverlay(progress);
            this.showOSPopup("バックアップ", "ユーザーによりキャンセルされました。");
            this._backupCancelled = false;
            return false;
        }
        
        this._updateProgressOverlay(progress, "ZIP圧縮中...", "100%", "");
        const blob = await zip.generateAsync({ type: 'blob' });
        
        if (this._backupCancelled) {
            this._hideProgressOverlay(progress);
            this.showOSPopup("バックアップ", "キャンセルされました。");
            this._backupCancelled = false;
            return false;
        }
        
        this._updateProgressOverlay(progress, "保存中...", "100%", "");
        const fileHandle = await backupDir.getFileHandle(backupName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        
        this._hideProgressOverlay(progress);
        let msg = `バックアップ完了: ${backupName}\n保存先: root/backup/\nファイル数: ${processed - skipped}/${processed}`;
        if (skipped > 0) msg += `\n⚠️ ${skipped}個のファイルをスキップ（100MB超）`;
        this.showOSPopup("バックアップ", msg);
        this._backupCancelled = false;
        return true;
        
    } catch (err) {
        this._hideProgressOverlay(document.getElementById('backup-progress'));
        this.showOSPopup("エラー", "バックアップに失敗しました。: " + err.message);
        this._backupCancelled = false;
        return false;
    }
}

// 復元（キャンセル対応）
async restoreFromBackup() {
    try {
        const [fileHandle] = await window.showOpenFilePicker({
            types: [{ description: 'PaaOS Backup', accept: { 'application/paaos-backup': ['.paabak'] } }]
        });
        const file = await fileHandle.getFile();
        const zip = await JSZip.loadAsync(file);
        
        const method = await this.showDialog(
            "バックアップ復元",
            "復元方法を選択してください",
            [
                { label: "上書き（現在の全データを置き換え）", value: "overwrite" },
                { label: "新規フォルダに展開", value: "newfolder" },
                { label: "キャンセル", value: "cancel" }
            ]
        );
        if (method === "cancel") return;
        this._backupCancelled = false;
        if (method === "overwrite") {
            await this._restoreOverwrite(zip);
        } else {
            await this._restoreNewFolder(zip);
        }
    } catch (err) {
        if (err.name !== 'AbortError') {
            console.error("復元エラー:", err);
            this.showOSPopup("エラー", "復元に失敗しました。: " + err.message);
        }
    }
}

// 上書き復元（キャンセル可能）
async _restoreOverwrite(zip) {
    const confirm = await this.showDialog(
        "[警告]バックアップ復元",
        "上書き復元を実行すると、現在の全データがバックアップの内容に置き換えられます。続行しますか？",
        [{ label: "続行", value: "ok" }, { label: "キャンセル", value: "cancel" }]
    );
    if (confirm !== "ok") return;
    
    const progress = this._showProgressOverlay("復元（上書き）", "準備中...", "0%", true);
    
    let tempDir;
    try {
        tempDir = await this.root.getDirectoryHandle('temp_restore', { create: true });
    } catch(e) {
        await this.root.removeEntry('temp_restore', { recursive: true });
        tempDir = await this.root.getDirectoryHandle('temp_restore', { create: true });
    }
    
    const extractOk = await this._extractZipToDirWithProgress(zip, tempDir, progress);
    if (!extractOk || this._backupCancelled) {
        await this.root.removeEntry('temp_restore', { recursive: true }).catch(()=>{});
        this._hideProgressOverlay(progress);
        this.showOSPopup("復元", "キャンセルされました。");
        this._backupCancelled = false;
        return;
    }
    
    this._updateProgressOverlay(progress, "既存データを削除中...", "30%", "");
    for await (const entry of this.root.values()) {
        if (this._backupCancelled) break;
        if (entry.name === 'temp_restore' || entry.name === 'backup') continue;
        await this.root.removeEntry(entry.name, { recursive: true }).catch(e=>console.warn(e));
    }
    if (this._backupCancelled) {
        await this.root.removeEntry('temp_restore', { recursive: true }).catch(()=>{});
        this._hideProgressOverlay(progress);
        this.showOSPopup("復元", "キャンセルされました。");
        this._backupCancelled = false;
        return;
    }
    
    let total = 0, copied = 0;
    for await (const entry of tempDir.values()) total++;
    for await (const entry of tempDir.values()) {
        if (this._backupCancelled) break;
        copied++;
        const percent = 60 + Math.round((copied / total) * 40);
        this._updateProgressOverlay(progress, "データを移動中...", `${percent}%`, entry.name);
        if (entry.kind === 'file') {
            const file = await entry.getFile();
            const newHandle = await this.root.getFileHandle(entry.name, { create: true });
            const writable = await newHandle.createWritable();
            await writable.write(await file.arrayBuffer());
            await writable.close();
        } else {
            await this._copyDir(entry, await this.root.getDirectoryHandle(entry.name, { create: true }));
        }
    }
    
    await this.root.removeEntry('temp_restore', { recursive: true });
    if (this._backupCancelled) {
        this._hideProgressOverlay(progress);
        this.showOSPopup("復元", "キャンセルされました。");
        this._backupCancelled = false;
        return;
    }
    
    this._updateProgressOverlay(progress, "完了！", "100%", "");
    await new Promise(r => setTimeout(r, 500));
    this._hideProgressOverlay(progress);
    this.showOSPopup("復元", "上書き復元が完了しました。再起動をおすすめします。");
    this._backupCancelled = false;
}

// ローカルバージョンを取得
async getLocalVersion() {
    try {
        const sysDir = await this.root.getDirectoryHandle('system');
        const versionFile = await sysDir.getFileHandle('version.txt');
        const file = await versionFile.getFile();
        const text = await file.text();
        return text.trim() || '0.0.0';
    } catch(e) {
        // version.txt が存在しない場合は作成
        try {
            const sysDir = await this.root.getDirectoryHandle('system', { create: true });
            const versionHandle = await sysDir.getFileHandle('version.txt', { create: true });
            const writable = await versionHandle.createWritable();
            await writable.write('3.4');
            await writable.close();
            return '3.4';
        } catch(e2) {
            console.warn('バージョンファイルの作成に失敗:', e2);
            return '0.0.0';
        }
    }
}

// ローカルバージョンを保存
async saveLocalVersion(version) {
    try {
        const sysDir = await this.root.getDirectoryHandle('system', { create: true });
        const versionHandle = await sysDir.getFileHandle('version.txt', { create: true });
        const writable = await versionHandle.createWritable();
        await writable.write(version);
        await writable.close();
        return true;
    } catch(e) {
        console.warn('バージョン保存に失敗:', e);
        return false;
    }
}

// アップデートをチェック（キャッシュ付き）
async checkForUpdates(force = false) {
    const now = Date.now();
    // キャッシュ有効期間: 5分
    if (!force && this._updateCache.lastCheck && (now - this._updateCache.lastCheck < 300000)) {
        return this._updateCache;
    }

    if (this._updateCheckInProgress) {
        return this._updateCache;
    }
    this._updateCheckInProgress = true;

    try {
        const localVersion = await this.getLocalVersion();
        const url = `https://raw.githubusercontent.com/${this._storeRepo.owner}/${this._storeRepo.repo}/${this._storeRepo.branch}/UPINFO.json`;
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        const text = await response.text();
        const info = JSON.parse(text);

                // バージョン比較（semver風）
        // ★ 数値とドットだけを抽出する関数（例: "PF.3.4.06.R" → "3.4.06"）
        const extractNumeric = (str) => {
            const match = str.match(/\d+(\.\d+)*/);
            return match ? match[0].split('.').map(Number) : [];
        };

        const localParts = extractNumeric(localVersion);   // "3.4" → [2, 3]
        const remoteParts = extractNumeric(info.version);  // "PF.3.4.06.R" → [2, 3, 6]

        let isNewer = false;
        const maxLen = Math.max(localParts.length, remoteParts.length);
        for (let i = 0; i < maxLen; i++) {
            const lv = localParts[i] || 0;
            const rv = remoteParts[i] || 0;
            if (rv > lv) {
                isNewer = true;  // リモートが大きければ更新あり
                break;
            } else if (rv < lv) {
                break; // ローカルの方が大きければ更新なし
            }
        }

        // ファイル名を取得（UP_###.zip の ### 部分を表示名として使用）
        const filename = info.filename || '';
        const displayName = filename.replace(/^UP_/, '').replace(/\.zip$/, '');

        this._updateCache = {
            available: isNewer,
            version: info.version || '0.0.0',
            filename: filename,
            description: info.description || '',
            displayName: displayName,
            localVersion: localVersion,
            lastCheck: now,
            rawInfo: info
        };

        return this._updateCache;
    } catch(e) {
        console.warn('アップデートチェック失敗:', e);
        this._updateCache = {
            available: false,
            version: null,
            filename: null,
            description: null,
            lastCheck: now,
            error: e.message,
            localVersion: await this.getLocalVersion()
        };
        return this._updateCache;
    } finally {
        this._updateCheckInProgress = false;
    }
}

// アップデートをダウンロードしてインストール
async downloadAndInstallUpdate() {
    const updateInfo = await this.checkForUpdates(true);
    if (!updateInfo.available || !updateInfo.filename) {
        this.showOSPopup('アップデート', '利用可能なアップデートがありません。');
        return false;
    }

    // 確認ダイアログ
    const confirm = await this.showDialog(
        '[確認]アップデート',
        `バージョン ${updateInfo.version} が利用可能です。\n` +
        `${updateInfo.description ? '詳細: ' + updateInfo.description + '\n' : ''}` +
        `\nダウンロードしてインストールしますか？`,
        [
            { label: 'インストール', value: 'ok' },
            { label: 'キャンセル', value: 'cancel' }
        ]
    );
    if (confirm !== 'ok') return false;

    // 進捗オーバーレイ表示
    const progress = this._showProgressOverlay(
        'アップデート',
        'ダウンロード中...',
        '0%',
        true  // キャンセルボタン付き
    );

    try {
        // ZIPファイルをダウンロード
        const zipUrl = `https://raw.githubusercontent.com/${this._storeRepo.owner}/${this._storeRepo.repo}/${this._storeRepo.branch}/${updateInfo.filename}`;
        this._updateProgressOverlay(progress, 'ダウンロード中...', '20%', updateInfo.filename);
        
        const response = await fetch(zipUrl);
        if (!response.ok) {
            throw new Error(`ダウンロード失敗: HTTP ${response.status}`);
        }
        const arrayBuffer = await response.arrayBuffer();
        if (this._backupCancelled) {
            this._hideProgressOverlay(progress);
            this.showOSPopup('アップデート', 'キャンセルされました。');
            return false;
        }

        this._updateProgressOverlay(progress, '展開中...', '50%', '');
        
        // JSZipで読み込み
        const zip = await JSZip.loadAsync(arrayBuffer);
        if (this._backupCancelled) {
            this._hideProgressOverlay(progress);
            this.showOSPopup('アップデート', 'キャンセルされました。');
            return false;
        }

        // os.html の確認
        const osFile = zip.file('os.html');
        if (!osFile) {
            throw new Error('このファイルはアップデートファイルとして認識されませんでした。');
        }

        // info.txt の処理
        const infoFile = zip.file('info.txt');
        if (infoFile) {
            try {
                const infoContent = await infoFile.async('text');
                const sysDir = await this.root.getDirectoryHandle('system', { create: true });
                const infoHandle = await sysDir.getFileHandle('info.txt', { create: true });
                const writable = await infoHandle.createWritable();
                await writable.write(infoContent);
                await writable.close();
                this.showOSPopup('アップデート', 'システム情報 (info.txt) を更新しました。');
            } catch (infoErr) {
                console.warn('info.txtの保存に失敗:', infoErr);
            }
        }

        this._updateProgressOverlay(progress, 'インストール中...', '70%', '');

        // os.html を保存（ランダムな名前で）
        const osContent = await osFile.async('blob');
        const rand = Math.floor(Math.random() * 10000);
        const newFileName = `${rand}os.html`;
        const newFileHandle = await this.root.getFileHandle(newFileName, { create: true });
        const writable = await newFileHandle.createWritable();
        await writable.write(osContent);
        await writable.close();

        // バージョンを保存
        await this.saveLocalVersion(updateInfo.version);

        // 古い os.html を削除
        try {
            const sysDir = await this.root.getDirectoryHandle('system');
            await sysDir.removeEntry('os.html');
        } catch(e) {
            try { await this.root.removeEntry('os.html'); } catch(e2) {}
        }

        this._updateProgressOverlay(progress, '完了！', '100%', '');
        await new Promise(r => setTimeout(r, 500));
        this._hideProgressOverlay(progress);

        // 完了ダイアログ（再起動ではなく読み込みに変更）
await this.showDialog(
    'アップデート',
    `アップデートが完了しました。\n` +
    `新しいバージョン: ${updateInfo.version}\n` +
    `\n新しいOSを読み込みます。`,
    [{ label: 'OK', value: 'ok' }]
);

// ★ 再起動ではなく、新しい os.html へリダイレクト
location.href = newFileName;
return true;

    } catch(e) {
        this._hideProgressOverlay(progress);
        console.error('アップデートエラー:', e);
        this.showOSPopup('アップデート', e.message || 'アップデートに失敗しました。');
        return false;
    }
}

/* ★ 起動完了後、バックグラウンドでアセット・アップデートをチェック */
async _runStartupChecks() {
    if (this._startupChecksDone) return;
    this._startupChecksDone = true;

    try {
        // ---- 1) システムアセット（boot.* / shutdown.*）----
        const assetUpdates = await this._checkAssetUpdates();
        if (assetUpdates.length > 0) {
            const ok = await this.showDialog(
                'システムアセットの更新',
                `新しいシステムアセットが見つかりました。\n\n` +
                `対象: ${assetUpdates.map(a => a.name).join(', ')}\n\n` +
                `ダウンロードして更新しますか？`,
                [
                    { label: '更新する', value: 'ok' },
                    { label: '後で',   value: 'cancel' }
                ]
            );
            if (ok === 'ok') {
                await this._installAssetUpdates(assetUpdates);
            }
        }

        // ---- 2) OSアップデート（アセットの後）----
        const info = await this.checkForUpdates(true);
        if (info.available) {
            const ok = await this.showDialog(
                'アップデート',
                `新しいバージョン ${info.version} が利用可能です。\n` +
                `${info.description ? info.description + '\n' : ''}\n` +
                `インストールしますか？`,
                [
                    { label: 'インストール', value: 'ok' },
                    { label: '後で',       value: 'cancel' }
                ]
            );
            if (ok === 'ok') {
                await this.downloadAndInstallUpdate();
            }
        }
    } catch (e) {
        console.warn('起動時チェックエラー:', e);
    }
}

/* ★ GitHub の boot.* / shutdown.* とローカルのサイズを比較 */
async _checkAssetUpdates() {
    const url = `https://api.github.com/repos/${this._storeRepo.owner}/${this._storeRepo.repo}/contents?ref=${this._storeRepo.branch}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // ルート直下のファイルのみ対象（boot.* / shutdown.* に限定、wallpaper は除外）
    const files = data.filter(item => item.type === 'file');
    const remoteBoots     = files.filter(f => f.name.toLowerCase().startsWith('boot.'));
    const remoteShutdowns = files.filter(f => f.name.toLowerCase().startsWith('shutdown.'));

    const updates = [];

    const checkOne = async (remoteFile, subDir) => {
        try {
            const sysDir  = await this.root.getDirectoryHandle('system');
            const target  = await sysDir.getDirectoryHandle(subDir);
            let found = false;
            for await (const entry of target.values()) {
                if (entry.kind === 'file' &&
                    entry.name.toLowerCase().startsWith(subDir + '.')) {
                    const file = await entry.getFile();
                    if (file.size === remoteFile.size) found = true;
                    break;
                }
            }
            if (!found) updates.push(remoteFile);
        } catch (e) {
            // フォルダ/ファイルが無い → 新規扱い
            updates.push(remoteFile);
        }
    };

    for (const r of remoteBoots)     await checkOne(r, 'boot');
    for (const r of remoteShutdowns) await checkOne(r, 'shutdown');

    return updates;
}


/* ★ アセットをまとめてダウンロード（既存の _downloadAndSaveSystemFile を再利用） */
async _installAssetUpdates(assets) {
    const progress = this._showProgressOverlay(
        'システムアセット', 'ダウンロード中...', '0%', false
    );
    let done = 0;
    for (const asset of assets) {
        done++;
        const percent = Math.round((done / assets.length) * 100);
        this._updateProgressOverlay(
            progress,
            `ダウンロード中: ${asset.name}`,
            `${percent}%`,
            asset.name
        );
        try {
            await this._downloadAndSaveSystemFile(asset.name);
        } catch (e) {
            console.warn(`アセット ${asset.name} のダウンロードに失敗:`, e);
        }
    }
    this._hideProgressOverlay(progress);
    this.showOSPopup('システムアセット', `${done} 件のアセットを更新しました。`);
}


/* ★ 初期セットアップ時: boot.* / shutdown.* / wallpaper.* を
     バックグラウンドで自動ダウンロード（ユーザーに問わない） */
async _autoFetchSystemAssets() {
    try {
        const sysDir = await this.root.getDirectoryHandle('system');

        // --- 既に存在するかチェック（無い物だけ落とす） ---
        let hasBoot = false;
        try {
            const bootDir = await sysDir.getDirectoryHandle('boot');
            for await (const e of bootDir.values()) {
                if (e.kind === 'file' && e.name.toLowerCase().startsWith('boot.')) {
                    hasBoot = true; break;
                }
            }
        } catch (_) {}

        let hasShutdown = false;
        try {
            const sdDir = await sysDir.getDirectoryHandle('shutdown');
            for await (const e of sdDir.values()) {
                if (e.kind === 'file' && e.name.toLowerCase().startsWith('shutdown.')) {
                    hasShutdown = true; break;
                }
            }
        } catch (_) {}

        let hasWallpaper = false;
        for (const ext of ['html','png','jpg','jpeg','gif','webp']) {
            try {
                await sysDir.getFileHandle(`wallpaper.${ext}`);
                hasWallpaper = true; break;
            } catch (_) {}
        }

        if (hasBoot && hasShutdown && hasWallpaper) return;

        // --- GitHub からルート直下のファイル一覧を取得 ---
        const url = `https://api.github.com/repos/${this._storeRepo.owner}/${this._storeRepo.repo}/contents?ref=${this._storeRepo.branch}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const files = data.filter(item => item.type === 'file');

        // 不足している種類のみを対象にする
        const targets = files.filter(f => {
            const n = f.name.toLowerCase();
            if (!hasBoot     && n.startsWith('boot.'))     return true;
            if (!hasShutdown && n.startsWith('shutdown.')) return true;
            if (!hasWallpaper && n.startsWith('wallpaper.')) return true;
            return false;
        });
        if (targets.length === 0) return;

        // --- 並列ダウンロード（既存メソッドを再利用） ---
        await Promise.allSettled(
            targets.map(f => this._downloadAndSaveSystemFile(f.name))
        );

        // --- 壁紙を配置した場合は画面に反映 ---
        const wallpaperFetched = targets.some(f =>
            f.name.toLowerCase().startsWith('wallpaper.')
        );
        if (wallpaperFetched) {
            try { this.applyWP(); } catch (_) {}
        }

       
    } catch (e) {
        // 初期設定を妨げないよう、失敗は静かに記録
        console.warn('[AutoFetch] システムアセットの自動取得に失敗:', e);
    }
}

// 新規フォルダ展開（キャンセル可能）
async _restoreNewFolder(zip) {
    let targetDir;
    try {
        targetDir = await window.showDirectoryPicker({ mode: 'readwrite' });
    } catch(e) {
        if (e.name !== 'AbortError') this.showOSPopup("エラー", "ディレクトリの選択に失敗しました。");
        return;
    }
    const progress = this._showProgressOverlay("復元（新規フォルダ）", "展開中...", "0%", true);
    const ok = await this._extractZipToDirWithProgress(zip, targetDir, progress);
    this._hideProgressOverlay(progress);
    if (ok && !this._backupCancelled) {
        this.showOSPopup("復元", `バックアップを展開しました。: ${targetDir.name}`);
    } else {
        this.showOSPopup("復元", "キャンセルされました。");
    }
    this._backupCancelled = false;
}

// ZIP展開（キャンセル対応、進捗付き）
async _extractZipToDirWithProgress(zip, targetDir, progressOverlay) {
    const entries = Object.keys(zip.files);
    const total = entries.length;
    let processed = 0;
    for (const path of entries) {
        if (this._backupCancelled) return false;
        processed++;
        const percent = Math.round((processed / total) * 30);
        this._updateProgressOverlay(progressOverlay, "展開中...", `${percent}%`, path);
        
        const zipEntry = zip.files[path];
        if (zipEntry.dir) continue;
        const parts = path.split('/').filter(p => p);
        const fileName = parts.pop();
        let currentDir = targetDir;
        for (const dirName of parts) {
            if (this._backupCancelled) return false;
            currentDir = await currentDir.getDirectoryHandle(dirName, { create: true });
        }
        const fileBlob = await zipEntry.async('blob');
        const fileHandle = await currentDir.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(fileBlob);
        await writable.close();
    }
    return true;
}

async _copyDir(sourceDir, destDir) {
    for await (const entry of sourceDir.values()) {
        if (entry.kind === 'file') {
            const file = await entry.getFile();
            const newHandle = await destDir.getFileHandle(entry.name, { create: true });
            const writable = await newHandle.createWritable();
            await writable.write(await file.arrayBuffer());
            await writable.close();
        } else {
            const subDest = await destDir.getDirectoryHandle(entry.name, { create: true });
            const subSource = await sourceDir.getDirectoryHandle(entry.name);
            await this._copyDir(subSource, subDest);
        }
    }
}

/* ★ 高速操作対応：進行中のスイッチャー遷移を即座に中断・リセット */
_abortSwitcherPending() {
    // 全ての関連タイマーを停止
    this._clearTimer('switcher');
    this._clearTimer('switcher_open');
    this._clearTimer('switcher_close');
    for (let i = 0; i < 30; i++) this._clearTimer('switcher_card_' + i);

    // ★ 残留したkillAppタイマーを全てクリア（連続キル時のDOM残留防止）
    Object.keys(this._timers).forEach(k => {
        if (k.startsWith('killApp_')) this._clearTimer(k);
    });

    if (!this.isSwitcherActive) return;

    const sw = document.getElementById('switcher');
    if (!sw) {
        this.isSwitcherActive = false;
        return;
    }

    const isVisuallyOpen = sw.classList.contains('active');

    // ★ 入場アニメ中（active が付く前）で表示だけされている場合のみ強制リセット。
    //    active 付与後は、空メッセージ（カード0枚）でも「正常状態」とみなし、
    //    closeSwitcher() に任せてアニメーションを維持する。
    if (!isVisuallyOpen) {
        sw.classList.remove('active');
        sw.style.display = 'none';
        sw.style.opacity = '';
        sw.style.transition = '';
        sw.innerHTML = '';

        // 元ウィンドウの visibility 復元
        document.querySelectorAll('.window').forEach(w => {
            w.style.visibility = '';
            delete w.dataset.prevVisibility;
        });
        this.isSwitcherActive = false;
    }
    // active 付与済みの場合は何もしない → 呼び出し元の closeSwitcher() がアニメで閉じる
}

/* ★ パフォーマンス監視 → OOM直前で自動BSOD */
startPerformanceMonitor() {
    if (!performance.memory) {
        return;
    }
    if (this._perfMonitorStarted) return;
    this._perfMonitorStarted = true;

    // ========== しきい値（環境に応じて調整） ==========
    // jsHeapSizeLimit が過大報告される環境を考慮し、絶対MBで判定する
    const HEAP_HARD_MB      = 450;   // これ超えたら即BSOD（絶対量）
    const HEAP_SOFT_MB      = 350;   // これ超えたら警告
    const REMAIN_MIN_MB     = 60;    // 残りがこれ未満で即BSOD
    const GROWTH_MB_PER_SEC = 80;    // 1秒でこれ以上増えたら危険
    const GROWTH_HARD_MB    = 150;   // 1秒でこれ以上増えたら即BSOD
    const FRAME_MIN_FPS     = 10;    // これ以下のFPSが続いたら危険
    const FRAME_DROP_COUNT  = 5;     // 5フレーム連続で低FPS

    const state = {
        longTaskCount: 0,
        lastFrameTime: performance.now(),
        frameDrops: 0,
        prevUsedBytes: performance.memory.usedJSHeapSize,
        prevTime: performance.now(),
        warned: false,
    };

    // ---- Long Task 監視 ----
    try {
        new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
                state.longTaskCount++;
                if (entry.duration > 300) {

                }
            }
        }).observe({ entryTypes: ['longtask'] });
    } catch (_) {}

    // ---- フレームレート監視 ----
    const measureFrame = () => {
        const now = performance.now();
        const delta = now - state.lastFrameTime;
        state.lastFrameTime = now;
        // 100ms超え = 10fps以下
        if (delta > 100) {
            state.frameDrops++;
        } else {
            state.frameDrops = 0;
        }
        requestAnimationFrame(measureFrame);
    };
    requestAnimationFrame(measureFrame);

    // ---- メインループ（200msごと） ----
    setInterval(() => {
        if (state.warned) return;

        const mem = performance.memory;
        const usedMB   = mem.usedJSHeapSize / 1048576;
        const limitMB  = mem.jsHeapSizeLimit / 1048576;
        const remainMB = limitMB - usedMB;

        // 増加速度（MB/秒）
        const now = performance.now();
        const dtSec = (now - state.prevTime) / 1000;
        const growthMB = dtSec > 0
            ? ((mem.usedJSHeapSize - state.prevUsedBytes) / 1048576) / dtSec
            : 0;
        state.prevUsedBytes = mem.usedJSHeapSize;
        state.prevTime = now;

        const fps = state.frameDrops > 0 ? 0 : '—';

       ;

        // ========== 判定 ==========
        // レベル1: 即BSOD（待ち時間ゼロ）
        const instantBSOD =
            usedMB   >= HEAP_HARD_MB ||
            remainMB <= REMAIN_MIN_MB ||
            growthMB >= GROWTH_HARD_MB;

        if (instantBSOD) {
            state.warned = true;
          
            // ★ ここで同期的にBSODを出す
            this.triggerBSOD(
                '0x000000EF_CRITICAL_PROCESS_DIED',
                'PaaOS_Performance_Monitor'
            );
            return;
        }

        // レベル2: 警告（ユーザーに通知）
        const softDanger =
            usedMB   >= HEAP_SOFT_MB ||
            growthMB >= GROWTH_MB_PER_SEC ||
            (state.frameDrops >= FRAME_DROP_COUNT && state.longTaskCount >= 3);

        if (softDanger) {
            const reason =
                usedMB >= HEAP_SOFT_MB ? `ヒープ ${usedMB.toFixed(0)}MB（残${remainMB.toFixed(0)}MB）`
              : growthMB >= GROWTH_MB_PER_SEC ? `メモリ急増 (+${growthMB.toFixed(0)}MB/s)`
              : `フレームレート低下 (${state.frameDrops}フレーム連続)`;
            this.showOSPopup('パフォーマンス警告', reason);
        }

        state.longTaskCount = 0;
    }, 200);
}

  const onPointerUp = (e) => {
    if (!isDragging) return;
    if (activePointerId !== null && e.pointerId !== activePointerId) return;

    isDragging = false;
    try { bar.releasePointerCapture(e.pointerId); } catch (_) {}
    activePointerId = null;

    bar.style.transition = 'transform 0.35s cubic-bezier(0.16,1,0.3,1)';
    bar.style.transform  = 'translateY(0) scaleX(1)';

    const dx        = e.clientX - startX;
    const dy        = startY - e.clientY;
    const totalMove = Math.hypot(dx, dy);
    const elapsed   = Date.now() - startTime;
    const hasApp    = dragStartedWithApp && !!appWindowEl;

    // ===== 速度・ホバー判定 =====
    // ★ pointerup の位置は velocitySamples に追加しない
    //    → 最後のサンプル = 「実際に指が動いた最後の瞬間」
    const upTime = performance.now();
    const lastSample = velocitySamples[velocitySamples.length - 1];
    const stillDuration = lastSample ? (upTime - lastSample.t) : elapsed;

    // 直近 50ms のサンプルだけで「リリース速度」を計算
    //   → 一瞬速く動いた後の静止でも、リリース時に止まっていれば 0 に近くなる
    let releaseVelocity = 0;
    const recent = velocitySamples.filter(s => upTime - s.t <= 50);
    if (recent.length >= 2) {
        const first = recent[0];
        const last  = recent[recent.length - 1];
        const dt = last.t - first.t;
        if (dt > 0) releaseVelocity = (first.y - last.y) / dt;
    } else if (elapsed > 0) {
        releaseVelocity = dy / elapsed;   // サンプル不足時のフォールバック
    }

    // ★ ホバー判定：リリース前 80ms 以上、指が止まっていたか
    const isHoverRelease = stillDuration > 80;

    // ---- 1. 軽いタップ → ホーム ----
    if (totalMove < 15 && elapsed < 250) {
        this._finishHomeBarDrag(hasApp, appWindowEl, () => this.goHome());
        return;
    }

    // ---- 2. 斜めスワイプ → サイドアプリ ----
    if (dy > THRESHOLD_DIAG && Math.abs(dx) > THRESHOLD_DIAG * 0.8) {
        this._finishHomeBarDrag(hasApp, appWindowEl, () => {
            this._openSideApp(dx < 0 ? 'left' : 'right');
        });
        return;
    }

    // ---- 3. 高速フリック（ホバーせずリリース）→ ホーム ----
    //   条件：
    //   ・アプリ起動中
    //   ・上方向に十分移動（30px 以上）
    //   ・リリース直前に指が動いている（isHoverRelease = false）
if (hasApp
    && dy > 30
    && !isHoverRelease
    && (
        releaseVelocity >= FLICK_VELOCITY
        || (elapsed < 180 && dy >= 55)
    )) {
    this._finishHomeBarDrag(
        hasApp,
        appWindowEl,
        () => this.goHome()
    );
    return;
}
    // ---- 4. 持ち上げて離す（低速 or ホバー）→ スイッチャー ----
    //   高速フリックでも、ホバーして離せばここに来る
    if (hasApp && dy >= SWITCHER_MIN_DIST) {
        this._triggerSwitcherFromHomeBarDrag(appWindowEl);
        return;
    }

    // ---- 5. アプリ未起動時の小さな上スワイプ → スイッチャー ----
    if (!hasApp && dy >= SWITCHER_MIN_DIST && this.runningApps.length > 0) {
        this.showSwitcher();
        return;
    }

    // ---- 6. スナップバック ----
    if (hasApp) this._snapAppWindowBack(appWindowEl);
};

    const onPointerCancel = () => {
        if (!isDragging) return;
        isDragging = false;
        activePointerId = null;
        velocitySamples = [];
        bar.style.transition = 'transform 0.35s cubic-bezier(0.16,1,0.3,1)';
        bar.style.transform  = 'translateY(0) scaleX(1)';
        if (dragStartedWithApp) this._snapAppWindowBack(appWindowEl);
    };

    bar.removeEventListener('pointerdown',   onPointerDown);
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup',   onPointerUp);
    window.removeEventListener('pointercancel', onPointerCancel);
    bar.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove',   onPointerMove);
    window.addEventListener('pointerup',     onPointerUp);
    window.addEventListener('pointercancel', onPointerCancel);
}
/* ★ スナップバック */
_snapAppWindowBack(win) {
    if (!win) return;
    win.style.transition = 'transform 0.35s cubic-bezier(0.16,1,0.3,1), border-radius 0.35s';
    win.style.transformOrigin = '';        // 中央原点（CSSデフォルト）に戻す
    win.style.removeProperty('transform');
    win.style.borderRadius = '';
    setTimeout(() => {
        win.style.removeProperty('transition');
        win.style.removeProperty('overflow');
        win.style.removeProperty('will-change');
    }, 400);
}/**
 * ドックアイコンの「視覚中心」を window-layer 座標系で返す。
 *  - img アイコン      : img の rect 中心（object-fit: cover で .dock-item と完全一致）
 *  - 絵文字アイコン     : .dock-item 中心から -3px 上補正
 *    （flex の line-box 中心と glyph 視覚中心のズレを吸収）
 * @returns {{x:number, y:number}|null}
 */
_getDockIconCenter(id) {
    const dockItem = document.querySelector(`#dock .dock-item[data-app-id="${id}"]`);
    if (!dockItem) return null;
    const layer = document.getElementById('window-layer');
    if (!layer) return null;

    const layerRect = layer.getBoundingClientRect();
    const img = dockItem.querySelector('img');
    const r = (img || dockItem).getBoundingClientRect();

    let x = r.left - layerRect.left + r.width  / 2;
    let y = r.top  - layerRect.top  + r.height / 2;

    // ★ 絵文字は line-box 中心より glyph 中心が下寄りになる分を上補正
    if (!img) y -= 3;

    return { x, y };
}

/* ★ 現在位置から閉じる（中央原点 → アイコン原点に変換して滑らかに） */
_finishHomeBarDrag(hasApp, win, actionFn) {
    if (!hasApp || !win) { actionFn(); return; }

    const h = win.clientHeight || 812;
    const tr = win.style.transform || '';
    const sM = tr.match(/scale\(([\d.]+)\)/);
    const tM = tr.match(/translateY\((-?[\d.]+)px\)/);
    const s  = sM ? parseFloat(sM[1]) : 1;
    const ty = tM ? parseFloat(tM[1]) : 0;
    const cy = h / 2;   // 中央原点のY

    // アイコン原点を取得
    const layer = document.getElementById('window-layer');
    const layerRect = layer.getBoundingClientRect();
    const id = win.id.replace('win-', '');
    const launchFrom = this._launchOrigins?.[id] || 'desktop';

    let iconOx = layerRect.width / 2;
    let iconOy = layerRect.height / 2;
    const pick = (el) => {
        if (!el) return false;
        const r = el.getBoundingClientRect();
        iconOx = r.left - layerRect.left + r.width / 2;
        iconOy = r.top - layerRect.top + r.height / 2;
        return true;
    };

    // ★ FIX: この関数内のローカル変数は iconOx / iconOy、
    //         ローカル関数は pick が正しい（originX / pickElement ではない）
    if (launchFrom === 'dock') {
        const c = this._getDockIconCenter(id);
        if (c) {
            iconOx = c.x;
            iconOy = c.y;
        } else {
            const iconEl = document.getElementById('icon-' + id);
            pick(iconEl?.querySelector('.icon-box') || iconEl);
        }
    } else {
        const iconEl = document.getElementById('icon-' + id);
        pick(iconEl?.querySelector('.icon-box') || iconEl);
    }

    // 中央原点の visual_top を保ったままアイコン原点の translateY に変換
    // cy*(1-s) + ty = iconOy*(1-s) + newTy
    const newTy = (cy - iconOy) * (1 - s) + ty;

    // 瞬時に原点とtransformを切り替え（見た目は変わらない）
    win.style.transition = 'none';
    win.style.transformOrigin = `${iconOx}px ${iconOy}px`;
    win.style.transform = `translateY(${newTy}px) scale(${s})`;
    void win.offsetHeight;
    win.style.removeProperty('transition');

    // 次フレームで閉じる → .minimized の transition が動き出す
    requestAnimationFrame(() => {
        actionFn();
        setTimeout(() => {
            win.style.removeProperty('transform');
            win.style.removeProperty('borderRadius');
            win.style.removeProperty('overflow');
            win.style.removeProperty('will-change');
        }, 550);
    });
}

/* ★ スイッチャーへ */
_triggerSwitcherFromHomeBarDrag(win) {
    if (!win) { this.showSwitcher(); return; }
    win.style.transformOrigin = '50% 50%';
    win.style.transition = 'transform 0.25s cubic-bezier(0.16,1,0.3,1), opacity 0.25s ease-out';
    win.style.setProperty('transform', 'translateY(-80px) scale(0.75)', 'important');
    win.style.opacity = '0';
    setTimeout(() => {
        this.showSwitcher();
        setTimeout(() => {
            win.style.removeProperty('transform');
            win.style.removeProperty('borderRadius');
            win.style.removeProperty('overflow');
            win.style.removeProperty('will-change');
            win.style.removeProperty('opacity');
            win.style.removeProperty('transition');
        }, 350);
    }, 60);
}
/**
 * 斜めスワイプで左右の最小化アプリを開く
 * @param {'left'|'right'} direction
 */
_openSideApp(direction) {
    const list = this.runningApps.filter(id => id !== this.activeAppId);
    if (list.length === 0) return;
    // 直近に使ったアプリ順で選ぶ（簡易：配列順）
    const target = direction === 'left'
        ? list[list.length - 1]
        : list[0];
    if (target) {
        // ★ ジェスチャーと反対方向から開く
        //    direction='left'  → 指は左へ動いた → アプリは右端から登場
        //    direction='right' → 指は右へ動いた → アプリは左端から登場
        const layer = document.getElementById('window-layer');
        if (layer) {
            const r = layer.getBoundingClientRect();
            this._forcedLaunchOrigin = direction === 'left'
                ? { x: r.width,    y: r.height / 2 }   // 右端中央
                : { x: 0,          y: r.height / 2 };  // 左端中央
        }

        if (this.activeAppId) {
            // 現在のアプリは最小化
            this.goHome();
            setTimeout(() => this.launch(target), 120);
        } else {
            this.launch(target);
        }
    }
}

/**
 * エッジジェスチャー
 *  - 左端 20px 以内から右スワイプ → 戻る（最小化）
 */
initEdgeGestures() {
    const device = document.getElementById('device');
    const EDGE = 15;

    let startX = 0, startY = 0, tracking = false, pointerId = null;
    let isFromLeftEdge = false;

    const overlay = document.createElement('div');
    overlay.style.cssText = `
        position:absolute; inset:0; pointer-events:none; z-index: 8000;
        opacity: 0; transition: opacity 0.15s;
        background: linear-gradient(90deg, rgba(255,255,255,0.25), transparent 30%);
    `;
    device.appendChild(overlay);

    const onDown = (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        // ★ インタラクティブ要素の上で始まったら無視（誤発動防止）
        if (e.target.closest('button, input, textarea, select, a, [onclick], .app-icon, .switcher-card, .modal-dialog')) return;
        const rect = device.getBoundingClientRect();
        const localX = e.clientX - rect.left;
        // ★ 15px → 端の検出をより厳密に
        if (localX <= EDGE && this.activeAppId) {
            isFromLeftEdge = true;
            startX = e.clientX;
            startY = e.clientY;
            tracking = true;
            pointerId = e.pointerId;
            overlay.style.opacity = '1';
        } else {
            isFromLeftEdge = false;
        }
    };
    const onMove = (e) => {
        if (!tracking || !isFromLeftEdge) return;
        const dx = e.clientX - startX;
        const dy = Math.abs(e.clientY - startY);
        // ★ 縦ブレを40pxまでに制限
        if (dx < 0 || dy > 40) {
            tracking = false;
            isFromLeftEdge = false;
            overlay.style.opacity = '0';
            return;
        }
        overlay.style.opacity = String(Math.min(dx / 200, 0.6));
    };
    const onUp = (e) => {
        if (!tracking || !isFromLeftEdge) return;
        const dx = e.clientX - startX;
        tracking = false;
        isFromLeftEdge = false;
        overlay.style.opacity = '0';
        // ★ しきい値を 70 → 90 に上げて誤爆を抑制
        if (dx > 67) {
            // ★ まずアプリに「戻る」を送り、未処理ならホームへ
            this._triggerBackOrHome();
        }
    };

    // pointer イベント（touch/mouse 両対応）
    device.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', () => {
        tracking = false;
        overlay.style.opacity = '0';
    });
}
