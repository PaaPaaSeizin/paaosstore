// =====================================================
// ショート動画判定
// =====================================================

_isShortVideo(item) {
    // 方法1: contentDetails.duration が60秒以内（ISO 8601 形式）
    const duration = item.contentDetails?.duration || '';
    const seconds = this._parseDuration(duration);
    if (seconds > 0 && seconds <= 60) return true;

    // 方法2: fileDetails.videoStreams のアスペクト比が縦型 (9:16)
    const streams = item.fileDetails?.videoStreams || [];
    for (const stream of streams) {
        const w = stream.widthPixels || 0;
        const h = stream.heightPixels || 0;
        if (w > 0 && h > 0) {
            const ratio = w / h;
            // 縦型: 比率が 0.56 前後 (9/16 = 0.5625)
            if (ratio >= 0.4 && ratio <= 0.7) return true;
        }
    }

    // 方法3: タイトルや説明に #Shorts が含まれているか
    const text = (item.snippet?.title || '') + (item.snippet?.description || '');
    if (/#Shorts/i.test(text)) return true;

    return false;
}

_parseDuration(duration) {
    if (!duration) return 0;
    const match = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!match) return 0;
    const hours = parseInt(match[1] || 0);
    const minutes = parseInt(match[2] || 0);
    const seconds = parseInt(match[3] || 0);
    return hours * 3600 + minutes * 60 + seconds;
}

// =====================================================
// 検索履歴管理
// =====================================================

_getSearchHistory() {
    try {
        return JSON.parse(localStorage.getItem('yt_search_history') || '[]');
    } catch(e) { return []; }
}

_saveSearchHistory(history) {
    localStorage.setItem('yt_search_history', JSON.stringify(history));
}

_addSearchHistory(query) {
    if (!query || query.trim().length < 2) return;
    const history = this._getSearchHistory();
    // 同じクエリを削除して先頭に追加
    const filtered = history.filter(item => item.query !== query);
    filtered.unshift({ query: query, time: new Date().toLocaleString() });
    if (filtered.length > 50) filtered.length = 50;
    this._saveSearchHistory(filtered);
}

_clearSearchHistory() {
    this._saveSearchHistory([]);
    this._loadYoutubeHistory();
}

_removeSearchHistoryItem(index) {
    const history = this._getSearchHistory();
    if (index >= 0 && index < history.length) {
        history.splice(index, 1);
        this._saveSearchHistory(history);
        this._loadYoutubeHistory();
    }
}

_searchFromHistory(query) {
    const input = document.getElementById('yt-search-input');
    if (input) input.value = query;
    this._searchYoutube();
}

// =====================================================
// 共通フェッチ & 描画
// =====================================================

_fetchYoutubeData(url, container, callback) {
    fetch(url)
        .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        })
        .then(data => {
            if (data.error) throw new Error(data.error.message || 'APIエラー');
            const items = data.items || [];
            callback(items);
        })
        .catch(err => {
            console.error('YouTube API Error:', err);
            container.innerHTML = `<div style="text-align:center; padding:30px; color:#ff6b6b;">
                ❌ 読み込み失敗<br>
                <span style="font-size:12px; opacity:0.7;">${err.message}</span><br>
                <span style="font-size:11px; opacity:0.5; margin-top:8px; display:block;">APIキーが正しいか、クォータを確認してください</span>
            </div>`;
        });
}

_renderVideoCards(container, items, tab) {
    if (!container) return;
    container.innerHTML = '';
    if (!items || items.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; opacity:0.5;">動画が見つかりません</div>';
        return;
    }
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid; grid-template-columns:1fr 1fr; gap:10px;';
    items.forEach(item => {
        const vid = item.id?.videoId || item.id;
        if (!vid) return;
        const snippet = item.snippet;
        const thumb = snippet?.thumbnails?.high?.url || snippet?.thumbnails?.medium?.url || '';
        const title = snippet?.title || '無題';
        const channel = snippet?.channelTitle || '不明';
        const channelId = snippet?.channelId || '';
        const stats = item.statistics || {};
        const views = stats.viewCount || '0';

        const card = document.createElement('div');
        card.style.cssText = 'background:rgba(128,128,128,0.05); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform 0.1s;';
        card.onclick = () => {
            card.style.transform = 'scale(0.97)';
            setTimeout(() => card.style.transform = 'scale(1)', 150);
            this._playYoutubeVideo(vid, title, channel, snippet?.description || '', channelId);
        };
        card.innerHTML = `
            <div style="aspect-ratio:16/9; background:#1a1a1a; overflow:hidden;">
                <img src="${thumb}" style="width:100%; height:100%; object-fit:cover;" onerror="this.style.display='none'">
            </div>
            <div style="padding:8px;">
                <div style="font-size:12px; font-weight:bold; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${title}</div>
                <div style="font-size:10px; opacity:0.6; margin-top:4px;">${channel}</div>
                <div style="font-size:10px; opacity:0.4;">👁 ${parseInt(views).toLocaleString()}</div>
            </div>
        `;
        grid.appendChild(card);
    });
    container.appendChild(grid);
}

// =====================================================
// 検索
// =====================================================

_searchYoutube() {
    const input = document.getElementById('yt-search-input');
    if (!input) return;
    const q = input.value.trim();
    if (!q) { this._loadYoutubeHome(); return; }
    // 検索履歴に追加
    this._addSearchHistory(q);
    
    const container = document.getElementById('yt-tab-home');
    if (!container) return;
    container.innerHTML = '<div style="text-align:center; padding:40px; opacity:0.7;">検索中...</div>';
    const key = this._getYoutubeApiKey();
    if (!key) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:#ff6b6b;">⚠️ APIキーが未設定</div>`;
        return;
    }
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(q)}&key=${key}`;
    this._fetchYoutubeData(url, container, (items) => {
        const homeTab = document.getElementById('yt-tab-home');
        const allTabs = document.querySelectorAll('.yt-tab-page');
        allTabs.forEach(p => p.style.display = 'none');
        if (homeTab) homeTab.style.display = 'block';
        document.querySelectorAll('.yt-tab-btn').forEach(b => {
            b.style.color = 'var(--text-dark)';
            b.style.opacity = '0.5';
        });
        const homeBtn = document.querySelector('.yt-tab-btn[data-tab="home"]');
        if (homeBtn) { homeBtn.style.color = 'var(--accent)'; homeBtn.style.opacity = '1'; }
        // 検索結果から詳細情報を取得
        const videoIds = items.map(item => item.id.videoId).filter(id => id);
        if (videoIds.length > 0) {
            const detailUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoIds.join(',')}&key=${key}`;
            fetch(detailUrl).then(res => res.json()).then(data => {
                this._renderVideoCards(homeTab, data.items || [], 'search');
            }).catch(() => this._renderVideoCards(homeTab, items, 'search'));
        } else {
            this._renderVideoCards(homeTab, items, 'search');
        }
    });
}

// 再生（詳細画面）
// =====================================================

_playYoutubeVideo(videoId, title, channel, description, channelId) {
    const overlay = document.getElementById('yt-player-overlay');
    const iframe = document.getElementById('yt-player-iframe');
    const titleEl = document.getElementById('yt-player-title');
    const vTitle = document.getElementById('yt-player-video-title');
    const vChannel = document.getElementById('yt-player-channel');
    const vDesc = document.getElementById('yt-player-desc');
    const related = document.getElementById('yt-player-related');
    const statsEl = document.getElementById('yt-player-stats');
    const publishedEl = document.getElementById('yt-player-published');
    const commentsEl = document.getElementById('yt-player-comments');

    if (!overlay || !iframe) return;
    
    // 現在の動画情報を保存（チャンネル表示用）
    this._currentPlayerVideo = { videoId, title, channel, channelId };
    
    if (titleEl) titleEl.textContent = title || '再生中';
    if (vTitle) vTitle.textContent = title || '無題';
    if (vChannel) {
        vChannel.textContent = channel || '不明';
        vChannel.style.cursor = channelId ? 'pointer' : 'default';
        vChannel.onclick = channelId ? () => this._viewChannel(channelId) : null;
    }
    if (vDesc) vDesc.textContent = description || '説明はありません';
    if (publishedEl) publishedEl.textContent = '公開日: 取得中...';
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
    overlay.style.display = 'flex';
    void overlay.offsetHeight;

    const key = this._getYoutubeApiKey();

    // 統計情報 & 公開日
    if (statsEl && key) {
        const statUrl = `https://www.googleapis.com/youtube/v3/videos?part=statistics,snippet&id=${videoId}&key=${key}`;
        fetch(statUrl).then(res => res.json()).then(data => {
            const item = data.items?.[0];
            if (item) {
                const s = item.statistics || {};
                statsEl.textContent = `👁 ${parseInt(s.viewCount || 0).toLocaleString()} · 👍 ${parseInt(s.likeCount || 0).toLocaleString()}`;
                if (item.snippet?.publishedAt) {
                    const d = new Date(item.snippet.publishedAt);
                    publishedEl.textContent = `公開日: ${d.toLocaleDateString()}`;
                }
            }
        }).catch(() => {});
    }

    // コメント取得
    if (commentsEl && key) {
        commentsEl.innerHTML = '<div style="text-align:center; padding:8px; opacity:0.5;">コメント読み込み中...</div>';
        const commentUrl = `https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=${videoId}&maxResults=10&key=${key}`;
        fetch(commentUrl).then(res => res.json()).then(data => {
            commentsEl.innerHTML = '';
            const items = data.items || [];
            if (items.length === 0) {
                commentsEl.innerHTML = '<div style="opacity:0.4; font-size:12px; text-align:center;">コメントはありません</div>';
                return;
            }
            items.forEach(item => {
                const comment = item.snippet.topLevelComment.snippet;
                const div = document.createElement('div');
                div.style.cssText = 'display:flex; gap:8px; padding:6px 0; border-bottom:1px solid rgba(128,128,128,0.05);';
                div.innerHTML = `
                    <img src="${comment.authorProfileImageUrl || ''}" style="width:28px; height:28px; border-radius:50%; flex-shrink:0;" onerror="this.style.display='none'">
                    <div style="flex:1; min-width:0;">
                        <div style="font-size:11px; font-weight:bold;">${comment.authorDisplayName}</div>
                        <div style="font-size:11px; opacity:0.8; word-break:break-word;">${comment.textDisplay}</div>
                        <div style="font-size:9px; opacity:0.4;">👍 ${comment.likeCount || 0}</div>
                    </div>
                `;
                commentsEl.appendChild(div);
            });
        }).catch(() => {
            commentsEl.innerHTML = '<div style="opacity:0.4; font-size:12px; text-align:center;">コメントを取得できません</div>';
        });
    }

    // 関連動画
    if (related) {
        related.innerHTML = '<div style="text-align:center; padding:10px; opacity:0.6;">読み込み中...</div>';
        if (key) {
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&relatedToVideoId=${videoId}&key=${key}`;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    related.innerHTML = '';
                    const items = data.items || [];
                    items.forEach(item => {
                        const vid = item.id.videoId;
                        if (!vid) return;
                        const div = document.createElement('div');
                        div.style.cssText = 'display:flex; gap:8px; padding:6px 0; border-bottom:1px solid rgba(128,128,128,0.05); cursor:pointer; align-items:center;';
                        div.onclick = () => this._playYoutubeVideo(vid, item.snippet.title, item.snippet.channelTitle, item.snippet.description, item.snippet.channelId);
                        div.innerHTML = `
                            <img src="${item.snippet.thumbnails?.default?.url || ''}" style="width:80px; height:45px; object-fit:cover; border-radius:4px; flex-shrink:0;">
                            <div style="flex:1; font-size:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${item.snippet.title}</div>
                        `;
                        related.appendChild(div);
                    });
                })
                .catch(() => related.innerHTML = '<div style="opacity:0.5;">関連動画を取得できません</div>');
        } else {
            related.innerHTML = '<div style="opacity:0.5;">APIキー未設定のため関連動画を表示できません</div>';
        }
    }
}

_playEmbedUrl() {
    const input = document.getElementById('yt-embed-input');
    if (!input) return;
    let val = input.value.trim();
    if (!val) return;
    let videoId = val;
    if (val.includes('v=')) {
        const match = val.match(/v=([^&]+)/);
        if (match) videoId = match[1];
    } else if (val.includes('youtu.be/')) {
        const match = val.match(/youtu\.be\/([^?]+)/);
        if (match) videoId = match[1];
    }
    if (videoId) {
        this._playYoutubeVideo(videoId, '埋め込み再生', '', '', '');
    } else {
        this.showOSPopup('YouTube', '有効なURLまたはIDを入力してください');
    }
}

// ---------- ゴミ箱メタデータ管理 ----------
async _getTrashMetaPath() {
    const sysDir = await this.root.getDirectoryHandle('system', { create: true });
    return await sysDir.getFileHandle('trash_meta.json', { create: true });
}
async _loadTrashMeta() {
    try {
        const metaFile = await this._getTrashMetaPath();
        const file = await metaFile.getFile();
        const text = await file.text();
        return text ? JSON.parse(text) : {};
    } catch(e) { return {}; }
}
async _saveTrashMeta(meta) {
    const metaFile = await this._getTrashMetaPath();
    const writable = await metaFile.createWritable();
    await writable.write(JSON.stringify(meta, null, 2));
    await writable.close();
}
async _recordTrashEntry(originalPath, trashName) {
    const meta = await this._loadTrashMeta();
    meta[trashName] = originalPath;
    await this._saveTrashMeta(meta);
}
async _removeTrashEntry(trashName) {
    const meta = await this._loadTrashMeta();
    delete meta[trashName];
    await this._saveTrashMeta(meta);
}
_isUnderSystem(pathArray) {
    return pathArray[0] === 'system';
}

/* ============================================================
   アプリの alert / confirm / prompt を PaaOS ダイアログへ自動置換
   ============================================================ */
_injectAppPolyfills(html, appId) {
    const safeAppId = String(appId).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

    // ---- Step 1: <script> 内の alert/confirm/prompt を置換 ----
    let transformed = String(html).replace(
        /<script\b([^>]*)>([\s\S]*?)<\/script>/gi,
        (match, attrs, code) => {
            if (/\bsrc\s*=/.test(attrs)) return match;
            const typeMatch = attrs.match(/\btype\s*=\s*["']([^"']+)["']/);
            if (typeMatch) {
                const t = typeMatch[1].toLowerCase().trim();
                if (t && !/^(module|text\/javascript|application\/javascript|text\/ecmascript|application\/ecmascript)$/.test(t)) {
                    return match;
                }
            }
            const newCode = this._transformAppScriptBody(code);
            return `<script${attrs}>${newCode}<\/script>`;        }
    );

    // ---- Step 2: ランタイム polyfill を <head> 直後に注入 ----
    const polyfill = `<script data-paaos-polyfill="1">
(function(){
    if (window.__paaosDialogPatched) return;
    window.__paaosDialogPatched = true;
    var reqSeq = 0;
    var pending = {};
    window.addEventListener('message', function(e){
        var d = e.data;
        if (!d || d.__paaos_dialog_result !== true) return;
        var cb = pending[d.requestId];
        if (cb) { delete pending[d.requestId]; cb(d.result); }
    });
    function ask(type, message, defaultValue) {
        return new Promise(function(resolve){
            var id = 'dlg_' + (++reqSeq) + '_' + Date.now();
            pending[id] = resolve;
            try {
                window.parent.postMessage({
                    __paaos_dialog: true, type: type, appId: '${safeAppId}',
                    message: message == null ? '' : String(message),
                    defaultValue: defaultValue, requestId: id
                }, '*');
            } catch(_) {
                resolve(type === 'confirm' ? false : (type === 'prompt' ? null : undefined));
                return;
            }
            setTimeout(function(){
                if (pending[id]) {
                    delete pending[id];
                    resolve(type === 'confirm' ? false : (type === 'prompt' ? null : undefined));
                }
            }, 60000);
        });
    }
    window.__paaos_alert   = function(m)      { return ask('alert',   m); };
    window.__paaos_confirm = function(m)      { return ask('confirm', m); };
    window.__paaos_prompt  = function(m, d)   { return ask('prompt',  m, d); };
    window.alert   = function(m)      { ask('alert', m); };
    window.confirm = function(m)      { ask('confirm', m); return false; };
    window.prompt  = function(m, d)   { ask('prompt', m, d); return null; };
})();
<\/script>`;

    if (/<head[^>]*>/i.test(transformed)) {
        return transformed.replace(/<head[^>]*>/i, m => m + polyfill);
    }
    if (/<html[^>]*>/i.test(transformed)) {
        return transformed.replace(/<html[^>]*>/i, m => m + polyfill);
    }
    return polyfill + transformed;
}

_transformAppScriptBody(code) {
    const pieces = [];
    const protectRe = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/g;
    let p = code.replace(protectRe, (m) => { pieces.push(m); return '\u0001' + (pieces.length - 1) + '\u0002'; });

    const hasAlert   = /(?<![.\w$])(?:window\s*\.\s*)?alert\s*\(/.test(p);
    const hasConfirm = /(?<![.\w$])(?:window\s*\.\s*)?confirm\s*\(/.test(p);
    const hasPrompt  = /(?<![.\w$])(?:window\s*\.\s*)?prompt\s*\(/.test(p);

    if (hasAlert)   p = p.replace(/(?<![.\w$])(?:window\s*\.\s*)?alert\s*\(/g,   '__paaos_alert(');
    if (hasConfirm) p = p.replace(/(?<![.\w$])(?:window\s*\.\s*)?confirm\s*\(/g, 'await __paaos_confirm(');
    if (hasPrompt)  p = p.replace(/(?<![.\w$])(?:window\s*\.\s*)?prompt\s*\(/g,  'await __paaos_prompt(');

    if (hasConfirm || hasPrompt) p = this._makeAwaitCompatible(p);

    return p.replace(/\u0001(\d+)\u0002/g, (_, i) => pieces[+i]);
}

_makeAwaitCompatible(code) {
    if (!/await\s+__paaos_/.test(code)) return code;
    let out = code;
    out = out.replace(/(?<!\basync\s+)\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g, 'async function $1(');
    out = out.replace(/(?<!\basync\s+)\bfunction\s*\(/g, 'async function(');
    out = out.replace(/(?<!\basync\s)(\([^()]*\)\s*=>)/g, 'async $1');
    out = out.replace(/(?<!\basync\s)(\b[A-Za-z_$][\w$]*\s*=>)/g, 'async $1');
    if (this._hasTopLevelAwait(out)) {
        out = this._promoteTopLevelDeclarations(out);
        out = `(async function(){\n${out}\n})();`;
    }
    return out;
}

_hasTopLevelAwait(code) {
    let depth = 0, i = 0;
    const len = code.length;
    while (i < len) {
        const c = code[i];
        if (c === '{') depth++;
        else if (c === '}') depth--;
        else if (depth === 0 && code.startsWith('await', i)) {
            const prev = i === 0 ? '' : code[i - 1];
            const next = code[i + 5] || '';
            if (!/[\w$]/.test(prev) && !/[\w$]/.test(next)) return true;
        }
        i++;
    }
    return false;
}

_promoteTopLevelDeclarations(code) {
    let out = code;
    out = out.replace(/(^|[;\n\r])\s*async\s+function\s+([A-Za-z_$][\w$]*)\s*\(/gm, (_, pre, name) => `${pre}window.${name} = async function ${name}(`);
    out = out.replace(/(^|[;\n\r])\s*function\s+([A-Za-z_$][\w$]*)\s*\(/gm, (_, pre, name) => `${pre}window.${name} = function ${name}(`);
    out = out.replace(/(^|[;\n\r])\s*(?:var|let|const)\s+([A-Za-z_$][\w$]*)\s*=/gm, (_, pre, name) => `${pre}window.${name} =`);
    return out;
}
// ---------- 文字列エスケープ ----------
_escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
}
_escapeJsString(str) {
    if (!str) return '';
    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
}
_formatFileSize(bytes) {
    if (bytes < 1024) return `${bytes}B`;
    if (bytes < 1048576) return `${(bytes / 1024).toFixed(1)}KB`;
    return `${(bytes / 1048576).toFixed(1)}MB`;
}

// ---------- カテゴリ別表示 ----------
async switchToCategory(category) {
    this.fmCategory = category;
    this.fmViewMode = 'category';
    await this.renderCategoryView();
}
async switchToBrowser() {
    this.fmViewMode = 'browser';
    this.fmPath = [];
    this.fmSelectMode = false;
    this.fmSelected.clear();
    this._returnToCategory = false;
    await this.renderBrowser(document.getElementById('body-sys.files'));
}
async renderCategoryView() {
    const body = document.getElementById('body-sys.files');
    const extMap = {
        images: ['jpg','jpeg','png','gif','webp','bmp','svg'],
        videos: ['mp4','webm','mov','avi','mkv'],
        music: ['mp3','wav','aac','flac','ogg','m4a'],
        documents: ['txt','html','json','pdf','doc','docx','xls','xlsx','ppt','pptx']
    };
    let targetExts = extMap[this.fmCategory] || [];
    let fileList = [];
    const collect = async (dirHandle, currentPath = '') => {
        for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file') {
                const ext = entry.name.split('.').pop().toLowerCase();
                if (targetExts.includes(ext)) {
                    const file = await entry.getFile();
                    fileList.push({ fullPath: currentPath + entry.name, name: entry.name, size: file.size });
                }
            } else if (entry.kind === 'directory' && entry.name !== 'trash') {
                await collect(await dirHandle.getDirectoryHandle(entry.name), currentPath + entry.name + '/');
            }
        }
    };
    await collect(this.root);
    fileList.sort((a,b) => a.name.localeCompare(b.name));

    let html = `
        <div style="padding:15px;">
            <div style="margin-bottom:16px;"><button class="btn-mini" onclick="kernel.gofilehome()">← ホームへ戻る</button></div>
            <div style="font-size:13px; opacity:0.7; margin-bottom:12px;">
                ${this.fmCategory === 'images' ? '🖼️ 画像ファイル' : this.fmCategory === 'videos' ? '🎬 動画ファイル' : this.fmCategory === 'music' ? '🎵 音楽ファイル' : '📄 ドキュメントファイル'} (${fileList.length}件)
            </div>
    `;
    for (const item of fileList) {
        const nameEscaped = this._escapeHtml(item.name);
        const fullPathEscaped = this._escapeJsString(item.fullPath);
        html += `
            <div class="list-item" style="justify-content: space-between;">
                <div style="display:flex; align-items:center; gap:8px; flex:1;">
                    <span>📄 ${nameEscaped}</span>
                    <span style="font-size:10px; opacity:0.6;">${this._formatFileSize(item.size)}</span>
                </div>
                <div style="display:flex; gap:6px;">
                    <button class="btn-mini" onclick="kernel.openFileByPath('${fullPathEscaped}')">開く</button>
                    <button class="btn-mini" onclick="kernel.deleteFileByPath('${fullPathEscaped}')">🗑️</button>
                </div>
            </div>
        `;
    }
    if (fileList.length === 0) html += `<div style="text-align:center; padding:40px; opacity:0.5;">該当するファイルがありません</div>`;
    body.innerHTML = html + `</div>`;
}
async gofilehome() {
    this.fmViewMode = 'home';
    this._previewReturnMode = null;
    this._previewSearchKeyword = '';
    await this.renderHome(document.getElementById('body-sys.files'));
}
async openFileByPath(fullPath) {
    const parts = fullPath.split('/').filter(p => p);
    const fileName = parts.pop();
    const dirPath = parts;
    const oldPath = [...this.fmPath];
    const oldMode = this.fmViewMode;
    this.fmPath = dirPath;
    this._returnToCategory = (oldMode === 'category');
    this._previewReturnMode = (oldMode === 'category') ? 'category' : (oldMode === 'search' ? 'search' : 'browser');
    if (oldMode === 'search') this._previewSearchKeyword = this._lastSearchKeyword || '';
    await this.fmAction(fileName, 'file');
    this.fmPath = oldPath;
}
async deleteFileByPath(fullPath) {
    const parts = fullPath.split('/').filter(p => p);
    const fileName = parts.pop();
    const dirPath = parts;
    const oldPath = [...this.fmPath];
    this.fmPath = dirPath;
    await this.fmDelete(fileName, 'file');
    this.fmPath = oldPath;
    await this.renderCategoryView();
}

// ---------- 従来のブラウザ表示 ----------
async renderBrowser(body) {

    }

    if (this.fmClipboard && this.fmClipboard.items && this.fmClipboard.items.length > 0) {

    }
    let html = `
        <div style="padding:15px;">

                <button class="btn-mini" onclick="kernel.fmNewFolder()">📁 新規フォルダ</button>
                <button class="btn-mini" onclick="kernel.fmSearch()">🔍 検索</button>
                <button class="btn-mini" onclick="kernel.fmToggleSelectMode()">${this.fmSelectMode ? '✓ 選択解除' : '☐ 選択モード'}</button>
                ${this.fmSelectMode && this.fmSelected.size > 0 ? `
                    <button class="btn-mini" onclick="kernel.fmCopyToClipboard()">📋 コピー</button>
                    <button class="btn-mini" onclick="kernel.fmCutToClipboard()">✂️ 切り取り</button>
                ` : ''}
                ${this.fmClipboard && this.fmClipboard.items && this.fmClipboard.items.length > 0 ? `<button class="btn-mini" style="background:#4CAF50;" onclick="kernel.fmPasteFromClipboard()">📎 貼り付け${clipboardStatus}</button>` : ''}
                ${this.fmSelectMode && this.fmSelected.size > 0 ? `<button class="btn-mini" style="background:#ff6b6b;" onclick="kernel.fmBatchDelete()">🗑️ 選択(${this.fmSelected.size})を削除</button>` : ''}
                <button class="btn-mini" onclick="kernel.fmOpenTrash()">🗑️ ゴミ箱</button>
                <button class="btn-mini" onclick="kernel.fmRefreshBrowser()">🔄 更新</button>
                <button class="btn-mini" onclick="kernel.gofilehome()">🏠 ホーム</button>
            </div>

    `;
    if (this.fmPath.length > 0) {
        html += `<div class="list-item" onclick="kernel.fmUp()" style="cursor:pointer;"><span>⬅ .. 戻る</span></div>`;
    }
    let entries = [];
    for await (const entry of dir.values()) entries.push(entry);
    entries.sort((a,b) => {

    const isTrashView = (this.fmPath[0] === 'trash');
    for (const entry of entries) {
        const icon = entry.kind === 'directory' ? '📂' : '📄';
        const isSelected = this.fmSelected.has(entry.name);
        const nameEscaped = this._escapeHtml(entry.name);
        const nameJsEscaped = this._escapeJsString(entry.name);
        let extraButtons = '';
        if (isTrashView) {
            extraButtons = `<button class="btn-mini" style="background:#4CAF50;" onclick="kernel.fmRestoreFromTrash('${nameJsEscaped}')">復元</button>`;
        }
        html += `
            <div class="list-item" style="justify-content: space-between; flex-wrap:wrap;">
                <div style="display:flex; align-items:center; gap:8px; flex:1;">
                    ${this.fmSelectMode ? `<input type="checkbox" data-name="${nameEscaped}" ${isSelected ? 'checked' : ''} onchange="kernel.fmToggleSelect('${nameJsEscaped}')">` : ''}
                    <span>${icon} ${nameEscaped}</span>
                </div>
                <div style="display:flex; gap:6px;">

                    <button class="btn-mini" onclick="kernel.fmRename('${nameJsEscaped}', '${entry.kind}')">✏️</button>
                    ${extraButtons}

            </div>
        `;
    }
    body.innerHTML = html + `</div>`;
}
async fmRefreshBrowser() {
    await this.renderBrowser(document.getElementById('body-sys.files'));
}

// ---------- パンくずリスト ----------
_buildBreadcrumb() {
    let html = `<span style="cursor:pointer; color:var(--accent);" onclick="kernel.fmNavigateToPath([])">root</span>`;
    let cumulative = [];
    for (let i = 0; i < this.fmPath.length; i++) {
        cumulative.push(this.fmPath[i]);
        let pathJson = JSON.stringify(cumulative.slice(0, i+1)).replace(/"/g, "'");
        html += ` / <span style="cursor:pointer; color:var(--accent);" onclick="kernel.fmNavigateToPath(${pathJson})">${this._escapeHtml(this.fmPath[i])}</span>`;
    }
    return html;
}
async fmNavigateToPath(pathArray) {
    if (typeof pathArray === 'string') {
        try { pathArray = JSON.parse(pathArray.replace(/'/g, '"')); } catch(e) { pathArray = []; }
    }
    if (!Array.isArray(pathArray)) pathArray = [];
    this.fmPath = pathArray;
    this.fmSelectMode = false;
    this.fmSelected.clear();
    await this.renderBrowser(document.getElementById('body-sys.files'));
}

// ---------- クリップボード操作 ----------
async fmCopyToClipboard() {
    if (this.fmSelected.size === 0) return;
    const dir = await this.getFmDir();
    let items = [];
    for (const name of this.fmSelected) {
        let entry;
        try { entry = await dir.getDirectoryHandle(name); items.push({ name, kind: 'directory', handle: entry }); }
        catch(e) { entry = await dir.getFileHandle(name); items.push({ name, kind: 'file', handle: entry }); }
    }
    this.fmClipboard = { type: 'copy', sourcePath: [...this.fmPath], items };
    this.showOSPopup("ファイル", `${items.length}個のアイテムをコピーしました`);
}
async fmCutToClipboard() {
    if (this.fmSelected.size === 0) return;
    const dir = await this.getFmDir();
    let items = [];
    for (const name of this.fmSelected) {
        let entry;
        try { entry = await dir.getDirectoryHandle(name); items.push({ name, kind: 'directory', handle: entry }); }
        catch(e) { entry = await dir.getFileHandle(name); items.push({ name, kind: 'file', handle: entry }); }
    }
    this.fmClipboard = { type: 'cut', sourcePath: [...this.fmPath], items };
    this.showOSPopup("ファイル", `${items.length}個のアイテムを切り取りました（貼り付け後に削除されます）`);
}
async fmPasteFromClipboard() {
    if (!this.fmClipboard || !this.fmClipboard.items || this.fmClipboard.items.length === 0) {
        this.showOSPopup("ファイル", "クリップボードが空です");
        return;
    }
    const destDir = await this.getFmDir();
    let success = 0, fail = 0;
    for (const item of this.fmClipboard.items) {
        let exists = false;
        try { await destDir.getFileHandle(item.name); exists = true; } catch(e) { try { await destDir.getDirectoryHandle(item.name); exists = true; } catch(e2) {} }
        if (exists) {
            const choice = await this.showDialog("ファイル競合", `${item.name} は既に存在します。どうしますか？`, [
                { label: "上書き", value: "overwrite" }, { label: "スキップ", value: "skip" }, { label: "キャンセル", value: "cancel" }
            ]);
            if (choice === "cancel") break;
            if (choice === "skip") { fail++; continue; }
            try { await destDir.removeEntry(item.name, { recursive: true }); } catch(e) { console.warn(e); }
        }
        try {
            if (item.kind === 'file') {
                const file = await item.handle.getFile();
                const newFile = await destDir.getFileHandle(item.name, { create: true });
                const writable = await newFile.createWritable();
                await writable.write(await file.arrayBuffer());
                await writable.close();
            } else {
                const sourceDir = item.handle;
                const targetDir = await destDir.getDirectoryHandle(item.name, { create: true });
                await this._copyDir(sourceDir, targetDir);
            }
            success++;
        } catch(e) { fail++; console.warn(`貼り付け失敗: ${item.name}`, e); }
    }
    if (this.fmClipboard.type === 'cut' && success > 0) {
        const sourceDir = await this._getDirByPath(this.fmClipboard.sourcePath);
        for (const item of this.fmClipboard.items) {
            try { await sourceDir.removeEntry(item.name, { recursive: true }); } catch(e) { console.warn(`削除失敗: ${item.name}`, e); }
        }
        if (JSON.stringify(this.fmPath) === JSON.stringify(this.fmClipboard.sourcePath))
            await this.renderBrowser(document.getElementById('body-sys.files'));
    }
    this.fmClipboard = null;
    this.fmSelectMode = false;
    this.fmSelected.clear();
    await this.renderBrowser(document.getElementById('body-sys.files'));
    this.showOSPopup("ファイル", `${success}個成功、${fail}個失敗`);
}
async _getDirByPath(pathArray) {
    let dir = this.root;
    for (const p of pathArray) dir = await dir.getDirectoryHandle(p);
    return dir;
}

// ---------- 検索機能 ----------
async fmSearch() {
    const result = await this.showDialog("ファイル検索", "検索ワードを入力", [
        { label: "検索", value: "search" }, { label: "キャンセル", value: "cancel" }
    ], { input: { type: "text", placeholder: "ファイル名の一部" } });
    if (result.value !== "search") return;
    const keyword = result.inputValue.trim().toLowerCase();
    if (!keyword) return;
    await this._executeSearch(keyword);
}
async _executeSearch(keyword) {
    this._lastSearchKeyword = keyword;
    this.fmViewMode = 'search';
    const results = [];
    const searchDir = async (dirHandle, currentPath = '') => {
        for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file' && entry.name.toLowerCase().includes(keyword))
                results.push({ path: currentPath, name: entry.name });
            else if (entry.kind === 'directory' && entry.name !== 'trash')
                await searchDir(await dirHandle.getDirectoryHandle(entry.name), currentPath + entry.name + '/');
        }
    };
    await searchDir(this.root);
    const body = document.getElementById('body-sys.files');
    if (results.length === 0) {
        body.innerHTML = `<div style="padding:15px;"><p>見つかりませんでした: "${keyword}"</p><button class="btn-mini" onclick="kernel.gofilehome()">ホームへ戻る</button></div>`;
    } else {
        let html = `<div style="padding:15px;"><h4>検索結果: "${keyword}" (${results.length})</h4><button class="btn-mini" onclick="kernel.gofilehome()">🏠 ホームへ戻る</button><hr>`;
        for (const item of results) {
            const fullPath = (item.path ? item.path + item.name : item.name);
            html += `<div class="list-item" style="justify-content:space-between;"><span>📄 ${item.path}${item.name}</span><button class="btn-mini" onclick="kernel.fmNavigateToFile('${this._escapeJsString(fullPath)}')">開く</button></div>`;
        }
        body.innerHTML = html + `</div>`;
    }
}
async fmNavigateToFile(fullPath) {
    const parts = fullPath.split('/').filter(p => p);
    const fileName = parts.pop();
    const dirPath = parts;
    const oldPath = [...this.fmPath];
    this.fmPath = dirPath;
    this._previewReturnMode = 'search';
    this._previewSearchKeyword = this._lastSearchKeyword || '';
    await this.fmAction(fileName, 'file');
    this.fmPath = oldPath;
}

// ---------- 選択モード ----------
fmToggleSelectMode() {
    this.fmSelectMode = !this.fmSelectMode;
    if (!this.fmSelectMode) this.fmSelected.clear();
    this.renderBrowser(document.getElementById('body-sys.files'));
}
fmToggleSelect(name) {

    else this.fmSelected.add(name);

// ---------- 削除（ゴミ箱へ） ----------
async fmDelete(name, kind) {
    if (this.fmPath[0] === 'trash') {
        const confirm = await this.showDialog("完全削除", `${name} を完全に削除しますか？`, [
            { label: "削除", value: "ok" }, { label: "キャンセル", value: "cancel" }
        ]);
        if (confirm !== "ok") return;
        const dir = await this.getFmDir();
        try {
            await dir.removeEntry(name, { recursive: true });
            await this._removeTrashEntry(name);
            await this.renderBrowser(document.getElementById('body-sys.files'));
            this.showOSPopup("ファイル", `${name} を完全に削除しました`);
        } catch(e) { this.showOSPopup("エラー", "削除に失敗: " + e.message); }
        return;
    }
    if (this.fmPath.length === 0 && name === 'trash') {
        await this.showDialog("エラー", "ゴミ箱フォルダは削除できません", [{ label: "OK", value: "ok" }]);
        return;
    }
    if (kind === 'directory' && (name === 'apps' || name === 'system')) {
        const confirm = await this.showDialog("警告", `「${name}」フォルダを削除するとシステムに重大な影響を与えます。本当に削除しますか？`, [
            { label: "削除する", value: "ok" }, { label: "キャンセル", value: "cancel" }
        ]);
        if (confirm !== "ok") return;
    }
    if (this._isUnderSystem(this.fmPath)) {
        const confirm = await this.showDialog("警告", `「${name}」はシステム領域内にあります。削除すると動作が不安定になる可能性があります。続行しますか？`, [
            { label: "削除する", value: "ok" }, { label: "キャンセル", value: "cancel" }
        ]);
        if (confirm !== "ok") return;
    }
    const confirm = await this.showDialog("削除確認", `${name} をゴミ箱に移動しますか？`, [
        { label: "移動", value: "ok" }, { label: "キャンセル", value: "cancel" }
    ]);
    if (confirm !== "ok") return;
    const dir = await this.getFmDir();
    try {
        const originalPath = [...this.fmPath, name].join('/');
        let trashName;
        if (kind === 'file') {
            const file = await dir.getFileHandle(name);
            const fileData = await file.getFile();
            trashName = `${Date.now()}_${name}`;
            const trashFile = await this.fmTrashDir.getFileHandle(trashName, { create: true });
            const writable = await trashFile.createWritable();
            await writable.write(await fileData.arrayBuffer());
            await writable.close();
            await dir.removeEntry(name);
        } else {
            trashName = `${Date.now()}_${name}`;
            const sourceDir = await dir.getDirectoryHandle(name);
            const targetDir = await this.fmTrashDir.getDirectoryHandle(trashName, { create: true });
            await this._copyDir(sourceDir, targetDir);
            await dir.removeEntry(name, { recursive: true });
        }
        await this._recordTrashEntry(originalPath, trashName);
        await this.renderBrowser(document.getElementById('body-sys.files'));
        this.showOSPopup("ファイル", `${name} をゴミ箱に移動しました`);
    } catch(e) { this.showOSPopup("エラー", "削除に失敗: " + e.message); }
}
async fmBatchDelete() {
    if (this.fmSelected.size === 0) return;
    if (this.fmPath.length === 0 && this.fmSelected.has('trash')) {
        await this.showDialog("エラー", "ゴミ箱フォルダは削除できません", [{ label: "OK", value: "ok" }]);
        return;
    }
    const hasApps = this.fmSelected.has('apps');
    const hasSystem = this.fmSelected.has('system');
    if (hasApps || hasSystem) {
        const confirm = await this.showDialog("警告", `選択項目にシステム重要なフォルダが含まれています。削除するとシステムが破損する可能性があります。続行しますか？`, [
            { label: "キャンセル", value: "cancel" }, { label: "それでも削除", value: "ok" }
        ]);
        if (confirm !== "ok") return;
    }
    if (this._isUnderSystem(this.fmPath)) {
        const confirm = await this.showDialog("警告", "システム領域内のアイテムを削除しようとしています。続行しますか？", [
            { label: "キャンセル", value: "cancel" }, { label: "削除する", value: "ok" }
        ]);
        if (confirm !== "ok") return;
    }
    const confirm = await this.showDialog("確認", `${this.fmSelected.size}個のアイテムをゴミ箱に移動しますか？`, [
        { label: "移動", value: "ok" }, { label: "キャンセル", value: "cancel" }
    ]);
    if (confirm !== "ok") return;
    const dir = await this.getFmDir();
    for (const name of this.fmSelected) {
        try {
            let kind, entry;
            try { entry = await dir.getDirectoryHandle(name); kind = 'directory'; } catch(e) { entry = await dir.getFileHandle(name); kind = 'file'; }
            const originalPath = [...this.fmPath, name].join('/');
            const trashName = `${Date.now()}_${name}`;
            if (kind === 'file') {
                const file = await entry.getFile();
                const trashFile = await this.fmTrashDir.getFileHandle(trashName, { create: true });
                const writable = await trashFile.createWritable();
                await writable.write(await file.arrayBuffer());
                await writable.close();
            } else {
                const sourceDir = entry;
                const targetDir = await this.fmTrashDir.getDirectoryHandle(trashName, { create: true });
                await this._copyDir(sourceDir, targetDir);
            }
            await this._recordTrashEntry(originalPath, trashName);
            await dir.removeEntry(name, { recursive: true });
        } catch(e) { console.warn(`削除失敗: ${name}`, e); }
    }
    this.fmSelected.clear();
    this.fmSelectMode = false;
    await this.renderBrowser(document.getElementById('body-sys.files'));
    this.showOSPopup("ファイル", "選択したアイテムをゴミ箱に移動しました");
}

async fmOpenTrash() {
    this.fmPath = ['trash'];
    this.fmSelectMode = false;
    this.fmSelected.clear();

async fmRestoreFromTrash(trashName) {
    const meta = await this._loadTrashMeta();
    const originalPath = meta[trashName];
    if (!originalPath) { this.showOSPopup("エラー", "元のパス情報が見つかりません"); return; }
    const pathParts = originalPath.split('/');
    const fileName = pathParts.pop();
    let targetDir = this.root;
    for (const p of pathParts) {
        try { targetDir = await targetDir.getDirectoryHandle(p); }
        catch(e) { targetDir = await targetDir.getDirectoryHandle(p, { create: true }); }
    }
    try {
        try {
            await targetDir.getFileHandle(fileName);
            const choice = await this.showDialog("ファイル競合", `${fileName} は既に存在します。上書きしますか？`, [
                { label: "上書き", value: "overwrite" }, { label: "キャンセル", value: "cancel" }
            ]);
            if (choice !== "overwrite") return;
            await targetDir.removeEntry(fileName, { recursive: true });
        } catch(e) {}
        const sourceEntry = await this.fmTrashDir.getDirectoryHandle(trashName).catch(() => this.fmTrashDir.getFileHandle(trashName));
        if (sourceEntry.kind === 'file') {
            const file = await sourceEntry.getFile();
            const newFile = await targetDir.getFileHandle(fileName, { create: true });
            const writable = await newFile.createWritable();
            await writable.write(await file.arrayBuffer());
            await writable.close();
        } else {
            const sourceDir = sourceEntry;
            const targetFolder = await targetDir.getDirectoryHandle(fileName, { create: true });
            await this._copyDir(sourceDir, targetFolder);
        }
        await this.fmTrashDir.removeEntry(trashName, { recursive: true });
        await this._removeTrashEntry(trashName);
        await this.renderBrowser(document.getElementById('body-sys.files'));
        this.showOSPopup("ファイル", `${fileName} を復元しました`);
    } catch(e) { this.showOSPopup("エラー", e.message); }
}

// ---------- 名前変更 ----------
async fmRename(oldName, kind) {
    const result = await this.showDialog("名前変更", "新しい名前を入力", [
        { label: "変更", value: "ok" }, { label: "キャンセル", value: "cancel" }
    ], { input: { type: "text", default: oldName } });
    if (result.value !== "ok") return;
    const newName = result.inputValue.trim();
    if (!newName || newName === oldName) return;
    const dir = await this.getFmDir();
    try {
        if (kind === 'directory') {
            const source = await dir.getDirectoryHandle(oldName);
            const target = await dir.getDirectoryHandle(newName, { create: true });
            await this._copyDir(source, target);
            await dir.removeEntry(oldName, { recursive: true });
        } else {
            const file = await dir.getFileHandle(oldName);
            const content = await (await file.getFile()).arrayBuffer();
            const newFile = await dir.getFileHandle(newName, { create: true });
            const writable = await newFile.createWritable();
            await writable.write(content);
            await writable.close();
            await dir.removeEntry(oldName);
        }
        await this.renderBrowser(document.getElementById('body-sys.files'));
        this.showOSPopup("ファイル", `名前変更: ${oldName} → ${newName}`);
    } catch(e) { this.showOSPopup("エラー", "名前変更に失敗: " + e.message); }
}

// ---------- ZIP圧縮 ----------
async fmCompressToZip() {
    if (this.fmSelected.size === 0) { this.showOSPopup("ファイル", "ZIP圧縮するアイテムを選択してください"); return; }
    const zip = new JSZip();
    const dir = await this.getFmDir();
    for (const name of this.fmSelected) {
        try {
            const entry = await dir.getDirectoryHandle(name).catch(() => dir.getFileHandle(name));
            if (entry.kind === 'file') {
                const file = await entry.getFile();
                const arrayBuffer = await file.arrayBuffer();
                zip.file(name, arrayBuffer);
            } else {
                this.showOSPopup("ファイル", `ディレクトリ "${name}" のZIP圧縮はスキップされました（簡易版ではファイルのみ圧縮）`);
            }
        } catch(e) { console.warn(`エラー: ${name}`, e); }
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    const zipName = `archive_${Date.now()}.zip`;
    const zipFile = await dir.getFileHandle(zipName, { create: true });
    const writable = await zipFile.createWritable();
    await writable.write(blob);
    await writable.close();
    this.fmSelected.clear();
    await this.renderBrowser(document.getElementById('body-sys.files'));
    this.showOSPopup("ファイル", `ZIP圧縮したファイル ${zipName} を作成しました`);
}

// ---------- アーカイブビューア ----------
async fmViewArchive(fileHandle, fileName) {
    try {
        const file = await fileHandle.getFile();
        const arrayBuffer = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(arrayBuffer);
        const entries = Object.keys(zip.files).filter(path => !zip.files[path].dir);
        if (entries.length === 0) { this.showOSPopup("ファイル", "このアーカイブは空です"); return; }
        let listHtml = '<div style="max-height:300px; overflow-y:auto;"><ul style="list-style:none; padding:0;">';
        for (const entry of entries) {
            const entryEscaped = this._escapeJsString(entry);
            listHtml += `<li style="padding:4px; border-bottom:1px solid rgba(128,128,128,0.1); display:flex; justify-content:space-between; align-items:center;">
                <span>📄 ${this._escapeHtml(entry)}</span>
                <button class="btn-mini" onclick="kernel._extractArchiveFile('${fileName}', '${entryEscaped}')">抽出</button>
            </li>`;
        }
        listHtml += '</ul></div>';
        await this.showDialog(`アーカイブ: ${fileName}`, listHtml, [{ label: "閉じる", value: "close" }], { html: listHtml, style: { width: '90%', maxWidth: '400px' } });
        // 閉じた後は元の画面に戻る
        await this.closePreview();
    } catch(e) { this.showOSPopup("ファイル", "このファイルはアーカイブ形式ではないか、破損しています"); }
}
async _extractArchiveFile(zipFileName, internalPath) {
    try {
        const targetDir = await window.showDirectoryPicker({ mode: 'readwrite' });
        const zipHandle = await (await this.getFmDir()).getFileHandle(zipFileName);
        const zipFile = await zipHandle.getFile();
        const zip = await JSZip.loadAsync(await zipFile.arrayBuffer());
        const fileEntry = zip.file(internalPath);
        if (!fileEntry) throw new Error("ファイルが見つかりません");
        const blob = await fileEntry.async('blob');
        const parts = internalPath.split('/');
        const outName = parts.pop();
        const outFile = await targetDir.getFileHandle(outName, { create: true });
        const writable = await outFile.createWritable();
        await writable.write(blob);
        await writable.close();
        this.showOSPopup("ファイル",抽出完了したファイル `${outName} を保存しました`);
    } catch(e) { this.showOSPopup("エラー", e.message); }
}

// ---------- ファイルを開く ----------
async fmAction(name, kind) {
    this.fmSelectMode = false;
    this.fmSelected.clear();
    if (kind === 'directory') {
        this.fmPath.push(name);
        await this.renderBrowser(document.getElementById('body-sys.files'));
    } else {
        const dir = await this.getFmDir();
        const fileHandle = await dir.getFileHandle(name);
        const file = await fileHandle.getFile();
        const body = document.getElementById('body-sys.files');
        const ext = name.split('.').pop().toLowerCase();
        
        if (ext === 'zip' || name.endsWith('.appaa') || name.endsWith('.modpaa')) {
            await this.fmViewArchive(fileHandle, name);
            return;
        }
        
        // プレビュー表示（閉じるボタンは closePreview を呼ぶ）
        if (name.endsWith('.txt') || name.endsWith('.html') || name.endsWith('.json')) {
            body.innerHTML = `<div style="padding:15px;"><h4>編集: ${this._escapeHtml(name)}</h4><textarea id="ed-area" class="editor-area">${await file.text()}</textarea><button class="btn-red" style="margin-top:10px" onclick="kernel.fmSave('${this._escapeJsString(name)}')">保存</button><button class="btn-mini" style="margin-top:10px; width:100%; padding:10px;" onclick="kernel.closePreview()">キャンセル</button></div>`;
        } else if (['jpg','jpeg','png','gif','webp'].includes(ext)) {
            body.innerHTML = `<div style="padding:15px; text-align:center;"><h4>${this._escapeHtml(name)}</h4><img src="${URL.createObjectURL(file)}" style="max-width:100%; max-height:50vh; border-radius:8px; margin-bottom:15px; object-fit:contain;"><button class="btn-red" onclick="kernel.closePreview()">閉じる</button></div>`;
        } else if (['mp4','mov','webm'].includes(ext)) {
            body.innerHTML = `<div style="padding:15px; text-align:center;"><h4>${this._escapeHtml(name)}</h4><video src="${URL.createObjectURL(file)}" controls autoplay style="max-width:100%; max-height:50vh; background:#000; border-radius:8px; margin-bottom:15px;"></video><button class="btn-red" onclick="kernel.closePreview()">閉じる</button></div>`;
        } else if (['mp3','wav','aac','flac','ogg','m4a'].includes(ext)) {
            body.innerHTML = `<div style="padding:15px; text-align:center;"><h4>${this._escapeHtml(name)}</h4><div style="font-size:60px; margin:20px 0;">🎵</div><audio src="${URL.createObjectURL(file)}" controls autoplay style="width:100%; margin-bottom:15px;"></audio><button class="btn-red" onclick="kernel.closePreview()">閉じる</button></div>`;
        } else {
            body.innerHTML = `<div style="padding:15px; text-align:center;"><h4>${this._escapeHtml(name)}</h4><p style="font-size:12px; opacity:0.7;">Preview not supported.</p><button class="btn-red" onclick="kernel.closePreview()">閉じる</button></div>`;
        }
    }
}

// ---------- 閉じるボタンの処理（元の画面に戻る） ----------
async closePreview() {
    const mode = this._previewReturnMode;
    this._previewReturnMode = null;
    if (mode === 'category') {
        await this.renderCategoryView();
    } else if (mode === 'search') {
        if (this._previewSearchKeyword) {
            await this._executeSearch(this._previewSearchKeyword);
        } else {
            await this.renderBrowser(document.getElementById('body-sys.files'));
        }
        this._previewSearchKeyword = '';
    } else {
        await this.renderBrowser(document.getElementById('body-sys.files'));
    }
}

    if (this.fmViewMode === 'browser') await this.renderBrowser(document.getElementById('body-sys.files'));
    else if (this.fmViewMode === 'category') await this.renderCategoryView();
    else if (this.fmViewMode === 'search' && this._lastSearchKeyword) await this._executeSearch(this._lastSearchKeyword);
    else await this.renderHome(document.getElementById('body-sys.files'));
}
async getFmDir() {
    let dir = this.root;
    for (const p of this.fmPath) dir = await dir.getDirectoryHandle(p);
    return dir;

async fmUp() {
    this.fmPath.pop();

async fmSave(name) {
    const dir = await this.getFmDir();
    const text = document.getElementById('ed-area').value;
    const writable = await (await dir.getFileHandle(name)).createWritable();
    await writable.write(text);
    await writable.close();
    await this.closePreview();
}
async _copyDir(sourceDir, destDir) {
    for await (const entry of sourceDir.values()) {
        if (entry.kind === 'file') {
            const file = await entry.getFile();
            const newFile = await destDir.getFileHandle(entry.name, { create: true });
            const writable = await newFile.createWritable();
            await writable.write(await file.arrayBuffer());
            await writable.close();
        } else {
            const subDest = await destDir.getDirectoryHandle(entry.name, { create: true });
            const subSource = await sourceDir.getDirectoryHandle(entry.name);
            await this._copyDir(subSource, subDest);
        }
    }
}

async askPasscode() {
    if (!this.config.passcode) return true;

    const pad = document.createElement('div');
    pad.id = 'passcode-pad';
    pad.style = "position:absolute; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(20px); z-index:15000; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:1; transition: opacity 0.2s ease;";

    pad.innerHTML = `
        <div style="margin-bottom:12px; font-weight:bold; font-size:18px;">ようこそ、${this.config.userName}さん。</div>
        <div id="pass-error" style="font-size:14px; height:24px; margin-bottom:4px; text-align:center;"></div>
        <div id="pass-dots" style="display:flex; gap:10px; margin-bottom:30px; font-size:28px; letter-spacing:4px;">${'○'.repeat(4)}</div>
        <div style="display:grid; grid-template-columns:repeat(3, 72px); gap:14px;">
            ${[1,2,3,4,5,6,7,8,9].map(n => `
                <button class="btn-mini" style="height:72px; border-radius:50%; font-size:22px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); color:#fff;" onclick="window._pk('${n}')">${n}</button>
            `).join('')}
            <button class="btn-mini" style="height:72px; border-radius:50%; font-size:20px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#fff;" onclick="window._backspace()">⌫</button>
            <button class="btn-mini" style="height:72px; border-radius:50%; font-size:22px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); color:#fff;" onclick="window._pk('0')">0</button>
            <button class="btn-mini" style="height:72px; border-radius:50%; font-size:16px; background:rgba(255,60,60,0.25); border:1px solid rgba(255,60,60,0.4); color:#fff;" onclick="window._pc()">✕</button>
        </div>
        <div style="margin-top:24px; font-size:12px; opacity:0.4;">パスコードを入力してください</div>
    `;
    document.getElementById('device').appendChild(pad);

    const loadingOverlay = document.getElementById('boot-loading');
    if (loadingOverlay) loadingOverlay.style.display = 'none';

    return new Promise(r => {
        let input = "";

        window._pk = async (n) => {
            if (input.length >= 4) return;
            input += n;
            updateDots();
            if (input.length === 4) {
                if (input === this.config.passcode) {
                    const errEl = document.getElementById('pass-error');
                    if (errEl) errEl.innerHTML = '<span style="color:#4CAF50; font-weight:bold; font-size:16px;">ロック解除</span>';
                    pad.style.opacity = '0';
                    setTimeout(() => {
                        pad.remove();
                        if (loadingOverlay) loadingOverlay.style.display = 'flex';
                        r(true);
                    }, 200);
                } else {
                    showError('パスコードが間違っています');
                    input = "";
                    updateDots();
                    setTimeout(() => {
                        const errEl = document.getElementById('pass-error');
                        if (errEl) errEl.textContent = '';
                    }, 2000);
                }
            }
        };

        window._backspace = () => {
            if (input.length > 0) {
                input = input.slice(0, -1);
                updateDots();
                const errEl = document.getElementById('pass-error');
                if (errEl) errEl.textContent = '';
            }
        };

        window._pc = () => {
            pad.remove();
            if (loadingOverlay) loadingOverlay.style.display = 'flex';
            r(false);
        };

        const updateDots = () => {
            const dots = document.getElementById('pass-dots');
            if (dots) dots.innerText = '●'.repeat(input.length) + '○'.repeat(4 - input.length);
        };

        const showError = (msg) => {
            const errEl = document.getElementById('pass-error');
            if (errEl) {
                errEl.style.color = '#ff6b6b';
                errEl.textContent = msg;
            }
        };

        // ★★★ キーボードイベント（追加） ★★★
        const onKeyDown = (e) => {
            const key = e.key;
            if (key >= '0' && key <= '9') {
                e.preventDefault();
                window._pk(key);
            } else if (key === 'Backspace') {
                e.preventDefault();
                window._backspace();
            } else if (key === 'Enter' && input.length === 4) {
                e.preventDefault();
                // 自動で判定は _pk で行われるので、ここでは何もしない
            } else if (key === 'Escape') {
                e.preventDefault();
                window._pc();
            }
        };

        window.addEventListener('keydown', onKeyDown);

        // パッド削除時にリスナーも削除
        const originalRemove = pad.remove.bind(pad);
        pad.remove = function() {
            window.removeEventListener('keydown', onKeyDown);
            originalRemove();
        };
    });
}

// ========== GitHubからシステムファイルをダウンロード ==========

/**
 * GitHubリポジトリのルートにあるシステムファイル一覧を取得し、UIに表示する
 */
async fetchAndShowSystemFiles() {
    const listContainer = document.getElementById('system-file-list');
    if (!listContainer) return;

    listContainer.innerHTML = '<div style="text-align:center; padding:12px; opacity:0.7;">🔄 読み込み中...</div>';

    try {
        const url = `https://api.github.com/repos/${this._storeRepo.owner}/${this._storeRepo.repo}/contents?ref=${this._storeRepo.branch}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        // ファイルのみをフィルタリング（ディレクトリを除外）
        const files = data.filter(item => item.type === 'file');

        // 対象ファイル名パターン（boot, shutdown, wallpaper で始まるもの）
        const targetPatterns = ['boot.', 'shutdown.', 'wallpaper.'];
        const targetFiles = files.filter(file =>
            targetPatterns.some(pattern => file.name.toLowerCase().startsWith(pattern))
        );

        if (targetFiles.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; padding:12px; opacity:0.5;">該当するファイルが見つかりませんでした。</div>';
            return;
        }

        // チェックボックス付きリストを生成
        let html = '<div style="max-height:200px; overflow-y:auto; border:1px solid rgba(128,128,128,0.2); border-radius:12px; padding:8px;">';
        targetFiles.forEach(file => {
            const fileName = file.name;
            const fileSize = (file.size / 1024).toFixed(1) + ' KB';
            const checked = this._selectedSystemFiles && this._selectedSystemFiles.includes(fileName) ? 'checked' : '';
            html += `
                <div style="display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px solid rgba(128,128,128,0.05);">
                    <input type="checkbox" id="sysfile-${this._escapeHtml(fileName)}" value="${this._escapeHtml(fileName)}" ${checked} onchange="kernel._toggleSystemFileSelection('${this._escapeJsString(fileName)}')">
                    <label for="sysfile-${this._escapeHtml(fileName)}" style="flex:1; font-size:13px; cursor:pointer;">${this._escapeHtml(fileName)}</label>
                    <span style="font-size:11px; opacity:0.5;">${fileSize}</span>
                </div>
            `;
        });
        html += '</div>';
        listContainer.innerHTML = html;

        // 選択リストを初期化（既に選択されていなければ空配列）
        if (!this._selectedSystemFiles) this._selectedSystemFiles = [];

        // チェックボックスの状態を同期（onchangeで既に更新されるが、初期化時も反映）
        document.querySelectorAll('#system-file-list input[type="checkbox"]').forEach(cb => {
            const val = cb.value;
            if (cb.checked) {
                if (!this._selectedSystemFiles.includes(val)) this._selectedSystemFiles.push(val);
            } else {
                this._selectedSystemFiles = this._selectedSystemFiles.filter(f => f !== val);
            }
        });

    } catch (e) {
        console.error('ファイル一覧取得エラー:', e);
        listContainer.innerHTML = `<div style="text-align:center; padding:12px; color:#ff6b6b;">⚠️ 一覧の取得に失敗しました: ${e.message}</div>`;
    }
}

/**
 * チェックボックスが変更されたときに選択状態を更新
 */
_toggleSystemFileSelection(fileName) {
    if (!this._selectedSystemFiles) this._selectedSystemFiles = [];
    const idx = this._selectedSystemFiles.indexOf(fileName);
    if (idx > -1) {
        this._selectedSystemFiles.splice(idx, 1);
    } else {
        this._selectedSystemFiles.push(fileName);
    }
}

/**
 * 選択されたシステムファイルをダウンロードして保存
 */
async downloadSelectedSystemFiles() {
    if (!this._selectedSystemFiles || this._selectedSystemFiles.length === 0) {
        this.showOSPopup('システムファイル', 'ダウンロードするファイルが選択されていません。');
        return;
    }

    // 壁紙が含まれているかチェック
    const hasWallpaper = this._selectedSystemFiles.some(f => f.toLowerCase().startsWith('wallpaper.'));
    if (hasWallpaper) {
        const confirm = await this.showDialog(
            '⚠️ 壁紙の置き換え',
            '選択されたファイルに壁紙が含まれています。既存の壁紙を削除して新しい壁紙に置き換えますか？',
            [
                { label: 'OK', value: 'ok' },
                { label: 'キャンセル', value: 'cancel' }
            ]
        );
        if (confirm !== 'ok') {
            // 壁紙を除外して続行するか、キャンセルするか
            const choice = await this.showDialog(
                '壁紙の処理',
                '壁紙を除外して他のファイルだけをダウンロードしますか？',
                [
                    { label: '壁紙を除外して続行', value: 'exclude' },
                    { label: 'キャンセル', value: 'cancel' }
                ]
            );
            if (choice === 'cancel') return;
            // 壁紙を除外
            this._selectedSystemFiles = this._selectedSystemFiles.filter(f => !f.toLowerCase().startsWith('wallpaper.'));
            if (this._selectedSystemFiles.length === 0) {
                this.showOSPopup('システムファイル', 'ダウンロードするファイルがなくなりました。');
                return;
            }
        }
    }

    // 進捗表示
    const progress = this._showProgressOverlay(
        'システムファイルダウンロード',
        '準備中...',
        '0%',
        true // キャンセル可能
    );

    let successCount = 0;
    let failCount = 0;
    const total = this._selectedSystemFiles.length;

    for (let i = 0; i < total; i++) {
        if (this._backupCancelled) break; // キャンセル処理
        const fileName = this._selectedSystemFiles[i];
        const percent = Math.round(((i + 1) / total) * 100);
        this._updateProgressOverlay(progress, `ダウンロード中: ${fileName}`, `${percent}%`, fileName);

        try {
            await this._downloadAndSaveSystemFile(fileName);
            successCount++;
        } catch (e) {
            console.error(`ファイル ${fileName} のダウンロードに失敗:`, e);
            failCount++;
        }
    }

    this._hideProgressOverlay(progress);

    // 完了メッセージ
    let msg = `ダウンロード完了: ${successCount} 個成功`;
    if (failCount > 0) msg += `, ${failCount} 個失敗`;
    this.showOSPopup('システムファイル', msg);

    // 壁紙が含まれていた場合は適用
    const downloadedWallpaper = this._selectedSystemFiles.find(f => f.toLowerCase().startsWith('wallpaper.'));
    if (downloadedWallpaper && successCount > 0) {
        this.applyWP();
    }

    // 選択状態をリセット（任意）
    this._selectedSystemFiles = [];
    // UIのチェックボックスもクリア
    const listContainer = document.getElementById('system-file-list');
    if (listContainer) listContainer.innerHTML = '';
}

/**
 * 単一のシステムファイルをダウンロードして適切な場所に保存
 */
async _downloadAndSaveSystemFile(fileName) {
    // 1. ファイルをダウンロード
    const url = `https://raw.githubusercontent.com/${this._storeRepo.owner}/${this._storeRepo.repo}/${this._storeRepo.branch}/${encodeURIComponent(fileName)}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const blob = await response.blob();

    // 2. 保存先を決定
    const lowerName = fileName.toLowerCase();
    let targetDirHandle;
    let targetFileName = fileName;

    if (lowerName.startsWith('boot.')) {
        // system/boot/ に保存
        const sysDir = await this.root.getDirectoryHandle('system', { create: true });
        targetDirHandle = await sysDir.getDirectoryHandle('boot', { create: true });
        // 既存の boot ファイルを削除（同じ拡張子のものがあれば削除）
        for await (const entry of targetDirHandle.values()) {
            if (entry.kind === 'file' && entry.name.toLowerCase().startsWith('boot.')) {
                await targetDirHandle.removeEntry(entry.name);
            }
        }
    } else if (lowerName.startsWith('shutdown.')) {
        const sysDir = await this.root.getDirectoryHandle('system', { create: true });
        targetDirHandle = await sysDir.getDirectoryHandle('shutdown', { create: true });
        // 既存の shutdown ファイルを削除
        for await (const entry of targetDirHandle.values()) {
            if (entry.kind === 'file' && entry.name.toLowerCase().startsWith('shutdown.')) {
                await targetDirHandle.removeEntry(entry.name);
            }
        }
    } else if (lowerName.startsWith('wallpaper.')) {
        const sysDir = await this.root.getDirectoryHandle('system', { create: true });
        targetDirHandle = sysDir;
        // 既存の壁紙を全て削除（wallpaper.*）
        const exts = ['html', 'png', 'jpg', 'jpeg', 'gif', 'webp'];
        for (const ext of exts) {
            try {
                await targetDirHandle.removeEntry(`wallpaper.${ext}`);
            } catch(e) {}
        }
        // 壁紙ファイル名はそのまま（例: wallpaper.png）
    } else {
        // その他のファイルは system/misc/ に保存（フォールバック）
        const sysDir = await this.root.getDirectoryHandle('system', { create: true });
        targetDirHandle = await sysDir.getDirectoryHandle('misc', { create: true });
    }

    // 3. ファイルを保存
    const fileHandle = await targetDirHandle.getFileHandle(targetFileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();

    // ログ出力（任意）

        // --- 2. プレビュー表示ロジック (枠内収容版) ---
        const showPreview = async (entry) => {
            const file = await entry.getFile();
            const ext = entry.name.split('.').pop().toLowerCase();
            
            // contentの中身をプレビュー用に書き換える
            content.innerHTML = `
                <div style="display:flex; flex-direction:column; height:100%; align-items:center; justify-content:center; text-align:center;">
                    <div id="pv-container" style="width:100%; flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:12px; background:rgba(0,0,0,0.03); margin-bottom:15px;">
                        </div>

                    <p style="font-size:11px; opacity:0.5; margin-bottom:20px;">${(file.size / 1024).toFixed(1)} KB</p>
                    <div style="display:flex; gap:10px; width:100%;">

            const pvContainer = content.querySelector('#pv-container');

                pvContainer.innerHTML = `<video src="${URL.createObjectURL(file)}" controls autoplay style="max-width:100%; max-height:100%;"></video>`;
            } else if (['mp3', 'wav', 'aac', 'flac', 'ogg', 'm4a'].includes(ext)) {
                pvContainer.innerHTML = `<div style="font-size:60px;">🎵</div><audio src="${URL.createObjectURL(file)}" controls autoplay style="width:90%; position:absolute; bottom:20px;"></audio>`;
                pvContainer.style.position = 'relative';
            } else {
                pvContainer.innerHTML = `<div style="font-size:50px; opacity:0.3;">📄</div>`;
            }

            document.getElementById('pv-back').onclick = () => showListUI();
            document.getElementById('pv-select').onclick = async () => {
                finishPicker({ 
                    fileName: entry.name, 
                    data: await file.arrayBuffer(), 
                    path: [...currentPath, entry.name].join('/'),
                    type: file.type
                });
            };
        };

        // --- 3. 描画ロジック ---
        const render = async () => {
            const listCont = content.querySelector('#picker-list');
            const pathDisplay = content.querySelector('#picker-path-display');
            if (!listCont) return;

            listCont.innerHTML = '';
            pathDisplay.innerText = `root/ ${currentPath.join('/')}`;

            let dir = this.root;
            for (const p of currentPath) dir = await dir.getDirectoryHandle(p);

            if (currentPath.length > 0) {
                const upItem = document.createElement('div');
                upItem.style = "padding:16px; border-bottom:1px solid rgba(128,128,128,0.1); cursor:pointer; color:var(--ui-accent, #0078d4); font-weight:bold; display:flex; align-items:center; gap:8px;";
                upItem.innerHTML = `⬅<span>戻る</span>`;
                upItem.onclick = () => { currentPath.pop(); render(); };
                listCont.appendChild(upItem);
            }

            for await (const entry of dir.values()) {
                const ext = entry.name.split('.').pop().toLowerCase();
                let icon = '📄';
                if (entry.kind === 'directory') icon = '📂';
                else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) icon = '🖼️';
                else if (['mp4', 'mov', 'webm'].includes(ext)) icon = '🎬';
                else if (['mp3', 'wav', 'aac', 'flac', 'm4a'].includes(ext)) icon = '🎵';
                else if (['html', 'js', 'css', 'json'].includes(ext)) icon = '⚙️';

                const item = document.createElement('div');
                item.style = "padding:14px; border-bottom:1px solid rgba(128,128,128,0.05); cursor:pointer; display:flex; align-items:center; gap:12px;";
                item.innerHTML = `<span style="font-size:20px;">${icon}</span><span style="font-size:14px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${entry.name}</span>`;
                
                item.onclick = async () => {
                    if (entry.kind === 'directory') {
                        currentPath.push(entry.name);
                        render();
                    } else {
                        if (mode === 'open') {
                            showPreview(entry);
                        } else {
                            const filenameInput = content.querySelector('#picker-filename');
                            if (filenameInput) filenameInput.value = entry.name;
                        }
                    }
                };
                listCont.appendChild(item);
            }
        };

        const finishPicker = (result) => {
            picker.style.opacity = '0';
            content.style.transform = 'scale(0.8)';
            setTimeout(() => { picker.remove(); resolve(result); }, 200);
        };

        // 初期表示開始
        showListUI();
    });
}

}

_getUIPartElements(partId) {
    const sel = this._uiPartRegistry()[partId];
    if (!sel) return [];
    return Array.from(document.querySelectorAll(sel));
}

// 1パーツ分を再適用（前回分は正確に剥がす）
_applyUIPart(partId) {
    const els = this._getUIPartElements(partId);
    if (els.length === 0) return;
    const ov = (this.config.uiOverrides || {})[partId] || {};

    els.forEach(el => {
        // 前回この機構で付けたスタイルだけを除去
        if (el._paaosUIKeys) {
            el._paaosUIKeys.forEach(k => el.style.removeProperty(k));
            el._paaosUIKeys = null;
        }
        const applied = [];
        for (const [prop, val] of Object.entries(ov)) {
            if (val === '' || val == null) continue;
            try {
                el.style.setProperty(prop, val);
                applied.push(prop);
            } catch (_) {}
        }
        if (applied.length) el._paaosUIKeys = applied;
    });
}

// 全パーツ再適用
applyUIOverrides() {
    if (!this.isRooted) {
        // 非root：残留を掃除するだけ
        document.querySelectorAll('*').forEach(el => {
            if (el._paaosUIKeys) {
                el._paaosUIKeys.forEach(k => el.style.removeProperty(k));
                el._paaosUIKeys = null;
            }
        });
        return;
    }
    const ov = this.config.uiOverrides || {};
    Object.keys(this._uiPartRegistry()).forEach(pid => {
        if (ov[pid] && Object.keys(ov[pid]).length) this._applyUIPart(pid);
    });
}

// 単一プロパティ設定（value==='' で削除）
_setUIOverride(partId, prop, value) {
    if (!this._uiPartRegistry()[partId]) throw new Error(`パーツ "${partId}" は存在しません。`);
    if (!this.config.uiOverrides) this.config.uiOverrides = {};
    if (!this.config.uiOverrides[partId]) this.config.uiOverrides[partId] = {};

    if (value === '' || value == null) {
        delete this.config.uiOverrides[partId][prop];
    } else {
        this.config.uiOverrides[partId][prop] = value;
    }
    if (Object.keys(this.config.uiOverrides[partId]).length === 0) {
        delete this.config.uiOverrides[partId];
    }
    this._applyUIPart(partId);
    this._saveUIOverrides();
}

_resetUIPart(partId) {
    if (!this.config.uiOverrides) return;
    delete this.config.uiOverrides[partId];
    this._applyUIPart(partId);
    this._saveUIOverrides();
}

_resetAllUIOverrides() {
    this.config.uiOverrides = {};
    // 全要素の残留を掃除
    document.querySelectorAll('*').forEach(el => {
        if (el._paaosUIKeys) {
            el._paaosUIKeys.forEach(k => el.style.removeProperty(k));
            el._paaosUIKeys = null;
        }
    });
    this._saveUIOverrides();
}

_saveUIOverrides() {
    if (this._uiSaveTimer) clearTimeout(this._uiSaveTimer);
    this._uiSaveTimer = setTimeout(() => { this.saveConfig(); }, 400);

 case 'SHOW_DIALOG':   // ★ 拡張版対応

        data.title, 
        data.message, 
        data.buttons, 
        data.options || {}  // ← ここが重要！
    );
    sourceWindow.postMessage({ 
        type: 'DIALOG_RESULT', 
        result: dialogResult, 
        requestId: data.requestId 
    }, '*');
    break;

                    // --- handleAppMessage 内に追加 ---
case 'CALL_FILE_PICKER':
    const result = await this.openSystemFilePicker(senderId, data.mode, data.options);
    if (result) {
        // 選択されたファイル名と【データ実体】をアプリに返す
        sourceWindow.postMessage({ 
            type: 'FILE_PICKER_RESULT', 
            fileName: result.fileName,
            data: result.data, // ArrayBufferとして送信
            fileType: result.type,
            requestId: data.requestId 
        }, '*');
    } else {
        sourceWindow.postMessage({ type: 'FILE_PICKER_CANCEL', requestId: data.requestId }, '*');
    }
    break;


                    
                case 'showSystemPopup':
                    this.showOSPopup(data.title, data.message, senderId);   // ★ senderId を渡す
                    break;
                case 'forceQuit':
                    const idToKill = data.targetId || data.appId;
                    if (idToKill) this.killApp(idToKill);
                    break;
                case 'reboot': 
    // システムアプリ以外からの再起動要求はブロック
    if (!isTrustedSender) {
        console.warn(`[Security] 外部アプリ (${senderId}) による再起動を拒否しました。[!権限がありません]`);
        this.showOSPopup('セキュリティ', `アプリ「${senderId}」による再起動を拒否しました。権限がありません。`);

    }
    // ★ 通知履歴にアプリIDを記録

        '再起動',
