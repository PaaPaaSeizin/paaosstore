/* ★ クイックパネルから通知パネルへ切替（クイックは閉じる） */
openNotificationsFromQuickPanel() {
    // クイックパネルを閉じる（backdrop も一緒に落とす）
    if (this.panelActive) {
        this.panelActive = false;
        document.getElementById('quick-panel')?.classList.remove('active');
        // backdrop は通知パネルでも使うので、いったんリセット
        const backdrop = document.getElementById('panel-backdrop');
        if (backdrop) {
            backdrop.classList.remove('active');
            backdrop.onclick = null;
        }
    }
    // そのまま通知パネルを開く
    this.toggleNotificationPanel();
}
/* ★ 追加：通知パネル開閉 */
toggleNotificationPanel() {
    if (this.movingAppId) return;

    const panel    = document.getElementById('notification-panel');
    const backdrop = document.getElementById('panel-backdrop');
    if (!panel || !backdrop) return;

    // 既に開いていれば閉じる
    if (this.notificationPanelActive) {
        this.closeNotificationPanel();
        return;
    }

    // クイックパネルが開いていたら閉じる
    if (this.panelActive) {
        this.panelActive = false;
        document.getElementById('quick-panel')?.classList.remove('active');
    }

    // 中身を描画
    this.renderNotificationPanel();

    // 表示
    panel.classList.add('active');
    backdrop.classList.add('active');
    this.notificationPanelActive = true;

    // 空白（バックドロップ）を押したら閉じる
    backdrop.onclick = () => this.closeNotificationPanel();
}

/* ★ 追加：通知パネルを閉じる */
closeNotificationPanel() {
    const panel    = document.getElementById('notification-panel');
    const backdrop = document.getElementById('panel-backdrop');
    if (!panel) return;
    panel.classList.remove('active');
    backdrop.classList.remove('active');
    this.notificationPanelActive = false;
    backdrop.onclick = null;
}

/* ★ 追加：通知パネルの中身を描画（開く・削除対応） */
async renderNotificationPanel() {
    const list = document.getElementById('notification-list');
    if (!list) return;

    // ★ キャッシュがあれば即描画、なければ読み込み
    let logs;
    if (this._notificationCache) {
        logs = this._notificationCache;
    } else {
        try { logs = await this.loadNotifications(); } catch(_) { logs = []; }
        this._notificationCache = logs;
    }

    if (!logs || logs.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding:40px; opacity:0.5; font-size:13px;">通知はありません</div>';
        return;
    }
    list.innerHTML = '';
    // 新しい順に表示するため、元のインデックスを保持
    const indexed = logs.map((n, i) => ({ ...n, _idx: i }));
    indexed.reverse();
    indexed.forEach(n => {
        const hasApp = n.appId && this.apps[n.appId];
        const appName = hasApp ? this.apps[n.appId].name : '';
        const item = document.createElement('div');
        item.className = 'notif-item';
        item.style.cssText = 'display:flex; align-items:center; gap:8px; padding:12px; border-bottom:0.5px solid rgba(128,128,128,0.2);';
        item.innerHTML = `
            <div class="notif-content" style="flex:1; min-width:0; ${hasApp ? 'cursor:pointer;' : ''}">
                <span class="notif-title">${this._escapeHtml ? this._escapeHtml(n.title || '通知') : (n.title || '通知')}</span>
                <span class="notif-msg">${this._escapeHtml ? this._escapeHtml(n.message) : n.message}</span>
                <span class="notif-time">${n.time}</span>
                ${hasApp ? `<span style="font-size:10px; opacity:0.5; margin-top:2px;">📱 ${this._escapeHtml ? this._escapeHtml(appName) : appName}</span>` : ''}
            </div>
            ${hasApp ? `<button class="notif-open-btn" style="flex-shrink:0; background:var(--accent); color:#fff; border:none; padding:6px 12px; border-radius:14px; font-size:11px; font-weight:bold; cursor:pointer;">開く</button>` : ''}
            <button class="notif-del-btn" style="flex-shrink:0; background:transparent; color:#ff6b6b; border:none; padding:6px 8px; border-radius:50%; font-size:14px; cursor:pointer;">✕</button>
        `;

        // コンテンツクリック or 「開く」でアプリ起動
        if (hasApp) {
            const openFn = () => this._openNotificationApp(n.appId);
            item.querySelector('.notif-content').onclick = openFn;
            item.querySelector('.notif-open-btn').onclick = (e) => {
                e.stopPropagation();
                openFn();
            };
        }

        // ✕ 削除（フェードアウトのみ → 再描画）
        item.querySelector('.notif-del-btn').onclick = async (e) => {
            e.stopPropagation();
            item.style.transition = 'opacity 0.18s';
            item.style.opacity = '0';
            await this.deleteNotification(n._idx);
            setTimeout(() => this.renderNotificationPanel(), 200);
        };

        list.appendChild(item);
    });
}

/* ★ 追加：通知からアプリを起動 */
_openNotificationApp(appId) {
    if (!appId || !this.apps[appId]) return;
    // 通知パネルを閉じる
    if (this.notificationPanelActive) this.closeNotificationPanel();
    // アプリ起動
    this.launch(appId);
}

startSplitScreen() {
    // スイッチャーを閉じる
    this.closeSwitcher();
    // アプリ選択ダイアログを表示
    this.showSplitAppPicker();
}

showSplitAppPicker() {
    const allApps = Object.keys(this.apps).filter(id => !this.config.hiddenApps.includes(id));
    if (allApps.length < 2) {
        this.showOSPopup('分割表示', '分割するには少なくとも2つのアプリが必要です');
        return;
    }

    let selected = [];
    const renderPicker = () => {
        const options = {
            title: '分割するアプリを選択 (2つ)',
            html: `
                <div style="max-height:300px; overflow-y:auto; text-align:left;">
                    ${allApps.map(id => `
                        <div style="display:flex; align-items:center; gap:10px; padding:8px; border-bottom:1px solid rgba(128,128,128,0.1);">
                            <span style="font-size:20px;">${this.apps[id].icon}</span>
                            <span style="flex:1;">${this.apps[id].name}</span>
                            <button class="btn-mini" data-id="${id}" style="background:${selected.includes(id) ? '#4CAF50' : 'var(--accent)'}; color:#fff; border:none; padding:4px 12px; border-radius:12px; font-size:12px; cursor:pointer;">
                                ${selected.includes(id) ? '✓ 選択済み' : '選択'}
                            </button>
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top:12px; text-align:center; color:${selected.length === 2 ? '#4CAF50' : '#888'};">
                    ${selected.length === 2 ? '✅ 2つ選択しました。分割を開始します。' : `${selected.length}/2 選択済み`}
                </div>
            `,
            buttons: [
                { label: 'キャンセル', value: 'cancel' }
            ],
            style: { width: '320px', maxHeight: '70vh' }
        };
        // ボタンクリックで選択切り替え
        // ダイアログ表示前にイベントリスナーを仕込むため、showDialogのオプションにコールバックを渡す
        // しかしshowDialogは生成後にHTMLをセットするので、後からイベントを付与する。
        // 代わりに、showDialogで表示した後に、querySelectorでボタンを取得してリスナーを追加する。
        // しかし、showDialogはPromiseを返すので、その前にDOMが生成されるタイミングが難しい。
        // 簡易的に、showDialog内でHTMLを表示し、その後でボタンにイベントを付与するために、setTimeoutで囲む。
        this.showDialog('分割表示', options.html, options.buttons, options)
            .then((result) => {
                if (result === 'cancel' || selected.length !== 2) {
                    // キャンセルまたは選択不足なら何もしない
                    return;
                }
                // 選択完了 → 分割開始
                this.launchSplitApps(selected[0], selected[1]);
            });
        // ダイアログ表示後にボタンにイベントを付与
        setTimeout(() => {
            const btns = document.querySelectorAll('.modal-dialog .btn-mini[data-id]');
            btns.forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const idx = selected.indexOf(id);
                    if (idx > -1) {
                        selected.splice(idx, 1);
                    } else {
                        if (selected.length < 2) {
                            selected.push(id);
                        } else {
                            this.showOSPopup('選択制限', '2つまでしか選択できません');
                            return;
                        }
                    }
                    // 選択状態を更新（ダイアログ内のHTMLを書き換え）
                    const contentDiv = document.querySelector('.modal-dialog .modal-dialog-content') || document.querySelector('.modal-dialog [style*="max-height"]');
                    if (contentDiv) {
                        // 再描画（簡易的にダイアログを閉じて再度開く？ → 現在は再描画が面倒なので、シンプルにリセット）
                        // 代わりに、選択数を上部に表示して、ボタン文言を変えるだけにする。
                        // とりあえず、選択状態を反映するためにボタンの背景色とテキストを変更
                        const allAppBtns = document.querySelectorAll('.modal-dialog .btn-mini[data-id]');
                        allAppBtns.forEach(b => {
                            const bid = b.dataset.id;
                            if (selected.includes(bid)) {
                                b.style.background = '#4CAF50';
                                b.textContent = '✓ 選択済み';
                            } else {
                                b.style.background = 'var(--accent)';
                                b.textContent = '選択';
                            }
                        });
                        // カウント表示
                        const countDiv = document.querySelector('.modal-dialog .modal-dialog-content div:last-child');
                        if (countDiv) {
                            countDiv.textContent = selected.length === 2 ? '✅ 2つ選択しました。分割を開始します。' : `${selected.length}/2 選択済み`;
                            countDiv.style.color = selected.length === 2 ? '#4CAF50' : '#888';
                        }
                        // 選択完了時に自動で進める？ → ユーザーが「分割開始」ボタンを押す必要があるので、OKボタンを押すと開始。
                        // OKボタンが押されたときにselected.length === 2 なら進む。
                    }
                };
            });
            // OKボタンの挙動をカスタマイズ（元々のOKはキャンセルと同じ扱い？）
            // showDialogのボタンに「分割開始」を追加するために、ボタンリストを変更する必要がある。
            // 現在はキャンセルだけなので、代わりに「分割開始」ボタンを追加する。
            // 上記のbuttonsではキャンセルだけだが、実際は「分割開始」を追加したい。
            // そこで、ダイアログ内に「分割開始」ボタンをHTMLで追加する。
            const dialog = document.querySelector('.modal-dialog');
            if (dialog) {
                const btnContainer = dialog.querySelector('div:last-child');
                if (btnContainer) {
                    const startBtn = document.createElement('button');
                    startBtn.textContent = '分割開始';
                    startBtn.style.cssText = 'background:#4CAF50; color:#fff; border:none; padding:8px 20px; border-radius:40px; font-weight:bold; cursor:pointer;';
                    startBtn.onclick = () => {
                        if (selected.length === 2) {
                            // ダイアログを閉じて分割開始
                            dialog.closest('.modal-dialog-overlay').remove();
                            this.launchSplitApps(selected[0], selected[1]);
                        } else {
                            this.showOSPopup('注意', '2つのアプリを選択してください');
                        }
                    };
                    btnContainer.prepend(startBtn);
                }
            }
        }, 100);
    };
    renderPicker();
}

launchSplitApps(topId, bottomId) {
    // スイッチャーを閉じる
    this.closeSwitcher();
    // 既存の分割があれば閉じる
    this.closeSplitScreen();

    const container = document.createElement('div');
    container.id = 'split-view';
    container.className = 'active';
    document.getElementById('window-layer').appendChild(container);

    // 上部ペイン
    const topPane = document.createElement('div');
    topPane.className = 'split-pane';
    topPane.id = 'split-pane-top';
    container.appendChild(topPane);

    // 分割線
    const divider = document.createElement('div');
    divider.className = 'split-divider';
    divider.id = 'split-divider';
    container.appendChild(divider);

    // 下部ペイン
    const bottomPane = document.createElement('div');
    bottomPane.className = 'split-pane';
    bottomPane.id = 'split-pane-bottom';
    container.appendChild(bottomPane);

    // 初期比率を設定 (50%)
    this.splitState.ratio = 50;
    this.applySplitRatio();

    // アプリを起動（ペインに配置）
    const topWin = this._createAppWindow(topId, topPane);
    const bottomWin = this._createAppWindow(bottomId, bottomPane);

    // 状態保存
    this.splitState.active = true;
    this.splitState.topId = topId;
    this.splitState.bottomId = bottomId;
    this.splitState.topWin = topWin;
    this.splitState.bottomWin = bottomWin;
    this.splitState.container = container;
    this.splitState.divider = divider;

    // 分割線のドラッグイベント
    this._initSplitDrag(divider, container);

    // 分割線クリックメニュー
    this._initSplitMenu(divider);

    // ドック・編集ボタンを隠す
    document.getElementById('dock').classList.add('hidden');
    document.getElementById('edit-trigger').style.display = 'none';

    // 起動したアプリを runningApps に追加（既に launch 内で追加されるが、_createAppWindow では追加されないため）
    if (!this.runningApps.includes(topId)) this.runningApps.push(topId);
    if (!this.runningApps.includes(bottomId)) this.runningApps.push(bottomId);
}

_createAppWindow(id, container) {
    const app = this.apps[id];
    if (!app) return null;

    // 既存のウィンドウがあれば削除（一意性のため）
    const oldWin = document.getElementById('win-' + id);
    if (oldWin) oldWin.remove();

    const win = document.createElement('div');
    win.className = 'window';
    win.id = 'win-' + id;
    win.style.position = 'absolute';
    win.style.inset = '0';
    win.style.transform = 'none';
    win.style.opacity = '1';
    win.style.pointerEvents = 'auto';
    win.style.borderRadius = '0';
    win.style.transition = 'none';

    win.innerHTML = `
        <div class="win-header">
            <span>${app.name}</span>
            <div style="display:flex; gap:15px;">
                <span onclick="kernel.goHome()" style="cursor:pointer; padding:5px;">―</span>
                <span onclick="kernel.killApp('${id}')" style="cursor:pointer; padding:5px;">✕</span>
            </div>
        </div>
        <div class="win-body" id="body-${id}"></div>
    `;

    container.appendChild(win);

    // レンダリング（システムアプリ or 外部アプリ）
    if (app.type === 'sys') {
        this.renderSysApp(id);
    } else {
        const frame = document.createElement('iframe');
        frame.id = `iframe-${id}`;
        frame.src = URL.createObjectURL(new Blob([app.content], { type: 'text/html' }));
        document.getElementById(`body-${id}`).appendChild(frame);
    }

    return win;
}

_initSplitDrag(divider, container) {
    let isDragging = false;
    let startY = 0;
    let startTopHeight = 0;

    const onStart = (e) => {
        e.preventDefault();
        isDragging = true;
        startY = e.clientY;
        const topPane = document.getElementById('split-pane-top');
        if (topPane) startTopHeight = topPane.offsetHeight;
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';
        divider.setPointerCapture(e.pointerId);
    };

    const onMove = (e) => {
        if (!isDragging) return;
        const currentY = e.clientY;
        const delta = currentY - startY;
        const totalHeight = container.offsetHeight;
        const dividerHeight = 6;
        let newTopHeight = Math.max(50, Math.min(totalHeight - dividerHeight - 50, startTopHeight + delta));
        const newRatio = (newTopHeight / (totalHeight - dividerHeight)) * 100;
        this.splitState.ratio = Math.max(10, Math.min(90, newRatio));
        this.applySplitRatio();
        e.preventDefault();
    };

    const onEnd = (e) => {
        if (!isDragging) return;
        isDragging = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        divider.releasePointerCapture(e.pointerId);
    };

    divider.addEventListener('pointerdown', onStart);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onEnd);
    window.addEventListener('pointercancel', onEnd);
}

async confirmCloseSplitScreen() {
    const result = await this.showDialog(
        '分割表示終了',
        '分割表示を終了しますか？',
        [
            { label: '終了', value: 'ok' },
            { label: 'キャンセル', value: 'cancel' }
        ]
    );
    if (result === 'ok') {
        this.closeSplitScreen();
    }
}

applySplitRatio() {
    const container = this.splitState.container;
    if (!container) return;
    const topPane = document.getElementById('split-pane-top');
    const bottomPane = document.getElementById('split-pane-bottom');
    const divider = document.getElementById('split-divider');
    if (!topPane || !bottomPane || !divider) return;

    const ratio = this.splitState.ratio; // 0-100
    const totalHeight = container.offsetHeight;
    const topHeight = (totalHeight * ratio) / 100;
    const dividerHeight = 6;
    const bottomHeight = totalHeight - topHeight - dividerHeight;

    topPane.style.flex = 'none';
    topPane.style.height = topHeight + 'px';
    divider.style.flex = 'none';
    divider.style.height = dividerHeight + 'px';
    bottomPane.style.flex = 'none';
    bottomPane.style.height = bottomHeight + 'px';
}

_initSplitMenu(divider) {
    const menu = document.createElement('div');
    menu.className = 'split-menu';
    menu.innerHTML = `
        <button data-action="swap">🔄 上下入れ替え</button>
        <button data-action="change">📱 アプリ変更</button>
        <button data-action="close" class="danger">✕ 終了</button>
    `;
    divider.appendChild(menu);

    // クリックでメニュー表示
    divider.addEventListener('click', (e) => {
        e.stopPropagation();
        const isActive = menu.classList.contains('active');
        // 全てのメニューを閉じる
        document.querySelectorAll('.split-menu.active').forEach(m => m.classList.remove('active'));
        if (!isActive) {
            menu.classList.add('active');
        }
    });

    // メニュー項目の処理（該当部分のみ）
menu.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = btn.dataset.action;
        menu.classList.remove('active');
        switch (action) {
            case 'swap':
                this.swapSplitPanes();
                break;
            case 'change':
                this.changeSplitApps();
                break;
            case 'close':
                this.confirmCloseSplitScreen(); // ★ ここを修正
                break;
        }
    });
});

    // 外側クリックでメニューを閉じる
    document.addEventListener('click', () => {
        menu.classList.remove('active');
    });
}

// ========== タイマー管理（平行アニメーション対応） ==========
_clearTimer(key) {
    if (this._timers[key]) {
        clearTimeout(this._timers[key]);
        this._timers[key] = null;
    }
}

_clearAllTimers() {
    for (const key in this._timers) {
        if (this._timers[key]) {
            clearTimeout(this._timers[key]);
            this._timers[key] = null;
        }
    }
}

_setTimer(key, callback, delay) {
    this._clearTimer(key);
    this._timers[key] = setTimeout(() => {
        callback();
        this._timers[key] = null;
    }, delay);
}

swapSplitPanes() {
    if (!this.splitState.active) return;
    const topPane = document.getElementById('split-pane-top');
    const bottomPane = document.getElementById('split-pane-bottom');
    if (!topPane || !bottomPane) return;

    // 中身を入れ替え
    const topChildren = topPane.children;
    const bottomChildren = bottomPane.children;
    // ウィンドウ要素を移動
    const topWin = topPane.querySelector('.window');
    const bottomWin = bottomPane.querySelector('.window');
    if (topWin && bottomWin) {
        topPane.appendChild(bottomWin);
        bottomPane.appendChild(topWin);
    }

    // IDも入れ替え
    const tempId = this.splitState.topId;
    this.splitState.topId = this.splitState.bottomId;
    this.splitState.bottomId = tempId;
    // ウィンドウ参照も更新
    this.splitState.topWin = topPane.querySelector('.window');
    this.splitState.bottomWin = bottomPane.querySelector('.window');
}

changeSplitApps() {
    // アプリを維持したまま分割を解除（keepApps=true）
    this.closeSplitScreen(true);
    // 選択画面を表示（選択完了後に再度 launchSplitApps が呼ばれる）
    this.showSplitAppPicker();
}

closeSplitScreen(keepApps = false) {
    if (!this.splitState.active) return;

    const topId = this.splitState.topId;
    const bottomId = this.splitState.bottomId;

    // ★ アプリを終了する場合は、killApp を呼ばずに直接削除
    if (!keepApps) {
        // ウィンドウを削除（すでに container.remove() で消えるため、個別に削除する必要はない）
        // ただし、runningApps からは除外する
        if (topId && this.runningApps.includes(topId)) {
            this.runningApps = this.runningApps.filter(id => id !== topId);
            // サムネイル等の後片付け（必要なら）
            localStorage.removeItem(`paaos_thumb_${topId}`);
        }
        if (bottomId && this.runningApps.includes(bottomId)) {
            this.runningApps = this.runningApps.filter(id => id !== bottomId);
            localStorage.removeItem(`paaos_thumb_${bottomId}`);
        }
        // アクティブアプリが分割のものならリセット
        if (this.activeAppId === topId || this.activeAppId === bottomId) {
            this.activeAppId = null;
            this._updateStatusBarColor();   // ★ 追加
        }
    }

    // コンテナを削除
    if (this.splitState.container) {
        this.splitState.container.remove();
    }

    // 状態リセット
    this.splitState.active = false;
    this.splitState.topId = null;
    this.splitState.bottomId = null;
    this.splitState.topWin = null;
    this.splitState.bottomWin = null;
    this.splitState.container = null;
    this.splitState.divider = null;

    // ドック・編集ボタンを表示
    document.getElementById('dock').classList.remove('hidden');
    document.getElementById('edit-trigger').style.display = 'block';
}

showSwitcher() {
if (this.panelActive) this.togglePanel();
this.isSwitcherActive = true;

// ★ 追加：スイッチャー表示中は壁紙ズームを解除（後ろが暗く残るバグ対策）
this._endWallpaperZoom();

    const switcher = document.getElementById('switcher');
    switcher.innerHTML = '';
    switcher.classList.remove('active');   // ★ 追加：前回のactiveを除去
    switcher.style.display = 'flex';

        // ★ 元ウィンドウを一時的に非表示（サムネにタブバーなどが写り込まないように）
    // ★ 既に保存済みなら上書きしない（2回目以降の showSwitcher で 'hidden' が保存されるのを防ぐ）
    document.querySelectorAll('.window').forEach(w => {
        if (!w.dataset.prevVisibility) {
            w.dataset.prevVisibility = w.style.visibility || 'visible';
        }
        w.style.visibility = 'hidden';
    });

    // アクションボタン（最下部）
    // ★ 起動中アプリが1つ以上あるときだけ「すべて閉じる」を表示
    if (this.runningApps.length > 0) {
        const actions = document.createElement('div');
        actions.id = 'switcher-actions';
        actions.innerHTML = `
            <button id="switcher-close-all-btn" class="switcher-action-btn danger" onclick="kernel.closeAllAppsFromSwitcher()">
                <span class="icon">✕</span>
                <span>すべて閉じる</span>
            </button>
        `;
        switcher.appendChild(actions);
    }

    const cardsContainer = document.createElement('div');
    cardsContainer.style.cssText = `
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 0;
        padding: 50px 9% 90px 9%;
        flex: 1;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        box-sizing: border-box;
        touch-action: pan-x;    /* ★ 追加：横パンを許可 */
    `;
    cardsContainer.id = 'switcher-cards';
     switcher.appendChild(cardsContainer);

    // ===== ★ スクロール制御（mouse / touch 統一・rAF スロットル・端クランプ付き） =====
    {
        const deviceEl = document.getElementById('device');

        let scrollPointerId = null;
        let scrollStartX = 0;
        let scrollStartY = 0;
        let scrollStartScrollLeft = 0;
        let scrollAxis = null;
        let scrollCard = null;

        // ★ rAF で1フレーム1回に束ねる
        let pendingScrollLeft = null;
        let rafId = null;
        const flushScroll = () => {
            rafId = null;
            if (pendingScrollLeft !== null) {
                cardsContainer.scrollLeft = pendingScrollLeft;
                pendingScrollLeft = null;
            }
        };

        // ★ デバイス内判定（外れたら追従終了）
        const isInsideDevice = (clientX, clientY, tolerance = 20) => {
            const r = deviceEl.getBoundingClientRect();
            return (
                clientX >= r.left   - tolerance &&
                clientX <= r.right  + tolerance &&
                clientY >= r.top    - tolerance &&
                clientY <= r.bottom + tolerance
            );
        };

        // スナップを一時停止（ドラッグ中は手動制御を最優先）
        const snapOff = () => { cardsContainer.style.scrollSnapType = 'none'; };
        const snapOn  = () => { cardsContainer.style.scrollSnapType = ''; };

        const killClickSuppressor = () => {
            const h = (ev) => {
                ev.stopPropagation();
                ev.preventDefault();
                cardsContainer.removeEventListener('click', h, true);
            };
            cardsContainer.addEventListener('click', h, true);
            setTimeout(() => cardsContainer.removeEventListener('click', h, true), 100);
        };

        cardsContainer.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            if (scrollPointerId !== null) return;
            scrollPointerId = e.pointerId;
            scrollStartX = e.clientX;
            scrollStartY = e.clientY;
            scrollStartScrollLeft = cardsContainer.scrollLeft;
            scrollAxis = null;
            scrollCard = e.target.closest('.switcher-card');
            if (scrollCard) scrollCard.style.transition = 'none';

            snapOff();   // ★ ドラッグ開始時にスナップ解除
        });

        cardsContainer.addEventListener('pointermove', (e) => {
            if (e.pointerId !== scrollPointerId) return;

            // ★ デバイス外に大きく出たら強制終了
            if (!isInsideDevice(e.clientX, e.clientY, 30)) {
                const card = scrollCard;
                if (card) {
                    card.style.transition = 'transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.35s';
                    card.style.removeProperty('transform');
                    card.style.removeProperty('opacity');
                }
                scrollPointerId = null;
                scrollAxis = null;
                scrollCard = null;
                snapOn();
                return;
            }

            const dx = e.clientX - scrollStartX;
            const dy = e.clientY - scrollStartY;

            // ★ 軸ロック（12px 動くまで判定保留）
            if (!scrollAxis) {
                if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {
                    scrollAxis = 'x';
                } else if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {
                    scrollAxis = 'y';
                }
            }

            if (scrollAxis === 'x') {
                // ★ rAF でバッチ更新（ガクガク防止の本丸）
                const maxScroll = cardsContainer.scrollWidth - cardsContainer.clientWidth;
                const next = Math.max(0, Math.min(maxScroll, scrollStartScrollLeft - dx));
                pendingScrollLeft = next;
                if (rafId === null) rafId = requestAnimationFrame(flushScroll);

                if (e.pointerType === 'mouse' && e.cancelable) e.preventDefault();
            } else if (scrollAxis === 'y' && scrollCard) {
                const clamped = Math.min(dy, 0);
                scrollCard.style.setProperty(
                    'transform',
                    `translateY(${clamped}px) scale(${1 + clamped/2000})`,
                    'important'
                );
                scrollCard.style.setProperty(
                    'opacity',
                    String(Math.max(0.5, 1 + clamped/400)),
                    'important'
                );
            }
        });

        const endScroll = (e) => {
            if (e.pointerId !== scrollPointerId) return;

            const dy = e.clientY - scrollStartY;
            const card = scrollCard;
            const wasY = scrollAxis === 'y';
            const wasX = scrollAxis === 'x';

            scrollPointerId = null;
            scrollAxis = null;
            scrollCard = null;
            pendingScrollLeft = null;
            if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }

            snapOn();   // ★ スナップ復帰

            if (wasY && card && dy < -80) {
                const cardId = card.id.replace('card-', '');
                this.killApp(cardId, true);
            } else if (card) {
                card.style.transition = 'transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.35s';
                card.style.removeProperty('transform');
                card.style.removeProperty('opacity');
            }

            if (wasX || wasY) killClickSuppressor();
        };

        cardsContainer.addEventListener('pointerup', endScroll);
        cardsContainer.addEventListener('pointercancel', endScroll);
        // ★ デバイス外でブラウザが pointerup を飛ばさないケースの保険
        window.addEventListener('pointerup', endScroll);

        // ★ マウスホイール縦回転 → 横スクロール
        cardsContainer.addEventListener('wheel', (e) => {
            if (cardsContainer.scrollWidth <= cardsContainer.clientWidth) return;
            e.preventDefault();
            cardsContainer.scrollLeft += (e.deltaY + e.deltaX);
        }, { passive: false });
    }
    // ===== ★ スクロール制御ここまで =====

    // カード生成
    this.runningApps.forEach((id, index) => {
        const app = this.apps[id];
        const card = document.createElement('div');
        card.className = 'switcher-card';
        card.id = 'card-' + id;
        card.style.transitionDelay = `${0.03 * index}s`;
        // ★ 追加：右に行くほど手前に（右端 = 最前面）
        card.style.zIndex = String(10 + index);

        const savedThumb = localStorage.getItem(`paaos_thumb_${id}`) || '';
        const iconHtml = this._isImageIcon(app.icon)
            ? `<img src="${app.icon}" style="width:22px; height:22px; object-fit:cover; border-radius:6px;">`
            : app.icon;

        card.innerHTML = `
            <div class="switcher-card-header">
                <span style="display:flex; align-items:center; gap:8px; min-width:0;">
                    <span style="font-size:16px;">${iconHtml}</span>
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${app.name}</span>
                </span>
                <span class="switcher-kill" style="color:var(--accent); font-size:18px; padding:4px 8px; cursor:pointer;">✕</span>
            </div>
            <div class="switcher-card-body" style="background-image: url('${savedThumb}');"></div>
        `;
// ★ カード本体は click（起動 / ×でキル）だけを担当
// ドラッグ・スクロールは cardsContainer 側で一括制御
card.addEventListener('click', (e) => {
    if (e.target.closest('.switcher-kill')) {
        e.stopPropagation();
        this.killApp(id, true);
        return;
    }
    this._launchFromSwitcher(id);
});

// （下の行に続けて、メソッド定義ではなく、この場で完結させる）
        cardsContainer.appendChild(card);
    });

    this._setTimer('switcher_open', () => {
        switcher.classList.add('active');

        // ★ 一番右（最新）を初期表示
        const maxScroll = Math.max(
            0,
            cardsContainer.scrollWidth - cardsContainer.clientWidth
        );
        cardsContainer.scrollLeft = maxScroll;

        const cards = cardsContainer.querySelectorAll('.switcher-card');
        cards.forEach((card, i) => {
            this._setTimer('switcher_card_' + i, () => {
                card.classList.add('visible');
            }, 30 * i);
        });
    }, 40);

    if (this.runningApps.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.style.cssText = `color: var(--text-primary); opacity: 0.55; margin: auto; font-size: 15px; text-align: center; padding: 40px;`;
        emptyMsg.innerText = '起動中のアプリはありません';
        cardsContainer.appendChild(emptyMsg);
        this._setTimer('switcher_empty', () => this.closeSwitcher(), 1500);
    }
}

/* ★ スイッチャーの「すべて閉じる」ボタン：全カードを上に飛ばしてから一括終了 */
async closeAllAppsFromSwitcher() {
    const switcher = document.getElementById('switcher');
    const cardsContainer = document.getElementById('switcher-cards');
    if (!switcher || !cardsContainer) return;

    // 連打防止
    const btn = document.getElementById('switcher-close-all-btn');
    if (btn) {
        if (btn.disabled) return;
        btn.disabled = true;
    }

    // 進行中のスイッチャー系タイマーを全停止
    this._clearTimer('switcher');
    this._clearTimer('switcher_open');
    this._clearTimer('switcher_close');
    for (let i = 0; i < 30; i++) this._clearTimer('switcher_card_' + i);

    // ── 1. すべてのカードを順番に「上に飛ばす」 ──
    const cards = Array.from(cardsContainer.querySelectorAll('.switcher-card'));
    const stagger = 0.04; // 1枚ごとに40ms ずらす
    cards.forEach((card, index) => {
        if (card._killing) return;
        card._killing = true;

        // ドラッグ用リスナーを解放
        if (card._dragAC) { card._dragAC.abort(); card._dragAC = null; }

        // ドラッグで残ったインライン style を除去
        card.style.removeProperty('transform');
        card.style.removeProperty('opacity');

        // 個別にアニメーション設定
        card.style.transition =
            'transform 0.5s cubic-bezier(0.32, 0.72, 0.24, 1), ' +
            'opacity 0.5s ease';
        card.style.transitionDelay = `${index * stagger}s`;

        // 次フレームで「上に飛ばす」
        requestAnimationFrame(() => {
            card.style.setProperty(
                'transform',
                'translateY(-160%) scale(0.7) rotate(-4deg)',
                'important'
            );
            card.style.setProperty('opacity', '0', 'important');
        });
    });

    // アクションボタンも一緒にフェードアウト
    const actions = document.getElementById('switcher-actions');
    if (actions) {
        actions.style.transition = 'opacity 0.3s ease';
        actions.style.opacity = '0';
    }

    // ── 2. アニメーション完了を待つ ──
    const totalDuration = 500 + Math.max(0, cards.length - 1) * stagger * 1000;
    await new Promise(r => setTimeout(r, Math.max(totalDuration, 600)));

    // ── 3. すべてのアプリを一括終了（アニメ無しで即時削除） ──
    const idsToKill = [...this.runningApps];
    idsToKill.forEach(id => {
        const win = document.getElementById('win-' + id);
        if (win) {
            win._launchToken = null;   // 保留中の RAF を無効化
            win.remove();
        }
        localStorage.removeItem(`paaos_thumb_${id}`);
        if (id === 'sys.cmd') this._cmdFirstLaunchFixed = false;
        if (this._launchOrigins) delete this._launchOrigins[id];
    });

    // ポップアップ / 分割表示も念のため閉じる
    if (this.popupState.active) this.closePopupApp();
    if (this.splitState.active) this.closeSplitScreen();

this.runningApps = [];
this.activeAppId = null;
this._endWallpaperZoom();          // ★ 追加
this._updateStatusBarColor();

// ── 4. スイッチャー本体を閉じる ──
    
    this.isSwitcherActive = false;
    switcher.classList.remove('active');
    switcher.style.transition = 'opacity 0.3s ease';
    switcher.style.opacity = '0';

    await new Promise(r => setTimeout(r, 300));

    switcher.style.display = 'none';
    switcher.style.opacity = '';
    switcher.style.transition = '';
    switcher.innerHTML = '';

    // 元ウィンドウの visibility を復元（ほぼ全削除済みだが念のため）
    document.querySelectorAll('.window').forEach(w => {
        w.style.visibility = '';
        delete w.dataset.prevVisibility;
    });

    // ドック・編集ボタンを復帰
    document.getElementById('dock').classList.remove('hidden');
    document.getElementById('edit-trigger').style.display = 'block';
}

/* ★ スイッチャーからアプリを起動：上に飛ばさず、ドックも出さない */
_launchFromSwitcher(id) {
    const switcher = document.getElementById('switcher');
    if (!switcher) { this.launch(id); return; }

    // タイマー全停止（closeSwitcherの遅延処理をキャンセル）
    this._clearTimer('switcher');
    this._clearTimer('switcher_close');

    // 選択したカード以外はフェード、選択したカードは拡大
    switcher.querySelectorAll('.switcher-card').forEach(c => {
        c.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
        if (c.id === 'card-' + id) {
            c.style.setProperty('transform', 'scale(1.08)', 'important');
        }
        c.style.setProperty('opacity', '0', 'important');
    });

    // スイッチャー背景もフェード
    switcher.style.transition = 'opacity 0.18s ease-out';
    switcher.style.opacity = '0';

    this.isSwitcherActive = false;

    setTimeout(() => {
        // スイッチャーを完全に隠す
        switcher.classList.remove('active');
        switcher.style.display = 'none';
        switcher.style.opacity = '';
        switcher.style.transition = '';

        // 元ウィンドウの visibility を復元
        document.querySelectorAll('.window').forEach(w => {
            w.style.visibility = '';
            delete w.dataset.prevVisibility;
        });

        // ★ ここで launch。ドックは launch() が hidden にするので出ない
        this.launch(id);
    }, 180);
}
/* ★ 高速操作対応：スイッチャーから即起動（上に飛ばない・ドック出さない・競合しない） */
_launchFromSwitcher(id) {
    const switcher = document.getElementById('switcher');
    if (!switcher) { this.launch(id); return; }

    // ★ カード中心を origin に設定（中央から開く）
    const card = document.getElementById('card-' + id);
    const layer = document.getElementById('window-layer');
    if (card && layer) {
        const r = card.getBoundingClientRect();
        const layerRect = layer.getBoundingClientRect();
        this._forcedLaunchOrigin = {
            x: r.left - layerRect.left + r.width / 2,
            y: r.top - layerRect.top + r.height / 2
        };
    }

    // 進行中のタイマーを全て停止（他操作との競合防止）
    this._clearTimer('switcher');
    this._clearTimer('switcher_open');
    this._clearTimer('switcher_close');
    for (let i = 0; i < 30; i++) this._clearTimer('switcher_card_' + i);

    this.isSwitcherActive = false;

    // カードを拡大フェード
    switcher.querySelectorAll('.switcher-card').forEach(c => {
        c.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
        if (c.id === 'card-' + id) {
            c.style.setProperty('transform', 'scale(1.08)', 'important');
        }
        c.style.setProperty('opacity', '0', 'important');
    });
    switcher.style.transition = 'opacity 0.18s ease-out';
    switcher.style.opacity = '0';

    setTimeout(() => {
        switcher.classList.remove('active');
        switcher.style.display = 'none';
        switcher.style.opacity = '';
        switcher.style.transition = '';

        document.querySelectorAll('.window').forEach(w => {
            w.style.visibility = '';
            delete w.dataset.prevVisibility;
        });

        // ★ 強制リフロー：visibility 復元を確定
        void document.body.offsetHeight;

        // ★★ FIX: 対象ウィンドウを一度「最小化状態」に瞬間リセット
        //    → launch() 内の早期リターン（active && !minimized）を回避し
        //      通常の復帰アニメ（minimized → active）を必ず走らせる
        const targetWin = document.getElementById('win-' + id);
        if (targetWin && !targetWin.classList.contains('minimized')) {
            // 瞬間的に切り替え（transition: none でアニメさせない）
            targetWin.style.transition = 'none';
            targetWin.classList.remove('active');
            targetWin.classList.add('minimized');

            // transform-origin をカード中心にセット（拡大の起点）
            if (this._forcedLaunchOrigin) {
                targetWin.style.transformOrigin =
                    `${this._forcedLaunchOrigin.x}px ${this._forcedLaunchOrigin.y}px`;
            }

            // リフロー確定（この瞬間に minimized 状態がブラウザに認識される）
            void targetWin.offsetHeight;

            // transition を戻す → 次のクラス変化で CSS transition が効く
            targetWin.style.removeProperty('transition');
        }

        requestAnimationFrame(() => {
            this.launch(id);
        });
    }, 180);
}

closeSwitcher() {
    const switcher = document.getElementById('switcher');
    if (!switcher) return;

    const cards = switcher.querySelectorAll('.switcher-card');
    cards.forEach((card, index) => {
        if (card._killing) return;      // ★ すでにキルアニメ中なら触らない
        const delay = 0.03 * (cards.length - 1 - index);
        card.style.transitionDelay = `${delay}s`;
        card.classList.remove('visible');
        card.classList.add('closing');
    });

    switcher.classList.remove('active');
    this.isSwitcherActive = false;

    this._setTimer('switcher_close', () => {
        if (!this.isSwitcherActive) {
            switcher.style.display = 'none';
            cards.forEach(c => c.style.transitionDelay = '0s');

            // ★ 元ウィンドウの visibility を確実に復元
            document.querySelectorAll('.window').forEach(w => {
                w.style.visibility = '';
                delete w.dataset.prevVisibility;
            });

            // ★ 先にドックの hidden を外して即表示（下の分岐で待たされないように）
                        document.getElementById('dock').classList.remove('hidden');
            document.getElementById('edit-trigger').style.display = 'block';
            if (this.runningApps.length === 0) {
                this.activeAppId = null;
                this._updateStatusBarColor();   // ★ 追加
            }
        }
    }, 180);
}

    initLockScreen() {
    const handle = document.getElementById('slider-handle');
    const container = document.getElementById('slider-container');
    const track = document.getElementById('slider-track');
    let isDragging = false;
    let startX = 0;
    const maxSlide = container.offsetWidth - handle.offsetWidth - 10;

    const start = (e) => {
        isDragging = true;
        startX = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
        handle.style.transition = 'none';
    };
    
    const move = (e) => {
        if (!isDragging) return;
        const x = (e.type === 'touchmove') ? e.touches[0].clientX : e.clientX;
        let offset = x - startX;
        offset = Math.max(0, Math.min(offset, maxSlide));
        requestAnimationFrame(() => {
            handle.style.transform = `translateX(${offset}px)`;
            track.style.opacity = 1 - (offset / maxSlide);
        });
    };
    
    const end = async (e) => {
        if (!isDragging) return;
        isDragging = false;
        const x = (e.type === 'touchend') ? e.changedTouches[0].clientX : e.clientX;
        
        if (x - startX > maxSlide * 0.7) {
            handle.style.transform = `translateX(${maxSlide}px)`;
            await this.boot();
        } else {
            handle.style.transition = 'transform 0.2s ease-out';
            handle.style.transform = 'translateX(0px)';
            track.style.opacity = 1;
        }
    };

    // ★★★ キーボード（スペースキー）対応 ★★★
    const onKeyDown = (e) => {
    const lockScreen = document.getElementById('lock-screen');
    if (!lockScreen || lockScreen.style.display === 'none') return;

    // ★ 起動処理中なら無視 ★
    if (this._isBootInProgress) return;

    if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        handle.style.transition = 'transform 0.02s ease-out';
        handle.style.transform = `translateX(${maxSlide}px)`;
        track.style.transition = 'opacity 0.02s ease-out';
        track.style.opacity = 0;
        setTimeout(async () => {
            await this.boot();
        }, 50);
    }
};

    // マウス／タッチイベント
    handle.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    handle.addEventListener('touchstart', start, {passive: true});
    window.addEventListener('touchmove', move, {passive: true});
    window.addEventListener('touchend', end, {passive: true});

    // ★★★ キーボードイベントを追加 ★★★
    window.addEventListener('keydown', onKeyDown);

    // クリーンアップ用（必要に応じて）
    this._lockScreenCleanup = () => {
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', end);
        window.removeEventListener('touchmove', move);
        window.removeEventListener('touchend', end);
    };
}

    async getDB() {

async boot() {
    // ★ 既に起動処理中なら何もしない
    if (this._isBootInProgress) return;
    this._isBootInProgress = true;

    // ★ 追加：何らかの理由で残っていた壁紙ズームを必ず解除
    this._endWallpaperZoom();

    try {
        const db = await this.getDB();
        let handle = await new Promise(r => db.transaction("state").objectStore("state").get("root").onsuccess = (e) => r(e.target.result));
        
        let isFirstTime = false;
        if (handle) {
            const opt = { mode: 'readwrite' };
            if (await handle.queryPermission(opt) !== 'granted') {
                if (await handle.requestPermission(opt) !== 'granted') {
                    handle = null;
                    isFirstTime = true;
                }
            }
        } else {
            isFirstTime = true;
        }

        // ========== 初回セットアップ（ウィザード内でフォルダ選択） ==========
        if (isFirstTime) {
            const lock = document.getElementById('lock-screen');
            const lockPrevDisplay = lock ? lock.style.display : '';
            if (lock) lock.style.display = 'none';

            const result = await this.showSetupWizard();
            if (!result || !result.handle) {
                if (lock) lock.style.display = lockPrevDisplay || 'flex';
                this._isBootInProgress = false;
                return;
            }

            handle = result.handle;
            await db.transaction("state", "readwrite").objectStore("state").put(handle, "root");

            // ★ 設定を反映
            this.root = handle;
            this.config.userName    = result.data.name    || 'User';
            this.config.theme       = result.data.theme   || 'dark';
            this.config.accentColor = result.data.accent  || '#ff3e3e';
            this.config.passcode    = result.data.passcode || '';

            // ★ ディレクトリ作成
            for (const f of this.folders) {
                await this.root.getDirectoryHandle(f, { create: true });
            }
            const sysDir = await this.root.getDirectoryHandle('system', { create: true });
            await sysDir.getDirectoryHandle('shutdown', { create: true });
            await sysDir.getDirectoryHandle('boot',     { create: true });

            await this.saveConfig();

            // ★ バックグラウンドでシステムアセットを取得
            this._autoFetchSystemAssets().catch(err => {
                console.warn('[AutoFetch] バックグラウンド取得エラー:', err);
            });

            // ★ アクセントカラーを即反映
            document.documentElement.style.setProperty('--accent', this.config.accentColor);

            // ロック画面を再表示（このあと unlocked にする）
            if (lock) lock.style.display = lockPrevDisplay || 'flex';

        } else {
            // ========== 通常起動 ==========
            this.root = handle;
            this.showLoadingOverlay();
            this.updateLoadingMessage('起動準備中...');
            await new Promise(r => setTimeout(r, 30));

            for (const f of this.folders) {
                await this.root.getDirectoryHandle(f, { create: true });
            }
            const sysDir = await this.root.getDirectoryHandle('system', { create: true });
            await sysDir.getDirectoryHandle('shutdown', { create: true });
            await sysDir.getDirectoryHandle('boot',     { create: true });

            await this.loadConfig();
        }

        // ========== ここから共通の起動処理 ==========
        this.showLoadingOverlay();
        this.updateLoadingMessage('設定を適用中...');

        // ★ パスコード確認
        const loadingOverlay = document.getElementById('boot-loading');
        if (loadingOverlay) loadingOverlay.style.display = 'none';
        const auth = await this.askPasscode();

        if (!auth) {
            this.hideLoadingOverlay();
            document.getElementById('slider-handle').style.transform = 'translateX(0px)';
            document.getElementById('slider-track').style.opacity = 1;
            return; // ★ finally でフラグ解除
        }

        // ★ 認証成功
        this.updateLoadingMessage('アプリを読込中...');
        await this.scanApps();

        this.renderDock();
this.renderQuickPanel();

    async applyWP() {
        const desk = document.getElementById('desktop');
        const lockBlur = document.getElementById('lock-bg-blur');
        const container = document.getElementById('wallpaper-container');
        container.innerHTML = ''; 

        try {
            const sysDir = await this.root.getDirectoryHandle('system');
            let wpFile = null;
            let type = 'image';

            try {
                wpFile = await sysDir.getFileHandle('wallpaper.html');
                type = 'html';
            } catch(e) {
                const exts = ['png', 'jpg', 'jpeg', 'gif', 'webp'];
                for (const ext of exts) {
                    try {
                        wpFile = await sysDir.getFileHandle(`wallpaper.${ext}`);
                        type = 'image';
                        break;
                    } catch(e2) {}
                }
            }

            if (wpFile) {
                const file = await wpFile.getFile();
                const url = URL.createObjectURL(file);

                if (type === 'html') {
                    const iframe = document.createElement('iframe');
                    iframe.src = url;
                    container.appendChild(iframe);
                    // ★ desktop は透明のまま
                    desk.style.backgroundImage = 'none';
                    container.style.backgroundImage = '';
                    lockBlur.style.backgroundImage = 'none';
                } else {
                    // ★ 壁紙は container のみに置く（desktop は透明）
                    desk.style.backgroundImage = 'none';
                    lockBlur.style.backgroundImage = `url(${url})`;

                    container.style.backgroundImage = `url(${url})`;
                    container.style.backgroundSize = 'cover';
                    container.style.backgroundPosition = 'center';
                }
            } else {
                // フォールバック（壁紙なし）も container に
                desk.style.backgroundImage = 'none';
                container.style.backgroundImage = 'linear-gradient(45deg, #1a1a1a, #333)';
                container.style.backgroundSize = 'cover';
            }
        } catch(e) {
            console.warn("Wallpaper loading failed:", e);
        }
         // boot 内の認証成功後
    this.applyTheme();
    if (this.config.customThemeEnabled) {
        await this.applyCustomTheme();
    }
    // ★ 追加：壁紙再構築時はズーム状態を必ず解除
    this._endWallpaperZoom();
    // ★ 壁紙の明るさを解析してステータスバー等の見やすさを自動調整
    this._detectWallpaperTone();
}

    /**
     * 壁紙の明るさを判定して data-wallpaper-tone をセット
     * → ライト壁紙では黒文字、ダーク壁紙では白文字になる
     */
    async _detectWallpaperTone() {
        const container = document.getElementById('wallpaper-container');
        // HTML壁紙（iframe）の場合は判定不能 → ダーク扱い（デフォルト）
        if (container.querySelector('iframe')) {
            document.documentElement.dataset.wallpaperTone = 'dark';
            this._updateStatusBarColor();
            return;
        }
        const bg = container?.style?.backgroundImage || '';
        if (!bg || bg === 'none' || bg.startsWith('linear-gradient')) {
            document.documentElement.dataset.wallpaperTone = 'dark';
            this._updateStatusBarColor();    
            return;
        }
        const urlMatch = bg.match(/url\(["']?(.*?)["']?\)/);
        if (!urlMatch) {
            document.documentElement.dataset.wallpaperTone = 'dark';
            this._updateStatusBarColor();    
            return;
        }
        try {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.src = urlMatch[1];
            await new Promise((res, rej) => {
                img.onload = res;
                img.onerror = rej;
                setTimeout(rej, 3000);  // 念のためタイムアウト
            });
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 32, 32);
            const data = ctx.getImageData(0, 0, 32, 32).data;
            let sum = 0;
            for (let i = 0; i < data.length; i += 4) {
                sum += data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
            }
            const avg = sum / (data.length / 4);
document.documentElement.dataset.wallpaperTone = avg > 140 ? 'light' : 'dark';
this._updateStatusBarColor();                     // ★ 追加
} catch (e) {
    document.documentElement.dataset.wallpaperTone = 'dark';
    this._updateStatusBarColor();                 // ★ 追加
}
    }
    
// ===== FLUID GLOW DESIGN =====
applyFluidGlow() {
    const level = this.config.fluidGlowLevel || 'off';
    // 既存のレベルクラスを全て削除
    document.documentElement.classList.remove(
        'fluid-glow-level-off',
        'fluid-glow-level-low',
        'fluid-glow-level-medium',
        'fluid-glow-level-high'
    );
    // 新しいレベルクラスを付与
    document.documentElement.classList.add(`fluid-glow-level-${level}`);

    // すべての対象要素に .fluid-glow-target を付与（将来要素も含む）
    // MutationObserver ですでに監視しているので、初回は手動で付与
    this._applyFluidGlowToExistingElements();

    // オフの場合は背景の歪みを無効にする（パフォーマンス対策）
    if (level === 'off') {
        document.querySelectorAll('.fluid-glow').forEach(el => {
            el.style.backdropFilter = 'none';
            el.style.webkitBackdropFilter = 'none';
        });
    }
}

_applyFluidGlowToExistingElements() {
    const container = document.getElementById('device');
    if (!container) return;

    // ★ 1. 確実に半透明な既知の要素をターゲット化（優先）
        const knownTargets = [
        '#quick-panel', '#notification-panel', '#dock', '.modal-dialog', '.system-popup',
        '.switcher-card', '.switcher-card-header', '.popup-window',
        '.popup-header', '.split-divider', '#passcode-pad',
        '#yt-settings-overlay > div', '#recovery-screen',
        '.app-icon .icon-box'
    ];
    knownTargets.forEach(sel => {
        document.querySelectorAll(sel).forEach(el => {
            if (!el.classList.contains('fluid-glow-target')) {
                el.classList.add('fluid-glow-target');
            }
        });
    });

    // ★ 2. backdrop-filter がかかっている要素を自動検出（確実な半透明パネル）
    const allElements = container.querySelectorAll('*');
    allElements.forEach(el => {
        const style = window.getComputedStyle(el);
        const backdrop = style.backdropFilter || style.webkitBackdropFilter;
        if (backdrop && backdrop !== 'none') {
            // ❌ アプリウィンドウの背景は絶対に除外
            if (el.closest('.window') || el.closest('.win-body') || el.closest('.win-header')) {
                return;
            }
            // ❌ テキストラベルも除外
            if (el.classList.contains('icon-label')) {
                return;
            }
            if (!el.classList.contains('fluid-glow-target')) {
                el.classList.add('fluid-glow-target');
            }
        }
    });

    // ★ 3. rgba で半透明な背景を持つ要素（ただしテキスト含むものは除外）
    allElements.forEach(el => {
        // ❌ テキストノードを含む要素はスキップ（文字が対象になるのを防ぐ）
        const hasText = Array.from(el.childNodes).some(n => n.nodeType === 3 && n.textContent.trim().length > 0);
        if (hasText) return;

        // ❌ アプリウィンドウ関連は除外
        if (el.closest('.window') || el.closest('.win-body') || el.closest('.win-header')) {
            return;
        }

        const style = window.getComputedStyle(el);
        const bg = style.backgroundColor;
        if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
            const match = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (match) {
                const alpha = match[4] ? parseFloat(match[4]) : 1;
                // 適度に透明なものだけ（0.03〜0.7）
                if (alpha >= 0.03 && alpha <= 0.7) {
                    if (!el.classList.contains('fluid-glow-target')) {
                        el.classList.add('fluid-glow-target');
                    }
                }
            }
        }
    });
}

// MutationObserver で動的に追加される要素にも適用
_startFluidGlowObserver() {
    if (this._fgObserver) this._fgObserver.disconnect();
    this._fgObserver = new MutationObserver((mutations) => {
        let needsUpdate = false;
        for (const mutation of mutations) {
            if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
                needsUpdate = true;
                break;
            }
            if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                needsUpdate = true;
                break;
            }
        }
        if (needsUpdate && this.config.fluidGlowLevel !== 'off') {
            // パフォーマンス対策：少し遅延させてから適用（描画完了後）
            clearTimeout(this._fgTimer);
            this._fgTimer = setTimeout(() => {
                this._applyFluidGlowToExistingElements();
            }, 50);
        }
    });

    // 監視範囲を広げる（属性変更も監視）
    this._fgObserver.observe(document.getElementById('device'), {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style', 'class']
    });
}

applyTheme() {
    const isDark = this.config.theme === 'dark';
    document.documentElement.setAttribute('data-theme', this.config.theme || 'light');

    document.documentElement.style.setProperty('--win-bg', isDark ? '#1a1a1a' : '#fdfdfd');
    document.documentElement.style.setProperty('--text-dark', isDark ? '#ffffff' : '#000000');

    const accentColor = this.config.accentColor || '#ff3e3e';
    document.documentElement.style.setProperty('--accent', accentColor);

    // ★ テーマ固定ではなく、画面の状態で決める
    this._updateStatusBarColor();

    this.updateQuickPanel();

}

/* ★ 追加：ステータスバーの文字色を画面の状態に応じて自動調整 */
_updateStatusBarColor() {
    const statusBar = document.getElementById('status-bar');
    if (!statusBar) return;

    let tone;
    if (this.activeAppId) {
        // アプリ起動中はアプリのヘッダー色（＝テーマ色）に合わせる
        tone = this.config.theme === 'dark' ? 'dark' : 'light';
    } else {
        // ホーム画面では壁紙の明度に合わせる
        tone = document.documentElement.dataset.wallpaperTone || 'dark';
    }

    statusBar.style.transition = 'color 0.25s ease';
    statusBar.style.setProperty(
        'color',
        tone === 'light' ? '#000000' : '#ffffff',
        'important'
    );
}

updateStatusBarAutoColor() {
    const statusBar = document.getElementById('status-bar');
    if (!statusBar) return;
    
    // 背景色を取得（ステータスバーの背景は透明なので、その背後の色を擬似的に）
    const device = document.getElementById('device');
    const bgColor = window.getComputedStyle(device).backgroundColor;
    const rgb = bgColor.match(/\d+/g);
    if (rgb) {
        const brightness = (parseInt(rgb[0]) * 0.299 + parseInt(rgb[1]) * 0.587 + parseInt(rgb[2]) * 0.114);
        statusBar.style.transition = 'color 0.3s ease';
        statusBar.style.color = brightness > 128 ? '#000000' : '#ffffff';
    }
}

    async saveConfig(opts = {}) {

/**
 * 【A】設定及び管理データのみを初期化
 *  - system/config.json
 *  - system/notification.json
 *  - system/cmdplus.json
 *  - system/trash_meta.json
 *  ※ ユーザーファイル（写真・動画・アプリ等）は保持
 */
async resetSettingsOnly() {
    const confirm = await this.showDialog(
        '[警告] 設定及び管理データのみを初期化',
        '以下のデータを削除します：\n' +
        '・システム設定 (config.json)\n' +
        '・通知履歴\n' +
        '・CMD拡張コマンド\n' +
        '・ゴミ箱メタデータ\n\n' +
        'ユーザーファイル（写真・動画・アプリ等）は保持されます。\n' +
        'よろしいですか？',
        [
            { label: '初期化する', value: 'ok' },
            { label: 'キャンセル', value: 'cancel' }
        ]
    );
    if (confirm !== 'ok') return;

    const progress = this._showProgressOverlay(
        '設定初期化',
        '準備中...',
        '0%',
        false
    );

    const targets = [
        'config.json',
        'notification.json',
        'cmdplus.json',
        'trash_meta.json'
    ];
    const total = targets.length;
    let done = 0;

    try {
        const sys = await this.root.getDirectoryHandle('system');

        for (const name of targets) {
            this._updateProgressOverlay(
                progress,
                `削除中 (${done + 1}/${total})`,
                `${Math.round(((done + 1) / total) * 100)}%`,
                name
            );
            try {
                await sys.removeEntry(name);
            } catch (e) {
                // 存在しないファイルは無視
                console.warn(`[reset] ${name} は存在しません`, e);
            }
            done++;
            // ゆっくり1つずつ
            await new Promise(r => setTimeout(r, 180));
        }

        // ★ FSA API のアクセス場所・権限も削除（root ハンドルを消す）
        this._updateProgressOverlay(progress, 'アクセス権限を削除中...', '95%', 'IndexedDB: root');
        await this._clearRootHandle();
        await new Promise(r => setTimeout(r, 200));

        this._updateProgressOverlay(progress, '完了！再読み込みします...', '100%', '');
        await new Promise(r => setTimeout(r, 700));
        this._hideProgressOverlay(progress);

        location.reload();

    } catch (e) {
        this._hideProgressOverlay(progress);
        this.showOSPopup('初期化エラー', e.message || '設定の初期化に失敗しました。');
        console.error('[resetSettingsOnly]', e);
    }
}

/**
 * 【B】ユーザーデータを含めて初期化
 *  - this.root 以下のすべてのファイル・フォルダを削除
 *  - ただし「ルート直下の .html ファイル」は削除しない（OS本体を保護）
 *  - 1ファイルずつゆっくり削除してエラーを防止
 *  - 完了後、自動リロード
 */
async resetAllUserData() {
    // ---- 1段階目の確認 ----
    const confirm = await this.showDialog(
        '[重大警告] ユーザーデータを含めて初期化',
        'すべてのユーザーデータを削除します：\n' +
        '・写真・動画・音楽・ドキュメント\n' +
        '・インストール済みアプリ\n' +
        '・すべての設定と管理データ\n\n' +
        'ルート直下の .html ファイル（OS本体）は保持されます。\n' +
        'この操作は元に戻せません。',
        [
            { label: 'すべて削除する', value: 'ok', style: { background: '#d32f2f' } },
            { label: 'キャンセル', value: 'cancel' }
        ]
    );
    if (confirm !== 'ok') return;

    // ---- 2段階目の最終確認 ----
    const confirm2 = await this.showDialog(
        '[最終確認]',
        '本当によろしいですか？\n' +
        '削除したデータは復元できません。\n\n' +
        '※ バックアップを取っていない場合は、一度キャンセルして\n' +
        '「一般 → バックアップを作成」を実行することをおすすめします。',
        [
            { label: 'はい、実行する', value: 'ok', style: { background: '#d32f2f' } },
            { label: 'キャンセル', value: 'cancel' }
        ]
    );
    if (confirm2 !== 'ok') return;

    const progress = this._showProgressOverlay(
        'ユーザーデータ初期化',
        'ファイル一覧を取得中...',
        '0%',
        false
    );

    try {
        // ---- 1. ルート直下の .html 以外のすべてのエントリを収集 ----
        const allFiles = [];  // { path:[...], name, kind:'file' }
        const allDirs  = [];  // { path:[...], name, kind:'directory' }

        const collect = async (dirHandle, currentPath = []) => {
            for await (const entry of dirHandle.values()) {
                // ルート直下の .html ファイルは保持
                if (currentPath.length === 0 &&
                    entry.kind === 'file' &&
                    entry.name.toLowerCase().endsWith('.html')) {
                    continue;
                }

                if (entry.kind === 'file') {
                    allFiles.push({ path: [...currentPath], name: entry.name });
                } else {
                    allDirs.push({ path: [...currentPath], name: entry.name });
                    await collect(
                        await dirHandle.getDirectoryHandle(entry.name),
                        [...currentPath, entry.name]
                    );
                }
            }
        };
        await collect(this.root);

        // 深い階層から削除するため、パス長で降順ソート
        allDirs.sort((a, b) => b.path.length - a.path.length);

        const total = allFiles.length + allDirs.length;

        if (total === 0) {
            this._updateProgressOverlay(progress, '削除対象はありません', '100%', '');
            await new Promise(r => setTimeout(r, 700));
            this._hideProgressOverlay(progress);
            location.reload();
            return;
        }

        let done = 0;

        // ---- 2. ファイルを1つずつ削除 ----
        for (const f of allFiles) {
            done++;
            const displayPath = (f.path.length ? f.path.join('/') + '/' : '') + f.name;
            this._updateProgressOverlay(
                progress,
                `削除中 (${done}/${total})`,
                `${Math.round((done / total) * 100)}%`,
                displayPath
            );
            try {
                let dir = this.root;
                for (const p of f.path) dir = await dir.getDirectoryHandle(p);
                await dir.removeEntry(f.name);
            } catch (e) {
                console.warn('[resetAll] ファイル削除失敗:', displayPath, e);
            }
            // エラー防止のため少し待つ
            await new Promise(r => setTimeout(r, 40));
        }

        // ---- 3. ディレクトリを深い階層から1つずつ削除 ----
        for (const d of allDirs) {
            done++;
            const displayPath = (d.path.length ? d.path.join('/') + '/' : '') + d.name;
            this._updateProgressOverlay(
                progress,
                `削除中 (${done}/${total})`,
                `${Math.round((done / total) * 100)}%`,
                displayPath
            );
            try {
                let dir = this.root;
                for (const p of d.path) dir = await dir.getDirectoryHandle(p);
                // 念のため recursive:true（空のはずだが安全のため）
                await dir.removeEntry(d.name, { recursive: true });
            } catch (e) {
                console.warn('[resetAll] ディレクトリ削除失敗:', displayPath, e);
            }
            await new Promise(r => setTimeout(r, 40));
        }

        // ---- 4. 完了 ----
               // ---- 4. FSA API のアクセス場所・権限も削除 ----
        this._updateProgressOverlay(
            progress,
            'アクセス権限を削除中...',
            '95%',
            'IndexedDB: root'
        );
        await this._clearRootHandle();
        await new Promise(r => setTimeout(r, 200));

        // ---- 5. 完了 ----
        this._updateProgressOverlay(
            progress,
            '完了！再読み込みします...',
            '100%',
            ''
        );
        await new Promise(r => setTimeout(r, 900));
        this._hideProgressOverlay(progress);

        // リロード（boot() から再スタート、フォルダ選択 → 設定ウィザード）
        location.reload();

    } catch (e) {
        this._hideProgressOverlay(progress);
        this.showOSPopup('初期化エラー', e.message || 'データの初期化に失敗しました。');
        console.error('[resetAllUserData]', e);
    }
}
/**
 * IndexedDB から root ハンドルを削除する
 * → 次回起動時に showDirectoryPicker からやり直しになる
 *   （＝ アクセス場所と権限がリセットされる）
 */
async _clearRootHandle() {
    return new Promise((resolve) => {
        try {
            const req = indexedDB.open(this.dbName, 1);
            req.onupgradeneeded = () => {
                if (!req.result.objectStoreNames.contains("state")) {
                    req.result.createObjectStore("state");
                }
            };
            req.onsuccess = () => {
                const db = req.result;
                try {
                    const tx = db.transaction("state", "readwrite");
                    tx.objectStore("state").delete("root");
                    tx.oncomplete = () => { db.close(); resolve(true); };
                    tx.onerror    = () => { db.close(); resolve(false); };
                    tx.onabort    = () => { db.close(); resolve(false); };
                } catch (e) {
                    db.close();
                    resolve(false);
                }
            };
            req.onerror = () => resolve(false);
        } catch (e) {
            resolve(false);
        }
    });
}

_startWallpaperZoom(originX, originY) {
    const device = document.getElementById('device');
    const desk   = document.getElementById('desktop');
    const wpC    = document.getElementById('wallpaper-container');
    if (!device) return;

    if (originX !== undefined && originY !== undefined) {
        const w = device.clientWidth  || 375;
        const h = device.clientHeight || 812;
        device.style.setProperty('--zoom-ox', (originX / w * 100) + '%');
        device.style.setProperty('--zoom-oy', (originY / h * 100) + '%');
    } else {
        device.style.setProperty('--zoom-ox', '50%');
        device.style.setProperty('--zoom-oy', '50%');
    }

    device.classList.add('wallpaper-zooming');

    if (wpC)  wpC.classList.add('wallpaper-zooming');

_getLaunchOrigin(id, event) {
    const layer = document.getElementById('window-layer');
    const layerRect = layer.getBoundingClientRect();

    // ★ ドックが非表示かどうかを判定
    const dockEl = document.getElementById('dock');
    const isDockHidden = !dockEl || dockEl.classList.contains('hidden');

    // ★ クリック元が「ドック」か「デスクトップ」かを判定
    let preferred = null;
    const t = event?.target;
    if (t && typeof t.closest === 'function') {
        if (!isDockHidden && (t.closest('#dock') || t.closest('.dock-item'))) {
            preferred = 'dock';
        } else if (t.closest('#desktop') || t.closest('.app-icon')) {
            preferred = 'desktop';
        }
    }

    const getDesktopOrigin = () => {
        const iconEl = document.getElementById('icon-' + id);
        if (!iconEl) return null;
        const box = iconEl.querySelector('.icon-box') || iconEl;
        const r = box.getBoundingClientRect();
        return {
            x: r.left - layerRect.left + r.width  / 2,
            y: r.top  - layerRect.top  + r.height / 2,
        };
    };

const getDockOrigin = () => {
    if (isDockHidden) return null;
    return this._getDockIconCenter(id);       // ★ ヘルパーに委譲
};

    // ★ 優先順位：クリック元 > 他方（ただしドック非表示時はスキップ）
    if (preferred === 'dock') {
        const o = getDockOrigin();
        if (o) return o;
    }
    if (preferred === 'desktop') {
        const o = getDesktopOrigin();
        if (o) return o;
    }

    // フォールバック：ドック（表示時のみ）→ デスクトップの順
    const o = getDockOrigin() || getDesktopOrigin();
    if (o) return o;

    // タッチ位置（アイコンが無い場合の保険）
    if (event) {
        let cx, cy;
        if (event.touches) { cx = event.touches[0].clientX; cy = event.touches[0].clientY; }
        else { cx = event.clientX; cy = event.clientY; }
        return { x: cx - layerRect.left, y: cy - layerRect.top };
    }

    // ★ 最終フォールバック：最後にアクティブだったウィンドウの中心
    const lastWin = document.querySelector('.window.active');
    if (lastWin) {
        const r = lastWin.getBoundingClientRect();
        return {
            x: r.left - layerRect.left + r.width  / 2,
            y: r.top  - layerRect.top  + r.height / 2,
        };
    }

    // 最終フォールバック: 画面中央
    return { x: layerRect.width / 2, y: layerRect.height / 2 };
}

async _generateThumbnail(id) {

    ctx.fillStyle = this.config.theme === 'dark' ? '#333' : '#eee';
    ctx.fillRect(0, 0, 480, 120);
    ctx.fillStyle = this.config.theme === 'dark' ? '#fff' : '#000';
    ctx.font = 'bold 30px sans-serif';
    ctx.fillText(this.apps[id].name, 30, 80);
    ctx.fillStyle = this.config.theme === 'dark' ? '#222' : '#f0f0f0';
    ctx.fillRect(20, 140, 440, 680);
    const icon = this.apps[id].icon;
    if (icon.length > 2) {
        try {
            const img = new Image();
            img.src = icon;
            await new Promise(r => img.onload = r);
            ctx.drawImage(img, 140, 300, 200, 200);
        } catch(e){}
    } else {
        ctx.font = '100px sans-serif';
        ctx.textAlign = 'center';

    *   3. 未応答 or BACK_NOT_HANDLED なら goHome()

   async _triggerBackOrHome() {

   /**
    * ★ アクティブアプリに「戻る」信号を送る
    * @returns {Promise<boolean>} アプリが戻るを処理したか
    */
   sendBackToApp() {
       const id = this.activeAppId;
       if (!id) return Promise.resolve(false);

       const app = this.apps[id];
       if (!app) return Promise.resolve(false);

       // ★ システムアプリは内部ハンドラで処理（ifrmae ではない）
       if (app.type === 'sys') {
           return Promise.resolve(this._handleSysBack(id));
       }

       // ★ 外部アプリはメッセージで問い合わせ（150ms タイムアウト）
       return new Promise((resolve) => {
           const frame = document.getElementById('iframe-' + id);
           if (!frame || !frame.contentWindow) { resolve(false); return; }

           let resolved = false;
           const finish = (result) => {
               if (resolved) return;
               resolved = true;
               window.removeEventListener('message', handler);
               clearTimeout(timer);
               resolve(result);
           };

           const handler = (e) => {
               if (e.source !== frame.contentWindow) return;
               if (!e.data) return;
               if (e.data.type === 'BACK_HANDLED') {
                   finish(true);
               } else if (e.data.type === 'BACK_NOT_HANDLED') {
                   finish(false);
               }
           };

           window.addEventListener('message', handler);

           // アプリへ戻る信号を送信
           try {
               frame.contentWindow.postMessage({ type: 'BACK_PRESSED', source: 'kernel' }, '*');
           } catch (_) { finish(false); return; }

           // 150ms 以内に応答がなければ「未処理」扱い
           const timer = setTimeout(() => finish(false), 150);
       });

    * @returns {boolean} 処理したか（true なら goHome しない）

   _handleSysBack(id) {
       // ── ファイルマネージャ ──
       if (id === 'sys.files') {
           // ブラウザ表示でディレクトリに潜っている → 1つ上へ
           if (this.fmViewMode === 'browser' && this.fmPath.length > 0) {
               this.fmUp();
               return true;
           }
           // カテゴリ / 検索 → ファイルホームへ
           if (this.fmViewMode === 'category' || this.fmViewMode === 'search') {
               this.gofilehome();
               return true;
           }
           // ブラウザ(root) → ホームへ
           if (this.fmViewMode === 'browser' && this.fmPath.length === 0) {
               this.gofilehome();
               return true;
           }
           // ファイルホーム → 未処理（アプリ終了してホームへ）
           return false;
       }

       // ── 設定アプリ ──
       if (id === 'sys.settings') {
           // main 以外のカテゴリを開いている → main へ戻す
           if (this._settingsCategory && this._settingsCategory !== 'main') {
               this.switchSettingsCategory('main');
               return true;
           }
           return false;
       }

       // ── YouTube ──
       if (id === 'sys.youtube') {
           // プレイヤーが開いていたら閉じる
           const player = document.getElementById('yt-player-overlay');
           if (player && player.style.display === 'flex') {
               this._closeYoutubePlayer();
               return true;
           }
           // 設定オーバーレイが開いていたら閉じる
           const settings = document.getElementById('yt-settings-overlay');
           if (settings && settings.style.display === 'flex') {
               this._closeYoutubeSettings();
               return true;
           }
           // ホームタブ以外にいたらホームタブへ
           const homeTab = document.getElementById('yt-tab-home');
           if (homeTab && homeTab.style.display === 'none') {
               const homeBtn = document.querySelector('.yt-tab-btn[data-tab="home"]');
               if (homeBtn) homeBtn.click();
               return true;
           }
           return false;
       }

       // ── CMDプロンプト（戻る非対応 → ホームへ）──
       if (id === 'sys.cmd') return false;

       // ── 通知センター、アプリストア 等（戻る非対応）──
       return false;
   }

/**
 * アイコン位置に応じて rotateX / rotateY を計算し、
 * --win-rotate-x / --win-rotate-y にセットする
 *
 * @param {HTMLElement} win
 * @param {number} originX  window-layer 座標系でのアイコン中心X
 */
_setTrapezoidRotate(win, originX) {
    if (!win) return;
    const layer = document.getElementById('window-layer');
    if (!layer) return;

    const w = layer.clientWidth || 375;
    const centerX = w / 2;
    const relativeX = (originX - centerX) / (w / 2);   // -1 〜 +1

    // ------------------------------------------------------------
    // ① 台形変形：上辺を短く、下辺を長くする
    //    rotateX で上端を奥に倒す → perspective で上辺が縮む
    //    効きが弱い: 10 / 標準: 16 / 強い: 25
    //    ※ 逆に効く（上辺が広がる）環境では -16 にする
    // ------------------------------------------------------------
    const rotateX = 16;

    // ------------------------------------------------------------
    // ② 左右の傾き：アイコンが左なら左へ、右なら右へ倒す
    //    最大 ±15deg（標準）
    //    効きが弱い: 8 / 標準: 15 / 強い: 25
    // ------------------------------------------------------------
    const rotateY = relativeX * 8;

    win.style.setProperty('--win-rotate-x', `${rotateX}deg`);
    win.style.setProperty('--win-rotate-y', `${rotateY}deg`);
}

// ★ 閉じる専用メソッド（アニメーション付き）
closeAppDrawer() {
    const popup = document.querySelector('.system-popup');
    if (!popup) return;

    // ★ ① active が付いていなければ、まず active を付与（表示状態にする）
    if (!popup.classList.contains('active')) {
        popup.classList.add('active');
        // 強制リフローしてから改めて閉じる処理を呼ぶ
        void popup.offsetHeight;
        // 次のフレームで閉じる（再帰呼び出し）
        requestAnimationFrame(() => {
            this.closeAppDrawer();
        });
        return;
    }

    // ★ ② active が付いている状態で closing を追加（逆再生）
    popup.classList.add('closing');

    // ★ ③ 次のフレームで active を削除（closing が優先）
    requestAnimationFrame(() => {
        popup.classList.remove('active');
    });

    // ★ ④ アニメーション完了後に要素を削除
    setTimeout(() => {
        if (popup.parentNode) {
            popup.remove();
            this._appDrawerVisible = false;
        }
        popup.classList.remove('closing');
    }, 350);
}

    }
}
