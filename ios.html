        senderId   // ★ 追加
    );
    this.reboot();
    break;
            }
        }
    }

    showOSPopup(title, message, appId = null) {
    this.saveNotificationRecord(title, message, appId);
    const container = document.getElementById('system-popup-layer');
    const popup = document.createElement('div');
    popup.className = 'system-popup';
    popup.innerHTML = `<strong>${title}</strong><span>${message}</span>`;
    container.appendChild(popup);
// ★ 通知にも翻訳を適用
requestAnimationFrame(() => this.applyTranslations());
void popup.offsetHeight;
    popup.classList.add('active');

    // ★ ユニークなIDを生成（各ポップアップ個別管理）
    const popupId = 'popup_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    popup.dataset.popupId = popupId;

    // 既存のポップアップタイマーはクリアしない（各ポップアップ独立）

    // 自動消滅タイマー（個別）
    const autoTimer = setTimeout(() => {
        if (popup.parentNode) {
            popup.style.transition = "0.4s opacity";
            popup.style.opacity = "0";
            setTimeout(() => {
                if (popup.parentNode) {
                    if (popup._cleanup) popup._cleanup();
                    popup.remove();
                }
            }, 400);
        }
    }, 3000);
    
    // タイマーIDを保存（クリーンアップ用）
    popup._autoTimer = autoTimer;

    // --- スワイプ処理 ---
    let startX = 0, currentX = 0, isDragging = false;

    const onStart = (e) => {
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        startX = clientX;
        currentX = startX;
        isDragging = true;
        popup.style.transition = 'none';
        clearTimeout(popup._autoTimer);
    };

    const onMove = (e) => {
        if (!isDragging) return;
        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        currentX = clientX;
        const diff = currentX - startX;
        const clamped = Math.max(-150, Math.min(150, diff));
        popup.style.transform = `translateX(${clamped}px)`;
        popup.style.opacity = 1 - Math.abs(clamped) / 150;
        if (e.type === 'mousemove' || e.type === 'touchmove') {
            e.preventDefault();
        }
    };

    const onEnd = (e) => {
        if (!isDragging) return;
        isDragging = false;
        const clientX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
        const diff = clientX - startX;
        const threshold = 80;
        if (Math.abs(diff) > threshold) {
            const direction = diff > 0 ? 1 : -1;
            popup.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
            popup.style.transform = `translateX(${direction * 200}px)`;
            popup.style.opacity = '0';
            clearTimeout(popup._autoTimer);
            setTimeout(() => {
                if (popup.parentNode) {
                    if (popup._cleanup) popup._cleanup();
                    popup.remove();
                }
            }, 350);
        } else {
            popup.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
            popup.style.transform = 'translateX(0px)';
            popup.style.opacity = '1';
            popup._autoTimer = setTimeout(() => {
                if (popup.parentNode) {
                    popup.style.transition = "0.4s opacity";
                    popup.style.opacity = "0";
                    setTimeout(() => {
                        if (popup.parentNode) {
                            if (popup._cleanup) popup._cleanup();
                            popup.remove();
                        }
                    }, 400);
                }
            }, 3000);
        }
    };

    popup.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    popup.addEventListener('touchstart', onStart, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd, { passive: true });

    popup._cleanup = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onEnd);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onEnd);
        clearTimeout(popup._autoTimer);
    };
}

    // --- ブルースクリーン (BSoD) 実行メソッド ---
    async triggerBSOD(errorCode, file) {
        // 1. 全プロセスの強制終了
        this.runningApps.forEach(id => {
            const win = document.getElementById('win-' + id);
            if(win) win.remove();
            localStorage.removeItem(`paaos_thumb_${id}`);
        });
        this.runningApps = [];
        this.activeAppId = null;

        // 2. ログ記録 (system/errorlog.json に追記)
        try {
            const errorEntry = {
                timestamp: new Date().toISOString(),
                errorCode: errorCode,
                involvedFile: file
            };
            const sysDir = await this.root.getDirectoryHandle('system');
            const logHandle = await sysDir.getFileHandle('errorlog.json', { create: true });
            const logFile = await logHandle.getFile();
            const currentContent = await logFile.text();
            
            let logs = [];
            if (currentContent) {
                try { logs = JSON.parse(currentContent); } catch(e) { logs = []; }
            }
            logs.push(errorEntry);
            
            const writable = await logHandle.createWritable();
            await writable.write(JSON.stringify(logs, null, 2));
            await writable.close();
        } catch(e) { console.error("Error logging failed", e); }

        // 3. BSOD表示
        const screen = document.getElementById('bsod-screen');
        document.getElementById('bsod-error-code').innerText = `エラーコード: [${errorCode}]`;
        document.getElementById('bsod-involved-file').innerText = `関与したファイル: [${file}]`;
        screen.style.display = 'flex';

        // 4. タイマー処理 (10秒後にリカバリーモードへ移行)
        let timeLeft = 10;
        const timerText = document.getElementById('bsod-timer');
        const interval = setInterval(() => {
            timeLeft--;
            timerText.innerText = `${timeLeft}秒後にリカバリーモードを開始します...`;
            if (timeLeft <= 0) {
                clearInterval(interval);
                // リロードではなく、直接リカバリーモード関数を呼び出す
                this.launchRecovery();
            }
        }, 1000);
    }

_toolshubJsonp(action, params = {}) {
    return new Promise((resolve) => {
        const url = this.APPS_HUB_GAS_URL;
        if (!url || url.includes('XXXXXXXXXXXX')) {
            resolve({ ok: false, error: 'url_not_set' });
            return;
        }

        const cbName = 'paaos_jsonp_' + Date.now() + '_' + Math.floor(Math.random()*1e5);
        const script = document.createElement('script');
        const qs = new URLSearchParams(Object.assign({ action }, params));
        qs.set('callback', cbName);
        script.src = url + (url.includes('?') ? '&' : '?') + qs.toString();

        let timer = setTimeout(() => {
            if (window[cbName]) {
                delete window[cbName];
                script.remove();
                resolve({ ok: false, error: 'timeout' });
            }
        }, 12000);

        window[cbName] = (data) => {
            clearTimeout(timer);
            delete window[cbName];
            script.remove();
            resolve(data);
        };
        script.onerror = () => {
            clearTimeout(timer);
            delete window[cbName];
            resolve({ ok: false, error: 'network' });
        };
        document.head.appendChild(script);
    });
}

        body.innerHTML = `
            <div style="padding:24px; text-align:center;">
                <div style="font-size:48px; margin-bottom:12px;">⚠️</div>
                <h3 style="margin:0 0 8px;">GAS URL 未設定</h3>

        `;

    }

    body.innerHTML = `<div style="padding:40px; text-align:center; opacity:0.7;">読み込み中...</div>`;

    const tools = res.tools || [];

        <div style="padding:15px; display:flex; flex-direction:column; gap:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">

        html += `<div style="text-align:center; padding:40px; opacity:0.5;">

        </div>`;
    } else {

            html += `

/* --- ツールを開く --- */
async _launchTool(toolId) {
    // ローディング表示
    this.showOSPopup('Tools Hub', 'ツールを読み込み中...');

    const res = await this._toolshubJsonp('get', { id: toolId });
    if (!res || !res.ok || !res.tool) {
        await this.showDialog('Tools Hub', 'ツールの取得に失敗しました', [{ label: 'OK', value: 'ok' }]);
        return;
    }

    const tool = res.tool;
    const appId = 'tool.' + tool.id;

    // 仮想アプリとして登録
    this.apps[appId] = {
        name: tool.name || tool.id,
        icon: tool.icon || '🕹️',
        type: 'app',
        content: this._injectAppPolyfills(tool.html || '<!DOCTYPE html><html><body>empty</body></html>', appId),
        _isTool: true,
        _toolId: tool.id
    };

    // 起動
    this.launch(appId, null);

    // アプリ名を一時的に置き換える為のフラグを立てる
    // （実際の win-header は launch で app.name を参照しているので自動でツール名になる）
}

/* --- 戻るボタン --- */
async _toolBack(appId) {
    const app = this.apps[appId];
    if (!app) return;

    const r = await this.showDialog(
        app.name || 'Tools Hub',
        'Tools Hub のホームに戻りますか？\n（開いていたツールは終了します）',
        [
            { label: 'ホームに戻る', value: 'back' },
            { label: 'キャンセル',   value: 'cancel' }
        ]
    );

    if (r !== 'back') return;

    // ========================================================
    // 1) ツールを完全に kill
    //    - runningApps から即除外（スイッチャーに残らない）
    //    - this.apps から即削除（メモリ解放）
    //    - ウィンドウは退場アニメ → 500ms 後に DOM 削除
    // ========================================================
    const win = document.getElementById('win-' + appId);

    // アクティブ状態を解除
    if (this.activeAppId === appId) {
        this.activeAppId = null;
    }

    // スイッチャー用タイマーがあれば止める（念のため）
    this._clearTimer('killApp_' + appId);

    if (win) {
        // RAF を無効化（遅延起動をキャンセル）
        win._launchToken = null;

        // 退場アニメ開始
        win.classList.remove('active');
        win.classList.add('minimized');
        win.style.pointerEvents = 'none';

        // アニメ完了後に DOM から完全削除
        setTimeout(() => {
            if (win.parentNode) win.remove();
        }, 500);
    }

    // 仮想アプリの登録情報を即時クリーンアップ
    // （this.apps / runningApps / _launchOrigins をまとめて消す）
    this._cleanupToolApp(appId);

    // ステータスバーの色を更新
    this._updateStatusBarColor();

    // ========================================================
    // 2) 退場アニメが終わったくらいに Tools Hub を前面に
    // ========================================================
    setTimeout(() => {
        if (this.runningApps.includes('sys.toolshub')) {
            // Tools Hub が既に起動中 → ウィンドウを再利用して前面に
            const hubWin = document.getElementById('win-sys.toolshub');
            if (hubWin) {
                hubWin.style.visibility = '';
                delete hubWin.dataset.prevVisibility;
                hubWin.style.pointerEvents = 'auto';
                hubWin.classList.remove('minimized');
                hubWin.classList.add('active');

                this.activeAppId = 'sys.toolshub';
                this._updateStatusBarColor();

                // 内容を最新に再描画（ツールを消した後の一覧）
                if (this.apps['sys.toolshub']?.type === 'sys') {
                    this.renderSysApp('sys.toolshub');
                }
            } else {
                // ウィンドウが無ければ通常起動にフォールバック
                this.launch('sys.toolshub');
            }
        } else {
            // 未起動 → 通常起動
            this.launch('sys.toolshub');
        }
    }, 520);
}

/* --- ツール用：仮想アプリのクリーンアップ --- */
_cleanupToolApp(appId) {
    if (!appId || !appId.startsWith('tool.')) return;
    delete this.apps[appId];
    if (this._launchOrigins) delete this._launchOrigins[appId];
    if (this.runningApps) this.runningApps = this.runningApps.filter(x => x !== appId);
}

async _demoLoadConfig() {

        const fileHandle = await demoDir.getFileHandle('democonfig.json', { create: true });

/* ---- 初期化・破棄 ---- */
_demoInit() {
    this._demoTeardown();
    // ★ 状態に応じて sys.demo を登録
    this._syncDemoApp();
    if (!this.demoConfig.enabled) return;

    // バッジ
    this._demoUpdateBadge();
    

    // 編集モード強制解除
    if (this.demoConfig.lockEditing && this.isEditMode) {
        this.isEditMode = false;
        const btn = document.getElementById('edit-trigger');
        if (btn) { btn.innerText = '編集'; btn.style.background = 'rgba(255,255,255,0.2)'; }
        document.getElementById('desktop')?.classList.remove('edit-mode');
    }

    // アイドル監視
    this._demoStartIdleTimer();

    // アクティビティリスナー
    this._demoBindActivityListeners();

    // 時計長押し（脱出ハッチ）
    this._demoBindClockLongPress();
}

_demoTeardown() {
    this._demoClearIdleTimer();
    if (this._demoState.idleCountdownTimer) {
        clearTimeout(this._demoState.idleCountdownTimer);
        this._demoState.idleCountdownTimer = null;
    }
    document.getElementById('demo-countdown')?.remove();
    this._demoHideVideo(true);

    if (this._demoState.activityListeners) {
        try { this._demoState.activityListeners(); } catch (_) {}
        this._demoState.activityListeners = null;
    }

    const left = document.getElementById('status-left');
    if (left && left._demoCleanup) {
        try { left._demoCleanup(); } catch (_) {}
        left._demoCleanup = null;
        left._demoBound = false;
    }
    document.getElementById('demo-badge')?.remove();
    this._demoState.badgeEl = null;
    this._demoState.sessionUnlockedUntil = 0;
    this._demoState.unlockedApps.clear();
    // ★ デモがオフなら sys.demo を削除
    this._syncDemoApp();
}

/* ---- バッジ ---- */
_demoUpdateBadge() {
    const right = document.getElementById('status-right');
    if (!right) return;
    let badge = document.getElementById('demo-badge');
    const shouldShow = this.demoConfig.enabled && this.demoConfig.showBadge;

    if (shouldShow && !badge) {
        badge = document.createElement('span');
        badge.id = 'demo-badge';
        right.insertBefore(badge, right.firstChild);
        this._demoState.badgeEl = badge;
    } else if (!shouldShow && badge) {
        badge.remove();
        this._demoState.badgeEl = null;
    }
}

/* ---- ロック判定 ---- */
_demoShouldLock(appId) {
    if (!this.demoConfig.enabled) return false;
    if (!this.demoConfig.adminPasscode) return false;     // パスコード未設定ならロックしない
    if (!this.demoConfig.lockedApps.includes(appId)) return false;

    // ★ 毎度モード：アプリ単位のロック状態で判定
    if (this.demoConfig.sessionUnlockMinutes === 0) {
        return !this._demoState.unlockedApps.has(appId);
    }

    // 時間ベースのセッションロック
    if (this._demoIsUnlocked()) return false;
    return true;
}

_demoIsUnlocked() {
    return Date.now() < this._demoState.sessionUnlockedUntil;
}

async _demoRequestUnlock(appId, callback) {   // ★ appId を追加
    if (this._demoState.appUnlockInProgress) return;
    this._demoState.appUnlockInProgress = true;
    try {
        const result = await this.showDialog(
            '🔒 ロック中',
            'このアプリを開くには管理パスコードが必要です。',
            [
                { label: 'OK', value: 'ok' },
                { label: 'キャンセル', value: 'cancel' }
            ],
            { input: { type: 'password', placeholder: 'パスコード', autoFocus: true } }
        );
        const v = (typeof result === 'object' && result !== null)
            ? result
            : { value: result, inputValue: '' };
        if (v.value !== 'ok') return;

        if (String(v.inputValue || '').trim() === this.demoConfig.adminPasscode) {
            // ★ モード別の unlock 処理
            if (this.demoConfig.sessionUnlockMinutes === 0 && appId) {
                this._demoState.unlockedApps.add(appId);   // 毎度モード
            } else {
                this._demoUnlock();                         // 時間ベース
            }
            if (callback) callback();
        } else {
            this.showOSPopup('デモモード', 'パスコードが違います。');
        }
    } finally {
        this._demoState.appUnlockInProgress = false;
    }
}

_demoUnlock() {
    const m = this.demoConfig.sessionUnlockMinutes;
    this._demoState.sessionUnlockedUntil = (m === -1)
        ? Infinity
        : Date.now() + m * 60 * 1000;
    if (navigator.vibrate) navigator.vibrate(30);
}

/* ---- アイドルタイマー ---- */
_demoStartIdleTimer() {
    this._demoClearIdleTimer();
    if (!this.demoConfig.enabled) return;
    if (this._demoState.isPlayingVideo) return;
    const sec = Math.max(5, this.demoConfig.idleSeconds | 0);
    this._demoState.idleTimer = setTimeout(() => this._demoStartCountdown(), sec * 1000);
}

_demoResetIdleTimer() {
    if (!this.demoConfig.enabled) return;
    if (this._demoState.isPlayingVideo) return;
    this._demoClearIdleTimer();
    this._demoStartIdleTimer();
}

_demoClearIdleTimer() {
    if (this._demoState.idleTimer) {
        clearTimeout(this._demoState.idleTimer);
        this._demoState.idleTimer = null;
    }
}

_demoBindActivityListeners() {
    if (this._demoState.activityListeners) return;
    const handler = () => this._demoResetIdleTimer();
    const opts = { passive: true, capture: true };
    window.addEventListener('pointerdown', handler, opts);
    window.addEventListener('touchstart', handler, opts);
    window.addEventListener('keydown', handler, opts);
    window.addEventListener('wheel', handler, opts);
    window.addEventListener('mousemove', handler, opts);
    window.addEventListener('scroll', handler, opts);

    this._demoState.activityListeners = () => {
        window.removeEventListener('pointerdown', handler, opts);
        window.removeEventListener('touchstart', handler, opts);
        window.removeEventListener('keydown', handler, opts);
        window.removeEventListener('wheel', handler, opts);
        window.removeEventListener('mousemove', handler, opts);
        window.removeEventListener('scroll', handler, opts);
    };
}

/* ---- カウントダウン ---- */
_demoCanStartIdleVideo() {
    if (!this.demoConfig.enabled) return false;
    if (this.demoConfig.videos.length === 0) return false;
    if (this._demoState.isPlayingVideo) return false;
    if (document.querySelector('.modal-dialog-overlay')) return false;

    const lock = document.getElementById('lock-screen');
    if (lock && lock.style.display !== 'none' && !lock.classList.contains('unlocked')) return false;

    const bsod = document.getElementById('bsod-screen');
    if (bsod && bsod.style.display === 'flex') return false;

    const rec = document.getElementById('recovery-screen');
    if (rec && rec.classList.contains('active')) return false;

    const reb = document.getElementById('reboot-overlay');
    if (reb && reb.style.display === 'flex') return false;

    return true;
}

_demoStartCountdown() {
    if (!this._demoCanStartIdleVideo()) return;
    this._demoClearIdleTimer();

    const cd = document.createElement('div');
    cd.id = 'demo-countdown';
    // ★ 数字なし・1秒フェードイン用にスタイルを上書き
    cd.style.transition = 'opacity 1s ease';
    document.getElementById('device').appendChild(cd);
    void cd.offsetHeight;
    cd.classList.add('active');

    // ★ 1秒のフェードイン完了後、そのまま動画再生へ
    this._demoState.idleCountdownTimer = setTimeout(() => {
        this._demoState.idleCountdownTimer = null;
        cd.remove();
        this._demoShowVideo();
    }, 1000);
}
/* ---- 動画再生 ---- */
async _demoShowVideo() {
    if (!this._demoCanStartIdleVideo()) return;

    this._demoState.isPlayingVideo = true;
    this._demoClearIdleTimer();

    const overlay = document.createElement('div');
    overlay.id = 'demo-video-overlay';

    const video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('playsinline', '');
    video.controls = false;
    video.setAttribute('controlsList', 'nodownload noplaybackrate nofullscreen noremoteplayback');
    video.disablePictureInPicture = true;
    video.style.objectFit = (this.demoConfig.videoFit === 'contain') ? 'contain' : 'cover';
    overlay.appendChild(video);

    document.getElementById('device').appendChild(overlay);
    void overlay.offsetHeight;
    overlay.classList.add('active');

    this._demoState.videoOverlayEl = overlay;
    this._demoState.videoIndex = 0;

    const closeSelf = () => this._demoHideVideo();
    overlay.addEventListener('click', closeSelf);
    overlay.addEventListener('touchstart', (e) => { e.preventDefault(); closeSelf(); }, { passive: false });

    video.addEventListener('ended', () => {
        const n = this.demoConfig.videos.length;
        if (n === 0) return;
        this._demoState.videoIndex = (this._demoState.videoIndex + 1) % n;
        this._demoPlayIndex(this._demoState.videoIndex);
    });
    video.addEventListener('error', () => {
        // 読めなければ次へスキップ
        const n = this.demoConfig.videos.length;
        if (n <= 1) { this._demoHideVideo(); return; }
        this._demoState.videoIndex = (this._demoState.videoIndex + 1) % n;
        this._demoPlayIndex(this._demoState.videoIndex);
    });

    await this._demoPlayIndex(0);
}

async _demoPlayIndex(index) {
    const overlay = this._demoState.videoOverlayEl;
    if (!overlay) return;
    const video = overlay.querySelector('video');
    if (!video) return;

    // 前回のURLを解放
    if (this._demoState.currentVideoURL) {
        try { URL.revokeObjectURL(this._demoState.currentVideoURL); } catch (_) {}
        this._demoState.currentVideoURL = null;
    }

    const name = this.demoConfig.videos[index];
    if (!name) { this._demoHideVideo(); return; }

    try {
        const sysDir = await this.root.getDirectoryHandle('system');
        const demoDir = await sysDir.getDirectoryHandle('demo');
        const fh = await demoDir.getFileHandle(name);
        const file = await fh.getFile();
        const url = URL.createObjectURL(file);
        this._demoState.currentVideoURL = url;
        video.src = url;
        video.load();
        try { await video.play(); } catch (_) { /* autoplay 失敗は無視 */ }
    } catch (e) {
        console.warn('[Demo] video load failed:', name, e);
        // 次へ
        const n = this.demoConfig.videos.length;
        if (n > 1) {
            this._demoState.videoIndex = (index + 1) % n;
            this._demoPlayIndex(this._demoState.videoIndex);
        } else {
            this._demoHideVideo();
        }
    }
}

_demoHideVideo(silent = false) {
    const overlay = this._demoState.videoOverlayEl;
    if (!overlay) {
        this._demoState.isPlayingVideo = false;
        return;
    }
    const video = overlay.querySelector('video');
    if (video) {
        try { video.pause(); } catch (_) {}
        try { video.removeAttribute('src'); video.load(); } catch (_) {}
    }
    if (this._demoState.currentVideoURL) {
        try { URL.revokeObjectURL(this._demoState.currentVideoURL); } catch (_) {}
        this._demoState.currentVideoURL = null;
    }
    overlay.classList.remove('active');
    setTimeout(() => {
        try { overlay.remove(); } catch (_) {}
    }, silent ? 0 : 500);

    this._demoState.videoOverlayEl = null;
    this._demoState.isPlayingVideo = false;

    // アイドルタイマーを再開（リセット）
    if (!silent && this.demoConfig.enabled) {
        this._demoResetIdleTimer();

        // ★ デモループ復帰後、自動的に sys.demo を開く
        if (this.demoConfig.autoOpenDemoApp && this.apps['sys.demo']) {
            setTimeout(() => {
                if (!this.demoConfig.enabled) return;
                if (!this.apps['sys.demo']) return;
                this.launch('sys.demo');
            }, 150);
        }
    }
}

/* ---- 脱出ハッチ：時計 1.5秒長押し ---- */
_demoBindClockLongPress() {
    const el = document.getElementById('status-left');
    if (!el || el._demoBound) return;
    el._demoBound = true;

    let timer = null;
    let startX = 0, startY = 0;

    const cancel = () => {
        if (timer) { clearTimeout(timer); timer = null; }
    };

    const onDown = (e) => {
        if (!this.demoConfig.enabled) return;
        const p = e.touches ? e.touches[0] : e;
        startX = p.clientX; startY = p.clientY;
        cancel();
        timer = setTimeout(() => {
            timer = null;
            if (navigator.vibrate) navigator.vibrate(20);
            this._demoShowAdminMenu();
        }, 1500);
    };
    const onMove = (e) => {
        if (!timer) return;
        const p = e.touches ? e.touches[0] : e;
        if (Math.hypot(p.clientX - startX, p.clientY - startY) > 5) cancel();
    };

    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('pointerleave', cancel);

    el._demoCleanup = () => {
        el.removeEventListener('pointerdown', onDown);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', cancel);
        el.removeEventListener('pointercancel', cancel);
        el.removeEventListener('pointerleave', cancel);
    };
}

async _demoShowAdminMenu() {
    if (!this.demoConfig.enabled) return;
    if (this._demoState.appUnlockInProgress) return;

    this._demoState.appUnlockInProgress = true;
    try {
        const result = await this.showDialog(
            '🔒 管理者メニュー',
            '管理パスコードを入力してください。',
            [
                { label: 'OK', value: 'ok' },
                { label: 'キャンセル', value: 'cancel' }
            ],
            { input: { type: 'password', placeholder: 'パスコード', autoFocus: true } }
        );

        const v = (typeof result === 'object' && result !== null)
            ? result
            : { value: result, inputValue: '' };
        if (v.value !== 'ok') return;

        if (this.demoConfig.adminPasscode &&
            String(v.inputValue || '').trim() !== this.demoConfig.adminPasscode) {
            this.showOSPopup('デモモード', 'パスコードが違います。');
            return;
        }

        this._demoUnlock();

        // ★ 毎度モードでも、管理メニュー経由で開く sys.settings はロック免除
        if (this.demoConfig.sessionUnlockMinutes === 0) {
            this._demoState.unlockedApps.add('sys.settings');
        }

        // デモ設定画面を開く
        this._settingsTransitionDirection = 'forward';
        this._settingsCategory = 'demo';
        this.launch('sys.settings');
    } finally {
        this._demoState.appUnlockInProgress = false;
    }
}

        this.demoConfig.enabled = false;
        await this._demoSaveConfig();
        this._demoTeardown();
        this.showOSPopup('デモモード', 'デモモードを終了しました。');

        this._settingsCategory = 'main';
        this.renderSysApp('sys.settings');

    }
    this.demoConfig.enabled = true;
    await this._demoSaveConfig();
    this._demoInit();

}

}

async _demoSetSessionMinutes(m) {
    this.demoConfig.sessionUnlockMinutes = m;
    await this._demoSaveConfig();
    this.renderSysApp('sys.settings');
}

async _demoSaveIdle() {
    const el = document.getElementById('demo-idle');
    if (!el) return;
    let v = parseInt(el.value, 10);
    if (isNaN(v) || v < 5) v = 5;
    this.demoConfig.idleSeconds = v;
    await this._demoSaveConfig();
    this._demoResetIdleTimer();
    this.showOSPopup('デモモード', `待機時間を ${v} 秒に設定しました。`);
}

async _demoSetFit(fit) {
    this.demoConfig.videoFit = (fit === 'contain') ? 'contain' : 'cover';
    await this._demoSaveConfig();
    this.renderSysApp('sys.settings');
}

async _demoToggleLockedApp(appId, checked) {
    const arr = this.demoConfig.lockedApps;
    if (checked && !arr.includes(appId)) arr.push(appId);
    if (!checked) this.demoConfig.lockedApps = arr.filter(x => x !== appId);
    await this._demoSaveConfig();
}

async _demoToggleOption(key, v) {
    this.demoConfig[key] = v;
    await this._demoSaveConfig();
    if (key === 'showBadge') this._demoUpdateBadge();
    if (key === 'lockEditing' && v && this.isEditMode) {
        this.isEditMode = false;
        const btn = document.getElementById('edit-trigger');
        if (btn) { btn.innerText = '編集'; btn.style.background = 'rgba(255,255,255,0.2)'; }
        document.getElementById('desktop')?.classList.remove('edit-mode');
    }
    // ★ アプリ一覧禁止をONにしたら、開いていたら閉じる
    if (key === 'lockAppDrawer' && v) {
        if (this._appDrawerVisible) this.closeAppDrawer();
    }
    // ★ autoOpenDemoApp の変更は再起動不要（次回のループから反映）
    if (key === 'autoOpenDemoApp') { /* 何もしない（設定値のみ保存） */ }
}

async _demoAddVideo() {
    try {
        const fileHandles = await window.showOpenFilePicker({
            types: [{
                description: 'Demo Videos',
                accept: { 'video/*': ['.mp4', '.webm', '.mov', '.m4v'] }
            }],
            multiple: true
        });
        const sysDir = await this.root.getDirectoryHandle('system', { create: true });
        const demoDir = await sysDir.getDirectoryHandle('demo', { create: true });
        for (const h of fileHandles) {
            const file = await h.getFile();
            const newHandle = await demoDir.getFileHandle(file.name, { create: true });
            const w = await newHandle.createWritable();
            await w.write(file);
            await w.close();
            if (!this.demoConfig.videos.includes(file.name)) {
                this.demoConfig.videos.push(file.name);
            }
        }
        await this._demoSaveConfig();
        this.renderSysApp('sys.settings');
    } catch (e) {
        if (e.name !== 'AbortError') {
            this.showOSPopup('デモモード', '動画追加失敗: ' + e.message);
        }
    }
}

async _demoAddExisting(name) {
    if (!this.demoConfig.videos.includes(name)) {
        this.demoConfig.videos.push(name);
        await this._demoSaveConfig();
    }
    this.renderSysApp('sys.settings');
}

async _demoRemoveVideo(idx) {
    const name = this.demoConfig.videos[idx];
    if (!name) return;
    const ok = await this.showDialog('動画を削除',
        `「${name}」を削除しますか？\nファイル自体も削除されます。`, [
        { label: '削除', value: 'ok' },
        { label: 'キャンセル', value: 'cancel' }
    ]);
    if (ok !== 'ok') return;
    this.demoConfig.videos.splice(idx, 1);
    await this._demoSaveConfig();
    try {
        const sysDir = await this.root.getDirectoryHandle('system');
        const demoDir = await sysDir.getDirectoryHandle('demo');
        await demoDir.removeEntry(name);
    } catch (_) {}
    this.renderSysApp('sys.settings');
}

async _demoMoveVideo(idx, dir) {
    const arr = this.demoConfig.videos;
    const ni = idx + dir;
    if (ni < 0 || ni >= arr.length) return;
    [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
    await this._demoSaveConfig();
    this.renderSysApp('sys.settings');
}

// ==================== システム情報公開API（修正版） ====================
// カーネルインスタンスが既に存在する前提で拡張する
(function extendKernel() {
    const k = kernel;
    if (!k) {
        console.error('❌ カーネルが見つかりません');
        return;
    }

    // --- 内部統計データの初期化 ---
    k.bootTime = Date.now();
    k.appLaunchCounts = new Map();       // appId -> 起動回数
    k.appTotalActiveTime = new Map();    // appId -> 累積アクティブ秒数
    k.appLastActive = new Map();         // appId -> 最終アクティブ時刻

    // 稼働時間とアクティブ時間を記録するタイマー
    setInterval(() => {
        if (k.activeAppId) {
            const current = k.appTotalActiveTime.get(k.activeAppId) || 0;
            k.appTotalActiveTime.set(k.activeAppId, current + 1);
        }
    }, 1000);

    // --- launchをフックして起動回数を記録 ---
    const __originalLaunch = k.launch;
    k.launch = function(id, event) {
        const count = this.appLaunchCounts.get(id) || 0;
        this.appLaunchCounts.set(id, count + 1);
        this.appLastActive.set(id, Date.now());
        return __originalLaunch.call(this, id, event);
    };

    // --- 情報取得用のメソッド ---
    k.getSystemStats = function() {
        let memory = null;
        if (performance.memory) {
            memory = {
                used: performance.memory.usedJSHeapSize,
                total: performance.memory.totalJSHeapSize,
                limit: performance.memory.jsHeapSizeLimit,
                percent: (performance.memory.usedJSHeapSize / performance.memory.jsHeapSizeLimit) * 100
            };
        }

        const appStats = {};
        for (const appId of Object.keys(this.apps)) {
            appStats[appId] = {
                name: this.apps[appId]?.name || appId,
                launchCount: this.appLaunchCounts.get(appId) || 0,
                totalActiveSeconds: this.appTotalActiveTime.get(appId) || 0,
                lastActive: this.appLastActive.get(appId) || null,
                isRunning: this.runningApps.includes(appId)
            };
        }

        return {
            uptime: Date.now() - this.bootTime,
            bootTime: this.bootTime,
            runningApps: this.runningApps.slice(),
            activeApp: this.activeAppId,
            totalApps: Object.keys(this.apps).length,
            isRooted: this.isRooted,
            theme: this.config?.theme || 'light',
            userName: this.config?.userName || '',
            memory: memory,
            appStats: appStats,
            version: '3.4'
        };
    };

    k.getStorageStats = async function() {
        try {
            const estimate = await navigator.storage.estimate();
            return {
                usage: estimate.usage,
                quota: estimate.quota,
                percent: (estimate.usage / estimate.quota) * 100
            };
        } catch(e) {
            return { error: 'storage_estimate_failed' };
        }
    };

    // --- handleAppMessage を拡張 ---
    const __originalHandleAppMessage = k.handleAppMessage;
    k.handleAppMessage = async function(e) {
        const data = e.data;
        const sourceWindow = e.source;

        // 新規アクション：システム統計
        if (data.action === 'GET_SYSTEM_STATS') {
            const stats = this.getSystemStats();
            sourceWindow.postMessage({
                type: 'SYSTEM_STATS_RESULT',
                stats: stats,
                requestId: data.requestId
            }, '*');
            return;
        }

        // 新規アクション：ストレージ統計
        if (data.action === 'GET_STORAGE_STATS') {
            const storageStats = await this.getStorageStats();
            sourceWindow.postMessage({
                type: 'STORAGE_STATS_RESULT',
                stats: storageStats,
                requestId: data.requestId
            }, '*');
            return;
        }

        // 新規アクション：PING
        if (data.action === 'SYSTEM_PING') {
            sourceWindow.postMessage({
                type: 'SYSTEM_PONG',
                pingId: data.pingId,
                timestamp: Date.now()
            }, '*');
            return;
        }

        // 既存のハンドラを呼び出し
        return __originalHandleAppMessage.call(this, e);
    };

    // デバッグ用
    window.paaosStats = () => {
        console.log('=== PaaOS System Stats ===');
        console.log(k.getSystemStats());
        k.getStorageStats().then(s => console.log('Storage:', s));
    };


})();


// ==================== PaaOS モジュール機構 (Glide 3.4) ====================
// 追加場所: ファイル末尾、既存の extendKernel() の後ろ
(function extendModuleSystem() {
    const k = kernel;
    if (!k) return;

    // --- モジュール保存ディレクトリの確保 ---
    k.ensureModuleDir = async function() {
        const sysDir = await this.root.getDirectoryHandle('system');
        return await sysDir.getDirectoryHandle('modules', { create: true });
    };

    // --- モジュール管理用ストレージ ---
    k.modules = new Map();           // id -> { manifest, enabled, priority, code }
    k.moduleLoadOrder = [];           // 優先度順のIDリスト

    // --- モジュール読み込み ---
    k.loadModule = async function(zipFile, options = {}) {
        const zip = await JSZip.loadAsync(zipFile);
        
        // manifest.json 読み込み
        const manifestFile = zip.file('manifest.json');
        if (!manifestFile) throw new Error('manifest.json が見つかりません');
        const manifest = JSON.parse(await manifestFile.async('text'));
        
        // module.js 読み込み
        const moduleFile = zip.file('module.js');
        if (!moduleFile) throw new Error('module.js が見つかりません');
        const code = await moduleFile.async('text');
        
        // ID生成（ファイル名から）
        const id = zipFile.name.replace(/\.modpaa$/i, '').replace(/[^a-z0-9_-]/gi, '_');
        const priority = manifest.priority || 0;
        
        // 既存のモジュールがあれば上書き
        const existing = this.modules.get(id);
        if (existing) {
            await this.unloadModule(id);
        }
        
        // モジュールを保存
        const moduleData = {
            id: id,
            manifest: manifest,
            priority: priority,
            enabled: manifest.enabled !== false,
            code: code,
            state: 'loaded'
        };
        this.modules.set(id, moduleData);
        
        // 優先度順リストを更新
        this.moduleLoadOrder = Array.from(this.modules.keys())
            .sort((a, b) => (this.modules.get(b).priority || 0) - (this.modules.get(a).priority || 0));
        
        // ファイルシステムに保存
        if (options.persist !== false) {
            const modDir = await this.ensureModuleDir();
            const fileHandle = await modDir.getFileHandle(id + '.modpaa', { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(await zipFile.arrayBuffer());
            await writable.close();
        }
        
        // 自動有効化
        if (moduleData.enabled) {
            await this.enableModule(id);
        }
        
        this.addSystemLog?.('module', `モジュール「${manifest.name || id}」v${manifest.version || '1.0'} を読み込みました。`);
        return { success: true, id: id };
    };

    // --- モジュール有効化 ---
    k.enableModule = async function(id) {
        const mod = this.modules.get(id);
        if (!mod) throw new Error(`モジュール ${id} が見つかりません`);
        if (mod.state === 'active') return;
        
        // サンドボックス環境でコードを実行
        const api = this.createModuleAPI(id);
        try {
            const func = new Function('kernel', 'api', mod.code);
            mod.exports = func(this, api) || {};
            
            // initフックがあれば呼び出し
            if (mod.exports.init && typeof mod.exports.init === 'function') {
                await mod.exports.init();
            }
            
            mod.state = 'active';
            mod.enabled = true;
            this.addSystemLog?.('module', `モジュール「${mod.manifest.name || id}」を有効化`);
            return true;
        } catch(e) {
            console.error(`モジュール ${id} の実行に失敗:`, e);
            mod.state = 'error';
            mod.error = e.message;
            this.showOSPopup?.('モジュールエラー', `${mod.manifest.name || id}: ${e.message}`);
            return false;
        }
    };

    // --- モジュール無効化 ---
    k.disableModule = async function(id) {
        const mod = this.modules.get(id);
        if (!mod) return false;
        if (mod.state !== 'active') return false;
        
        if (mod.exports && typeof mod.exports.cleanup === 'function') {
            try {
                await mod.exports.cleanup();
            } catch(e) {
                console.warn(`モジュール ${id} のcleanupに失敗:`, e);
            }
        }
        
        mod.state = 'loaded';
        mod.enabled = false;
        this.addSystemLog?.('module', `モジュール「${mod.manifest.name || id}」を無効化`);
        return true;
    };

    // --- モジュール削除 ---
    k.unloadModule = async function(id) {
        await this.disableModule(id);
        this.modules.delete(id);
        this.moduleLoadOrder = this.moduleLoadOrder.filter(i => i !== id);
        
        try {
            const modDir = await this.ensureModuleDir();
            await modDir.removeEntry(id + '.modpaa');
        } catch(e) {}
    };

    // --- モジュールAPIの作成 ---
    k.createModuleAPI = function(moduleId) {
        const self = this;
        return {
            // ログ出力
            log: (...args) => self.addSystemLog?.('module:'+moduleId, args.join(' ')),
            
            // 通知表示
            notify: (title, message) => self.showOSPopup?.(`[${moduleId}] ${title}`, message),
            
            // スタイル追加
            addStyle: (css) => {
                const style = document.createElement('style');
                style.setAttribute('data-module', moduleId);
                style.textContent = css;
                document.head.appendChild(style);
                return style;
            },
            
            // スタイル削除
            removeStyle: (styleEl) => styleEl?.remove(),

 send: (data) => {
            // 既存の data を破壊せずにコピー
            const payload = { ...data };
            payload.moduleId = moduleId;   // モジュールIDを明示
            // もし data に appId があっても moduleId で上書きしない（優先度は moduleId > appId）
            // しかし、appId は残しておいてもよい（互換性）
            window.parent.postMessage(payload, '*');
        },
            
            // モジュール固有のスタイルをすべて削除
            removeAllStyles: () => {
                document.querySelectorAll(`style[data-module="${moduleId}"]`).forEach(s => s.remove());
            },
            
            // 設定の読み書き
            getConfig: (key, defaultValue) => {
                if (!self.config.modules) self.config.modules = {};
                if (!self.config.modules[moduleId]) self.config.modules[moduleId] = {};
                return self.config.modules[moduleId][key] ?? defaultValue;
            },
            setConfig: async (key, value) => {
                if (!self.config.modules) self.config.modules = {};
                if (!self.config.modules[moduleId]) self.config.modules[moduleId] = {};
                self.config.modules[moduleId][key] = value;
                await self.saveConfig?.();
            },
            
            // 優先度取得
            getPriority: () => self.modules.get(moduleId)?.priority || 0
        };
    };

    // --- 起動時に保存済みモジュールを読み込む ---
    k.loadAllModulesFromStorage = async function() {
        try {
            const modDir = await this.ensureModuleDir();
            for await (const entry of modDir.values()) {
                if (entry.kind === 'file' && entry.name.endsWith('.modpaa')) {
                    const file = await entry.getFile();
                    try {
                        await this.loadModule(file, { persist: false });
                    } catch(e) {
                        console.warn(`モジュール ${entry.name} の読み込みに失敗:`, e);
                    }
                }
            }
        } catch(e) {
            console.warn('モジュールディレクトリの読み込みに失敗:', e);
        }
    };

    // --- モジュール一覧取得 ---
    k.getModuleList = function() {
        return this.moduleLoadOrder.map(id => {
            const mod = this.modules.get(id);
            return {
                id: id,
                name: mod.manifest.name || id,
                version: mod.manifest.version || '1.0',
                description: mod.manifest.description || '',
                enabled: mod.enabled,
                state: mod.state,
                priority: mod.priority,
                error: mod.error
            };
        });
    };

    // --- 優先度変更 ---
    k.setModulePriority = async function(id, newPriority) {
        const mod = this.modules.get(id);
        if (!mod) return false;
        
        mod.priority = newPriority;
        this.moduleLoadOrder = Array.from(this.modules.keys())
            .sort((a, b) => (this.modules.get(b).priority || 0) - (this.modules.get(a).priority || 0));
        
        // 設定に保存
        if (!this.config.modules) this.config.modules = {};
        if (!this.config.modules[id]) this.config.modules[id] = {};
        this.config.modules[id].priority = newPriority;
        await this.saveConfig?.();
        
        return true;
    };

    // --- boot() を拡張してモジュール自動読み込み ---
    const __originalBoot = k.boot;
    k.boot = async function() {
        const result = await __originalBoot.call(this);
        // ファイルシステムが準備できてからモジュールを読み込む
        await this.loadAllModulesFromStorage();
        this.addSystemLog?.('module', `${this.modules.size} 個のモジュールを読み込みました。`);
        return result;
    };

    // --- handleAppMessage にモジュール管理アクションを追加 ---
    const __originalHandleAppMessage = k.handleAppMessage;
    k.handleAppMessage = async function(e) {
        const data = e.data;
        const sourceWindow = e.source;
        
        // モジュール管理アクション
        if (data.action === 'INSTALL_MODULE') {
            try {
                // data.file は ArrayBuffer として渡される想定
                const file = new File([data.file], data.fileName || 'module.modpaa', { type: 'application/zip' });
                const result = await this.loadModule(file);
                sourceWindow.postMessage({ type: 'INSTALL_MODULE_RESULT', success: true, id: result.id, requestId: data.requestId }, '*');
            } catch(e) {
                sourceWindow.postMessage({ type: 'INSTALL_MODULE_RESULT', success: false, error: e.message, requestId: data.requestId }, '*');
            }
            return;
        }
        
        if (data.action === 'GET_MODULE_LIST') {
            const list = this.getModuleList();
            sourceWindow.postMessage({ type: 'MODULE_LIST_RESULT', modules: list, requestId: data.requestId }, '*');
            return;
        }
        
        if (data.action === 'ENABLE_MODULE') {
            const success = await this.enableModule(data.moduleId);
            sourceWindow.postMessage({ type: 'ENABLE_MODULE_RESULT', success: success, requestId: data.requestId }, '*');
            return;
        }
        
        if (data.action === 'DISABLE_MODULE') {
            const success = await this.disableModule(data.moduleId);
            sourceWindow.postMessage({ type: 'DISABLE_MODULE_RESULT', success: success, requestId: data.requestId }, '*');
            return;
        }
        
        if (data.action === 'UNINSTALL_MODULE') {
            await this.unloadModule(data.moduleId);
            sourceWindow.postMessage({ type: 'UNINSTALL_MODULE_RESULT', success: true, requestId: data.requestId }, '*');
            return;
        }
        
        if (data.action === 'SET_MODULE_PRIORITY') {
            const success = await this.setModulePriority(data.moduleId, data.priority);
            sourceWindow.postMessage({ type: 'SET_MODULE_PRIORITY_RESULT', success: success, requestId: data.requestId }, '*');
            return;
        }
        
        // 既存ハンドラに委譲
        return __originalHandleAppMessage.call(this, e);
    };


})();

// ==================== 設定アプリ用モジュール管理ヘルパー（一番最後に追加するだけ） ====================
let __moduleListResponseHandler = null;

async function loadModuleListIntoUI() {
    const container = document.getElementById('module-list-container');
    if (!container) return;
    container.innerHTML = '<p style="text-align:center; opacity:0.5;">読み込み中...</p>';
    const requestId = Date.now();
    window.parent.postMessage({ action: 'GET_MODULE_LIST', requestId: requestId }, '*');
    if (__moduleListResponseHandler) window.removeEventListener('message', __moduleListResponseHandler);
    __moduleListResponseHandler = (e) => {
        if (e.data.type === 'MODULE_LIST_RESULT' && e.data.requestId === requestId) {
            window.removeEventListener('message', __moduleListResponseHandler);
            const modules = e.data.modules || [];
            if (modules.length === 0) {
                container.innerHTML = '<p style="text-align:center; opacity:0.5;">インストール済みモジュールはありません。</p>';
                return;
            }
            let html = '';
            modules.forEach(mod => {
                const statusColor = mod.enabled ? '#4CAF50' : '#888';
                const statusText = mod.enabled ? '有効' : '無効';
                html += '<div style="background:rgba(128,128,128,0.1); border-radius:12px; padding:12px; margin-bottom:8px;">' +
                    '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">' +
                    '<span style="font-weight:bold;">' + escapeHtml(mod.name) + '</span>' +
                    '<span style="color:' + statusColor + '; font-size:11px;">' + statusText + '</span></div>' +
                    '<div style="font-size:11px; opacity:0.7; margin-bottom:8px;">' + escapeHtml(mod.description || '') + ' v' + mod.version + ' | 優先度: ' + mod.priority + '</div>' +
                    '<div style="display:flex; gap:6px; flex-wrap:wrap;">' +
                    '<button class="btn-mini" style="padding:4px 10px;" onclick="window.__toggleModuleEnable(\'' + mod.id + '\', ' + !mod.enabled + ')">' + (mod.enabled ? '無効化' : '有効化') + '</button>' +
                    '<button class="btn-mini" style="padding:4px 10px; background:#666;" onclick="window.__changeModulePriority(\'' + mod.id + '\', ' + mod.priority + ')">優先度</button>' +
                    '<button class="btn-mini" style="padding:4px 10px; background:#8B0000;" onclick="window.__uninstallModuleDialog(\'' + mod.id + '\', \'' + escapeHtml(mod.name) + '\')">削除</button>' +
                    '</div></div>';
            });
            container.innerHTML = html;
        }
    };
    window.addEventListener('message', __moduleListResponseHandler);
    setTimeout(() => { window.removeEventListener('message', __moduleListResponseHandler); if (container.innerHTML.includes('読み込み中')) container.innerHTML = '<p style="text-align:center; opacity:0.5; color:#ff6666;">取得できませんでした。</p>'; }, 3000);
}

window.installModuleDialog = async function() {
    try {
        const [handle] = await window.showOpenFilePicker({ types: [{ description: 'PaaOS Module', accept: { 'application/zip': ['.modpaa'] } }] });
        const file = await handle.getFile(); const buffer = await file.arrayBuffer(); const requestId = Date.now();
        window.parent.postMessage({ action: 'INSTALL_MODULE', file: buffer, fileName: handle.name, requestId: requestId }, '*');
        const handler = (e) => { if (e.data.type === 'INSTALL_MODULE_RESULT' && e.data.requestId === requestId) { window.removeEventListener('message', handler); kernel.showDialog('PaaOS', e.data.success ? 'モジュールインストール完了' : '失敗: ' + (e.data.error || ''), [{ label: 'OK', value: 'ok' }]); if (e.data.success) loadModuleListIntoUI(); } };
        window.addEventListener('message', handler); setTimeout(() => window.removeEventListener('message', handler), 10000);
    } catch(e) { if (e.name !== 'AbortError') kernel.showDialog('PaaOS', '[エラー] インストールに失敗しました。', [{ label: 'OK', value: 'ok' }]); }
};

window.__toggleModuleEnable = function(moduleId, enable) {
    const requestId = Date.now();
    window.parent.postMessage({ action: enable ? 'ENABLE_MODULE' : 'DISABLE_MODULE', moduleId: moduleId, requestId: requestId }, '*');
    const handler = (e) => { if ((e.data.type === 'ENABLE_MODULE_RESULT' || e.data.type === 'DISABLE_MODULE_RESULT') && e.data.requestId === requestId) { window.removeEventListener('message', handler); if (e.data.success) loadModuleListIntoUI(); else kernel.showDialog('PaaOS', '[エラー] 操作に失敗しました。', [{ label: 'OK', value: 'ok' }]); } };
    window.addEventListener('message', handler); setTimeout(() => window.removeEventListener('message', handler), 5000);
};

window.__changeModulePriority = function(moduleId, currentPriority) {
    const newPriority = prompt('新しい優先度（数字が大きいほど後から実行）:', currentPriority); if (newPriority === null) return;
    const priority = parseInt(newPriority); if (isNaN(priority)) { kernel.showDialog('PaaOS', '[エラー] 数字を入力してください。', [{ label: 'OK', value: 'ok' }]); return; }
    const requestId = Date.now();
    window.parent.postMessage({ action: 'SET_MODULE_PRIORITY', moduleId: moduleId, priority: priority, requestId: requestId }, '*');
    const handler = (e) => { if (e.data.type === 'SET_MODULE_PRIORITY_RESULT' && e.data.requestId === requestId) { window.removeEventListener('message', handler); if (e.data.success) loadModuleListIntoUI(); else kernel.showDialog('PaaOS', '[エラー] 優先度の変更に失敗しました。', [{ label: 'OK', value: 'ok' }]); } };
    window.addEventListener('message', handler); setTimeout(() => window.removeEventListener('message', handler), 5000);
};

window.__uninstallModuleDialog = async function(moduleId, moduleName) {
    const result = await kernel.showDialog('確認', 'モジュール「' + moduleName + '」を削除しますか？', [
        { label: 'OK', value: 'ok' },
        { label: 'キャンセル', value: 'cancel' }
    ]);
    if (result !== 'ok') return;
    
    const requestId = Date.now();
    window.parent.postMessage({ action: 'UNINSTALL_MODULE', moduleId: moduleId, requestId: requestId }, '*');
    const handler = (e) => { if (e.data.type === 'UNINSTALL_MODULE_RESULT' && e.data.requestId === requestId) { window.removeEventListener('message', handler); if (e.data.success) loadModuleListIntoUI(); else kernel.showDialog('PaaOS', '[エラー] 削除に失敗しました。', [{ label: 'OK', value: 'ok' }]); } };
    window.addEventListener('message', handler); setTimeout(() => window.removeEventListener('message', handler), 5000);
};

function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }


</script>
