renderDesktop() {
    const desk = document.getElementById('desktop'); 
    desk.innerHTML = '';
    const appIds = Object.keys(this.apps).filter(id => !this.config.hiddenApps.includes(id));
    appIds.forEach((id, index) => {
        const app = this.apps[id];
        const div = document.createElement('div');
        div.className = 'app-icon';
        div.id = 'icon-' + id;
        const icon = this._isImageIcon(app.icon) ? `<img src="${app.icon}">` : app.icon;
        div.innerHTML = `<div class="icon-box">${icon}</div><div class="icon-label">${app.name}</div>`;
        let pos = this.config.appPositions[id];
        if (!pos) {
            const col = index % 4;
            const row = Math.floor(index / 4);
            pos = { x: 20 + col * this.gridSize.x, y: 70 + row * this.gridSize.y };
        }
        div.style.left = pos.x + "px";
        div.style.top = pos.y + "px";
        
        // タッチ操作用
        div.addEventListener('touchstart', (e) => {
            if (this.isEditMode) this.startMoving(id, e);
        }, { passive: true });
        
        // マウス操作用（PC対応）
        div.addEventListener('mousedown', (e) => {
            if (this.isEditMode) this.startMoving(id, e);
        });
        
        // ★ タッチ遅延対策: pointerup で即座に起動（非編集モードのみ）
        //    click はスワイプ直後に発火しないことがあるため、pointerup で直接処理する
        let _iconPointerStart = null;
        div.addEventListener('pointerdown', (e) => {
            if (e.button !== undefined && e.button !== 0) return;
            _iconPointerStart = { x: e.clientX, y: e.clientY, t: Date.now(), id: e.pointerId };

            // ★ OriginOS風：押下時に縮小フィードバック
            const box = div.querySelector('.icon-box');
            if (box && !this.isEditMode) {
                box.style.transition = 'transform 0.12s ease-out';
                box.style.transform = 'scale(0.88)';
            }
        }, { passive: true });

        div.addEventListener('pointerup', (e) => {
            if (!_iconPointerStart || _iconPointerStart.id !== e.pointerId) return;
            const start = _iconPointerStart;
            _iconPointerStart = null;

            // ★ OriginOS風：離した時に戻す
            const box = div.querySelector('.icon-box');
            if (box) {
                box.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
                box.style.transform = 'scale(1)';
            }

            if (this.isEditMode) return;        // 編集モードは click に任せる
            if (this._isDragging) return;

            const elapsed = Date.now() - start.t;
            const dist = Math.hypot(e.clientX - start.x, e.clientY - start.y);
            if (elapsed > 500 || dist > 15) return;   // 長押し・ドラッグは無視

            // click の二重発火を抑止しつつ即起動
            div._launchHandled = true;
            setTimeout(() => { div._launchHandled = false; }, 350);
            this.launch(id, e);
        }, { passive: true });

        // ★ pointercancel でもフィードバックを戻す
        div.addEventListener('pointercancel', () => {
            const box = div.querySelector('.icon-box');
            if (box) {
                box.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
                box.style.transform = 'scale(1)';
            }
            _iconPointerStart = null;
        }, { passive: true });

        // onclick はフォールバックとして維持（pointerup が来なかった場合）
div.onclick = async (e) => {

    }
};

}

initMoveSystem() {

    window.addEventListener('touchmove', (e) => {
        if (!this.movingAppId) return;
        e.preventDefault();
        const touch = e.touches[0];

        // ★ ドラッグ移動量を記録（6px 超えたら「移動した」と判定）
        if (this._iconDragStartPos) {
            const dx = touch.clientX - this._iconDragStartPos.x;
            const dy = touch.clientY - this._iconDragStartPos.y;
            if (Math.hypot(dx, dy) > 6) this._iconDragMoved = true;
        }

        const el = document.getElementById('icon-' + this.movingAppId);
        if (el) {
            const desktop = document.getElementById('desktop');
            const rect = desktop.getBoundingClientRect();
            const x = touch.clientX - rect.left - 40;
            const y = touch.clientY - rect.top - 45;
            el.style.zIndex = '10000';
            el.style.left = x + "px";
            el.style.top = y + "px";
        }
    }, { passive: false });
    
    window.addEventListener('touchend', () => {
        if (this.movingAppId) this.stopMoving();
    });

    // ★ マウス操作用
    window.addEventListener('mousemove', (e) => {
        if (!this.movingAppId) return;
        e.preventDefault();

        // ★ ドラッグ移動量を記録（6px 超えたら「移動した」と判定）
        if (this._iconDragStartPos) {
            const dx = e.clientX - this._iconDragStartPos.x;
            const dy = e.clientY - this._iconDragStartPos.y;
            if (Math.hypot(dx, dy) > 6) this._iconDragMoved = true;
        }

        const el = document.getElementById('icon-' + this.movingAppId);
        if (el) {
            const desktop = document.getElementById('desktop');

            const x = e.clientX - rect.left - 40;

            el.style.left = x + "px";

    window.addEventListener('mouseup', () => {
        if (this.movingAppId) this.stopMoving();
    });

    // ★★★ pointerup を追加（マウス・タッチ両方でより確実に終了検知） ★★★

window.addEventListener('touchcancel', () => {

startMoving(id, e) {
    this.movingAppId = id;
    this._isDragging = true;

    // ★ ドラッグ判定用：開始位置を記録し、移動フラグをリセット
    this._iconDragMoved = false;
    if (e) {
        const p = e.touches ? e.touches[0] : e;
        this._iconDragStartPos = { x: p.clientX, y: p.clientY };
    } else {
        this._iconDragStartPos = null;
    }

    const el = document.getElementById('icon-' + id);
    if (el) {
        el.classList.add('moving');
        el.style.zIndex = '10000';
    }
    if (navigator.vibrate) navigator.vibrate(20);
    if (e && e.preventDefault) e.preventDefault();
}
async stopMoving() {
    if (!this.movingAppId) return;
    const id = this.movingAppId;
    const el = document.getElementById('icon-' + id);

    // ★ 同期的にリセット（setTimeoutを排除 → 高速タップ応答改善）
    this.movingAppId = null;
    this._isDragging = false;

    if (!el) return;
    el.classList.remove('moving');
    el.style.zIndex = '';
    const currentX = parseFloat(el.style.left);
    const currentY = parseFloat(el.style.top);
    const safeX = isNaN(currentX) ? 20 : currentX;
    const safeY = isNaN(currentY) ? 70 : currentY;
    const snapX = Math.round((safeX - 20) / this.gridSize.x) * this.gridSize.x + 20;
    const snapY = Math.round((safeY - 70) / this.gridSize.y) * this.gridSize.y + 70;
    const finalX = Math.max(20, Math.min(snapX, 375 - 100));
    const finalY = Math.max(70, Math.min(snapY, 812 - 150));
    el.style.left = finalX + "px";
    el.style.top = finalY + "px";
    this.config.appPositions[id] = { x: finalX, y: finalY };
    await this.saveConfig();

async reboot() {
    // ★ デモモードのセッション解除をリセット
    if (this._demoState) this._demoState.sessionUnlockedUntil = 0;

    const overlay = document.getElementById('reboot-overlay');
    const display = document.getElementById('reboot-display');
    overlay.style.display = 'flex';
    overlay.style.backgroundColor = '#000';
    display.style.display = 'block';
    overlay.style.justifyContent = 'center';
    overlay.style.alignItems = 'center';

    this.isBooting = true;
  this.closeRecovery();


    try {
        const sys = await this.root.getDirectoryHandle('system');

        // shutdown画像表示
        try {
            const shutdownDir = await sys.getDirectoryHandle('shutdown');
            const entries = [];
            for await (const entry of shutdownDir.values()) {
                if (entry.kind === 'file') entries.push(entry);
            }
            entries.sort((a, b) => a.name.localeCompare(b.name));
            if (entries.length === 1) {
                const file = await entries[0].getFile();
                const url = URL.createObjectURL(file);
                display.src = url;
                display.style.display = 'block';
                await new Promise(r => setTimeout(r, 3000));
                URL.revokeObjectURL(url);
            } else if (entries.length > 1) {
                for (const entry of entries) {
                    const file = await entry.getFile();
                    const url = URL.createObjectURL(file);
                    display.src = url;
                    await new Promise(r => setTimeout(r, 1000 / 24));
                    URL.revokeObjectURL(url);
                }
            }
        } catch(e) {}

        display.style.display = 'none';
        await new Promise(r => setTimeout(r, 3000));
        display.style.display = 'block';

        // boot画像表示
        try {
            const bootDir = await sys.getDirectoryHandle('boot');
            const entries = [];
            for await (const entry of bootDir.values()) {
                if (entry.kind === 'file') entries.push(entry);
            }
            entries.sort((a, b) => a.name.localeCompare(b.name));
            if (entries.length === 1) {
                const file = await entries[0].getFile();
                const url = URL.createObjectURL(file);
                display.src = url;
                await new Promise(r => setTimeout(r, 5000));

// ----- リカバリーモード（タッチ＋キーボード完全対応） -----
launchRecovery() {
  const screen = document.getElementById('recovery-screen');
  if (!screen) return;

  // メニュー項目
  this.recoveryMenu = [
    { label: '続行 (再起動)', action: 'reboot' },
    { label: 'ユーザー設定を初期化', action: 'wipe_config' },
    { label: '更新ファイルをインストール', action: 'install_update' },
    { label: 'システムを再読み込み', action: 'reload' }
  ];
  this.recoveryIndex = 0;
  this.recoveryConfirm = false;

  // 画面表示
  screen.classList.add('active');
  this.renderRecoveryMenu();

  // キーボードイベント（一度だけバインド）
  if (!this._recoveryBound) {
    this._recoveryBound = true;
    document.addEventListener('keydown', this._handleRecoveryKey.bind(this));
  }

  // ★★★ メニュークリック・タッチイベント（イベントデリゲーション） ★★★
  const menu = document.getElementById('recovery-menu');
  if (menu && !this._menuClickBound) {
    this._menuClickBound = true;
    menu.addEventListener('click', (e) => {
      // メニュー項目のクリック
      const item = e.target.closest('.recovery-item');
      if (item) {
        const idx = parseInt(item.dataset.index);
        if (!isNaN(idx)) {
          this.recoveryIndex = idx;
          if (!this.recoveryConfirm) {
            this.recoveryConfirm = true;
            this.renderRecoveryMenu();
          }
        }
        e.stopPropagation();
        return;
      }

      // 確認画面のボタン（実行/キャンセル）
      const btn = e.target.closest('.recovery-btn');
      if (btn) {
        e.stopPropagation();
        if (btn.dataset.action === 'execute') {
          this.executeRecoveryAction();
        } else if (btn.dataset.action === 'cancel') {
          this.recoveryConfirm = false;
          this.renderRecoveryMenu();
        }
      }
    });

    // ★★★ マウスホバーで選択を移動（PC用） ★★★
    menu.addEventListener('mouseover', (e) => {
      const item = e.target.closest('.recovery-item');
      if (item && !this.recoveryConfirm) {
        const idx = parseInt(item.dataset.index);
        if (!isNaN(idx) && idx !== this.recoveryIndex) {
          this.recoveryIndex = idx;
          this.renderRecoveryMenu(false);
        }
      }
    });
  }
}

_handleRecoveryKey(e) {
  const screen = document.getElementById('recovery-screen');
  if (!screen || !screen.classList.contains('active')) return;

  // ★ デバッグ用（必要ならコメント解除）
  // console.log('Recovery key:', e.key);

  if (this.recoveryConfirm) {
    // 確認画面
    if (e.key === 'Enter') {
      e.preventDefault();
      this.executeRecoveryAction();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      this.recoveryConfirm = false;
      this.renderRecoveryMenu();
    }
    return;
  }

  // メニュー画面
  switch (e.key) {
    case 'ArrowUp':
    case 'Up':   // 一部ブラウザ対応
      e.preventDefault();
      this.recoveryIndex = (this.recoveryIndex - 1 + this.recoveryMenu.length) % this.recoveryMenu.length;
      this.renderRecoveryMenu(true); // スクロールさせる
      break;
    case 'ArrowDown':
    case 'Down':
      e.preventDefault();
      this.recoveryIndex = (this.recoveryIndex + 1) % this.recoveryMenu.length;
      this.renderRecoveryMenu(true);
      break;
    case 'Enter':
      e.preventDefault();
      this.recoveryConfirm = true;
      this.renderRecoveryMenu();
      break;
    case 'Escape':
      e.preventDefault();
      this.closeRecovery();
      break;
  }
}

renderRecoveryMenu(scrollToSelected = false) {
  const menu = document.getElementById('recovery-menu');
  const status = document.getElementById('recovery-status');
  if (!menu) return;

  if (this.recoveryConfirm) {
    // --- 確認画面 ---
    const item = this.recoveryMenu[this.recoveryIndex];
    menu.innerHTML = `
      <div style="padding:20px; text-align:center; font-size:18px; color:#0f0; line-height:1.6;">
        ▶ ${item.label} を実行しますか？
      </div>
      <div style="display:flex; gap:20px; justify-content:center; margin-top:24px; flex-wrap:wrap;">
        <button class="recovery-btn execute" data-action="execute">実行</button>
        <button class="recovery-btn cancel" data-action="cancel">キャンセル</button>
      </div>
    `;
    if (status) status.textContent = '実行確認中...';
    return;
  }

  // --- メニュー一覧 ---
  let html = '';
  this.recoveryMenu.forEach((item, idx) => {
    const selected = idx === this.recoveryIndex ? ' selected' : '';
    html += `<div class="recovery-item${selected}" data-index="${idx}">${item.label}</div>`;
  });
  menu.innerHTML = html;

  if (status) status.textContent = '誤った操作には注意してください。';

  // キーボード操作時に選択項目をスクロール表示
  if (scrollToSelected) {
    const selectedEl = menu.querySelector('.recovery-item.selected');
    if (selectedEl) {
      setTimeout(() => {
        selectedEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }, 50);
    }
  }
}

executeRecoveryAction() {
  const item = this.recoveryMenu[this.recoveryIndex];
  const status = document.getElementById('recovery-status');
  if (status) status.textContent = `実行中: ${item.label}...`;

  const action = item.action;
  switch (action) {
    case 'reboot':
      this.closeRecovery();
      this.reboot();
      break;
    case 'wipe_config':
      this.wipeConfigAndReboot();
      break;
    case 'install_update':
      this.installUpdateFromRecovery();
      break;
    case 'reload':
      this.closeRecovery();
      location.reload();
      break;
    default:
      if (status) status.textContent = '⚠️ 不明なアクション';
      this.recoveryConfirm = false;
      this.renderRecoveryMenu();
  }
}

async wipeConfigAndReboot() {
  try {
    const sys = await this.root.getDirectoryHandle('system');
    await sys.removeEntry('config.json');
    const status = document.getElementById('recovery-status');
    if (status) status.textContent = '✅ 設定を初期化しました。再起動します...';
    setTimeout(() => {
      this.closeRecovery();
      this.reboot();
    }, 1500);
  } catch(e) {
    const status = document.getElementById('recovery-status');
    if (status) status.textContent = '❌ 初期化失敗: ' + e.message;
    this.recoveryConfirm = false;
    this.renderRecoveryMenu();
  }
}

async installUpdateFromRecovery() {
  const status = document.getElementById('recovery-status');
  if (status) status.textContent = '📥 更新ファイルを選択してください...';
  try {
    const success = await this.updateSystem();
    if (success) {
      // 正常終了 → リカバリー画面を閉じる
      this.closeRecovery();
    } else {
      // 失敗またはキャンセル → リカバリー画面を維持
      if (status) status.textContent = '⏹ キャンセルまたは失敗しました。';
      // メニュー状態に戻す
      this.recoveryConfirm = false;
      this.renderRecoveryMenu();
      // ステータスメッセージを数秒後に戻す（オプション）
      setTimeout(() => {
        if (status && !this.recoveryConfirm) {
          status.textContent = '↑↓ 選択 / Enter 実行 / ESC キャンセル  (タップ/クリックでも操作可能)';
        }
      }, 3000);
    }
  } catch(e) {
    // 万が一のエラー（基本的には発生しない）
    console.error('更新インストールエラー:', e);
    if (status) status.textContent = '❌ エラーが発生しました。: ' + e.message;
    this.recoveryConfirm = false;
    this.renderRecoveryMenu();
  }
}
closeRecovery() {
  const screen = document.getElementById('recovery-screen');
  if (screen) screen.classList.remove('active');
  // キーボードイベントは残す（再開時に再バインドしない）
}

// アプリ一覧を取得（キャッシュ付き）
async fetchStoreApps(force = false) {
    const cacheKey = this._getStoreCacheKey();
    const cacheTimeKey = cacheKey + '_time';
    const now = Date.now();
    // 5分間キャッシュ有効
    if (!force && localStorage.getItem(cacheTimeKey) && (now - parseInt(localStorage.getItem(cacheTimeKey)) < 300000)) {
        try {
            const cached = JSON.parse(localStorage.getItem(cacheKey));
            if (cached && cached.apps) return cached;
        } catch(e) {}
    }
    try {
        const url = `https://api.github.com/repos/${this._storeRepo.owner}/${this._storeRepo.repo}/contents/apps.json?ref=${this._storeRepo.branch}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch apps.json');
        const data = await response.json();
const binaryString = atob(data.content);
const bytes = new Uint8Array(binaryString.length);
for (let i = 0; i < binaryString.length; i++) {
    bytes[i] = binaryString.charCodeAt(i);
}
const content = new TextDecoder('utf-8').decode(bytes);
const json = JSON.parse(content);
        localStorage.setItem(cacheKey, JSON.stringify(json));
        localStorage.setItem(cacheTimeKey, String(now));
        return json;
    } catch(e) {
        console.error('Store fetch error:', e);
        // キャッシュがあれば古いものを返す
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
            try { return JSON.parse(cached); } catch(e2) {}
        }
        return null;
    }
}

// インストール済みバージョンを取得
// インストール済みバージョンを取得（ファイルシステム直接検索）
async getInstalledVersion(appId) {
    try {
        const appDir = await this.root.getDirectoryHandle('apps');
        // apps/ 以下の全フォルダをループ
        for await (const entry of appDir.values()) {
            if (entry.kind !== 'directory') continue;
            try {
                // id.txt をチェック
                const idFile = await entry.getFileHandle('id.txt');
                const file = await idFile.getFile();
                const id = (await file.text()).trim();
                if (id === appId) {
                    try {
                        const versionFile = await entry.getFileHandle('version.txt');
                        const vFile = await versionFile.getFile();
                        return (await vFile.text()).trim();
                    } catch(e) {
                        return null;
                    }
                }
            } catch(e) {}
        }
    } catch(e) {}
    return null;
}

async isAppInstalled(appId) {
    // this.apps に appId がキーとして存在すればインストール済み
    return !!this.apps[appId];
}

// 更新の有無をチェック
async checkForUpdate(appId) {
    const store = await this.fetchStoreApps();
    if (!store) return null;
    const appInfo = store.apps.find(a => a.id === appId);
    if (!appInfo) return null;
    
    const app = this.apps[appId];
    if (!app) return null;
    const folderName = app._folder || appId;
    
    try {
        const appDir = await this.root.getDirectoryHandle('apps');
        const targetDir = await appDir.getDirectoryHandle(folderName);
        const versionFile = await targetDir.getFileHandle('version.txt');
        const file = await versionFile.getFile();
        const installed = await file.text();
        if (appInfo.version !== installed.trim()) {
            return appInfo.version;
        }
    } catch(e) {}
    return null;
}

async installApp(appId, onProgress) {
    try {
        const store = await this.fetchStoreApps();
        if (!store) throw new Error('ストア情報を取得できませんでした。');
        const appInfo = store.apps.find(a => a.id === appId);
        if (!appInfo) throw new Error(`アプリ「${appId}」が見つかりません。`);

        const folderName = appId.trim();
        if (!folderName) throw new Error('アプリIDが空です。');

        const appDir = await this.root.getDirectoryHandle('apps', { create: true });

        // ★★★ 日本語フォルダが存在したら、リネーム（削除しない） ★★★
        try {
            const oldDir = await appDir.getDirectoryHandle(folderName);
            // バックアップ名にリネーム（_old_タイムスタンプ）
            const backupName = folderName + '_old_' + Date.now();
            // リネームは File System Access API では直接できないので、
            // 新しい名前にコピーしてから古い方を削除する（が、削除が問題なので...）
            // 代わりに、フォルダごと移動（rename）はできないので、
            // 新しいフォルダに中身をコピーしてから古いフォルダを消すという方法。
            // しかし、それだとまた削除の問題にぶつかる。
            // なので、ここでは「削除せずに空にする」ことを試みる。
        } catch(e) {}

        // ★★★ ここからは「削除せずに上書き」でいく ★★★
        // 代わりに、強制的に新しいフォルダを作成する（既存があればエラーになるが、それを無視）
        // 方法: 新しいフォルダを tmp で作り、既存を置き換える

        let targetDir;
        try {
            // まず新しいフォルダを作成しようとする
            targetDir = await appDir.getDirectoryHandle(folderName, { create: true });
        } catch(e) {
            // 既に存在する場合は、一度中身を空にしてから使う
            targetDir = await appDir.getDirectoryHandle(folderName);
            // 中身を空にする（ファイルだけ削除、フォルダは残す）
            const entries = [];
            for await (const entry of targetDir.values()) {
                entries.push(entry);
            }
            for (const entry of entries) {
                try {
                    if (entry.kind === 'file') {
                        await targetDir.removeEntry(entry.name);
                    } else {
                        await targetDir.removeEntry(entry.name, { recursive: true });
                    }
                } catch(e) {
                    console.warn(`[install] 削除失敗: ${entry.name}`, e);
                }
            }
        }

        // ファイルダウンロード
        const totalFiles = appInfo.files.length;
        let completed = 0;

        for (const file of appInfo.files) {
            const fileUrl = `https://raw.githubusercontent.com/${this._storeRepo.owner}/${this._storeRepo.repo}/${this._storeRepo.branch}/${appInfo.basePath}${file}`;
            const response = await fetch(fileUrl);
            if (!response.ok) throw new Error(`ファイル ${file} のダウンロードに失敗しました。 (${response.status})`);
            const blob = await response.blob();
            const fileHandle = await targetDir.getFileHandle(file, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(blob);
            await writable.close();
            completed++;
            if (onProgress) onProgress(completed / totalFiles);
        }

        // メタデータ保存
        const idFile = await targetDir.getFileHandle('id.txt', { create: true });
        const idWritable = await idFile.createWritable();
        await idWritable.write(appId);
        await idWritable.close();

        const versionHandle = await targetDir.getFileHandle('version.txt', { create: true });
        const versionWritable = await versionHandle.createWritable();
        await versionWritable.write(appInfo.version);
        await versionWritable.close();

        await this.scanApps();
        this.renderDesktop();
        this.renderDock();

        const appBody = document.getElementById('body-sys.appstore');
        if (appBody) {
            await this.renderAppStore(appBody);
        }

        this.showOSPopup('アプリストア', `${appInfo.name} のインストールが完了しました。`);
    } catch(e) {
        this.showOSPopup('❌ インストールエラー', e.message);
        console.error(e);
    }
}
/* ★ 設定アプリのアバターを3秒以内に10回タップすると hello.png を表示 */
_setupAvatarEasterEgg() {
    const avatar = document.getElementById('settings-avatar-egg');
    if (!avatar) return;

    // 二重登録防止
    if (avatar._eggBound) return;
    avatar._eggBound = true;

    avatar.style.cursor = 'pointer';
    avatar.style.userSelect = 'none';
    avatar.style.webkitUserSelect = 'none';

    let tapCount = 0;
    let firstTapTime = 0;
    const WINDOW_MS = 3000;   // 3秒間
    const REQUIRED = 10;      // 10回

    const onTap = (e) => {
        e.stopPropagation();
        const now = Date.now();

        // 3秒経過していたらカウントをリセット
        if (now - firstTapTime > WINDOW_MS) {
            tapCount = 0;
            firstTapTime = now;
        }
        tapCount++;

        // 視覚フィードバック：タップごとに少し縮む
        avatar.style.transition = 'transform 0.08s ease-out';
        avatar.style.transform = 'scale(0.9)';
        setTimeout(() => { avatar.style.transform = 'scale(1)'; }, 80);

        // 発動判定
        if (tapCount >= REQUIRED) {
            tapCount = 0;
            firstTapTime = 0;
            this._showHelloEgg();
        }
    };

    // タッチ・マウス両対応（touchstart で即反応）
    avatar.addEventListener('touchstart', onTap, { passive: true });
    avatar.addEventListener('mousedown', onTap);

    // 保存（設定画面を閉じるときに解除できるように）
    this._avatarEggCleanup = () => {
        avatar.removeEventListener('touchstart', onTap);
        avatar.removeEventListener('mousedown', onTap);
    };
}

// アプリを削除
async uninstallApp(appId) {
    // アプリ情報を取得
    const appInfo = this.apps[appId];
    if (!appInfo) {
        throw new Error('アプリが見つかりません。');
    }

    const confirm = await this.showDialog('{警告}アプリ削除', `「${appInfo.name}」を削除しますか？`, [
        { label: '削除', value: 'ok' },
        { label: 'キャンセル', value: 'cancel' }
    ]);
    if (confirm !== 'ok') return;

    // ★★★ apps ディレクトリを毎回新しく取得 ★★★
    const appDir = await this.root.getDirectoryHandle('apps');

    // ★★★ id.txt を検索してフォルダを特定 ★★★
    let targetFolder = null;
    for await (const entry of appDir.values()) {
        if (entry.kind !== 'directory') continue;
        try {
            const idFile = await entry.getFileHandle('id.txt');
            const idContent = await (await idFile.getFile()).text();
            if (idContent.trim() === appId) {
                targetFolder = entry.name;
                break;
            }
        } catch(e) {
            // id.txt がなければスキップ
        }
    }

    if (!targetFolder) {
        // フォールバック：_folder を試す
        const fallbackName = appInfo._folder;
        if (fallbackName) {
            try {
                await appDir.getDirectoryHandle(fallbackName);
                targetFolder = fallbackName;
            } catch(e) {}
        }
    }

    if (!targetFolder) {
        throw new Error(`アプリ「${appInfo.name}」のフォルダが見つかりません。`);
    }

    // ★★★ フォルダ内のファイルを1つずつ削除 ★★★
    const targetDir = await appDir.getDirectoryHandle(targetFolder);
    const errors = [];

    // まず全エントリをリストアップ
    const entries = [];
    for await (const entry of targetDir.values()) {
        entries.push(entry);
    }

    // ファイルを1つずつ削除
    for (const entry of entries) {
        try {
            if (entry.kind === 'file') {
                await targetDir.removeEntry(entry.name);
            } else {
                // サブフォルダは再帰的に削除（ここでは想定しないが一応）
                await targetDir.removeEntry(entry.name, { recursive: true });
            }
        } catch(e) {
            errors.push(`${entry.name}: ${e.message}`);
        }
    }

    // エラーがあってもフォルダ削除を試みる
    try {
        // ★★★ ここで再度 appDir を取得してからフォルダ削除 ★★★
        const freshAppDir = await this.root.getDirectoryHandle('apps');
        await freshAppDir.removeEntry(targetFolder);
    } catch(e) {
        errors.push(`フォルダ削除: ${e.message}`);
        // 空でない場合は再試行（強制削除）
        try {
            const retryDir = await this.root.getDirectoryHandle('apps');
            await retryDir.removeEntry(targetFolder, { recursive: true });
        } catch(e2) {
            errors.push(`強制削除: ${e2.message}`);
        }
    }

    if (errors.length > 0) {
        console.warn('削除エラー:', errors);
        // 一部削除できなくても続行
    }

    // 後処理
    await this.scanApps();
    this.renderDesktop();
    this.renderDock();

    const appBody = document.getElementById('body-sys.appstore');
    if (appBody) {
        await this.renderAppStore(appBody);
    }

    this.showOSPopup('アプリストア', `${appInfo.name} を削除しました。`);
}

// 内部：リスト描画
async _renderStoreList(body) {
    const listContainer = body.querySelector('#store-apps-list');
    const searchKeyword = body.querySelector('#store-search').value.toLowerCase();
    listContainer.innerHTML = '読み込み中...';

    const store = await this.fetchStoreApps();
    if (!store || !store.apps) {
        listContainer.innerHTML = '⚠️ アプリ一覧の取得に失敗しました。インターネット接続を確認してください。';
        return;
    }

    const installedMap = {};
    for (const app of store.apps) {
        const version = await this.getInstalledVersion(app.id);
        if (version) installedMap[app.id] = version;
    }

    let apps = store.apps;
    if (searchKeyword) {
        apps = apps.filter(app => app.name.toLowerCase().includes(searchKeyword) || app.id.toLowerCase().includes(searchKeyword));
    }

    listContainer.innerHTML = '';
    if (apps.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding:40px; opacity:0.5;">該当するアプリがありません。</div>';
        return;
    }

    for (const app of apps) {
        const installedVersion = installedMap[app.id] || null;
        const isInstalled = !!installedVersion;
        const updateAvailable = isInstalled ? await this.checkForUpdate(app.id) : false;
        const iconHtml = app.icon ? `<img src="${app.icon}" style="width:48px; height:48px; border-radius:8px; object-fit:cover;" onerror="this.style.display='none'">` : '📱';

        const card = document.createElement('div');
        card.style.cssText = 'background:rgba(128,128,128,0.08); border-radius:16px; padding:14px; display:flex; align-items:center; gap:14px;';

        const iconDiv = document.createElement('div');
        iconDiv.style.cssText = 'font-size:36px; flex-shrink:0;';
        iconDiv.innerHTML = iconHtml;
        card.appendChild(iconDiv);

        const infoDiv = document.createElement('div');
        infoDiv.style.cssText = 'flex:1; min-width:0;';
        infoDiv.innerHTML = `
    <div style="font-weight:bold; font-size:16px;">${app.name}</div>
    <div style="font-size:12px; opacity:0.7; margin-top:2px;">${app.description || ''}</div>
    <div style="font-size:11px; opacity:0.5; margin-top:4px;">
        バージョン: ${app.version}
        ${isInstalled ? `(インストール済み v${installedVersion})` : ''}
        ${updateAvailable ? `<span style="color:#4CAF50; margin-left:8px;">🔄 更新あり (${updateAvailable})</span>` : ''}
    </div>
`;
        card.appendChild(infoDiv);

        const btnDiv = document.createElement('div');
        btnDiv.style.cssText = 'display:flex; gap:6px; flex-shrink:0;';

        if (!isInstalled) {
            const btn = document.createElement('button');
            btn.className = 'btn-mini';
            btn.textContent = 'インストール';
            btn.onclick = async (e) => {
                const b = e.currentTarget;
                b.disabled = true;
                b.textContent = 'インストール中…';
                try {
                    await this.installApp(app.id);
                } catch (err) {
                    b.disabled = false;
                    b.textContent = 'インストール';
                    this.showOSPopup('エラー', 'インストールに失敗しました。: ' + err.message);
                }
            };
            btnDiv.appendChild(btn);
        } else {
            const delBtn = document.createElement('button');
            delBtn.className = 'btn-mini';
            delBtn.textContent = '削除';
            delBtn.onclick = async (e) => {
                const b = e.currentTarget;
                b.disabled = true;
                b.textContent = '削除中…';
                try {
                    await this.uninstallApp(app.id);
                } catch (err) {
                    b.disabled = false;
                    b.textContent = '削除';
                    this.showOSPopup('エラー', '削除に失敗しました。: ' + err.message);
                }
            };
            btnDiv.appendChild(delBtn);
        }

        if (updateAvailable) {
            const updBtn = document.createElement('button');
            updBtn.className = 'btn-mini';
            updBtn.style.cssText = 'background:#4CAF50;';
            updBtn.textContent = '更新';
            updBtn.onclick = async (e) => {
                const b = e.currentTarget;
                b.disabled = true;
                b.textContent = '更新中…';
                try {
                    await this.installApp(app.id);
                } catch (err) {
                    b.disabled = false;
                    b.textContent = '更新';
                    this.showOSPopup('エラー', '更新に失敗しました。: ' + err.message);
                }
            };
            btnDiv.appendChild(updBtn);
        }

        card.appendChild(btnDiv);
        listContainer.appendChild(card);
    }
}

// 言語ファイルをアップロード
async uploadLanguageFile() {
    try {
        const [fileHandle] = await window.showOpenFilePicker({
            types: [{
                description: 'Language File',
                accept: { 'text/plain': ['.txt'] }
            }]
        });
        const file = await fileHandle.getFile();
        const langName = file.name.replace(/\.txt$/i, '');
        if (!langName) {
            this.showOSPopup('エラー', 'ファイル名が無効です。');
            return;
        }
        const langDir = await this.root.getDirectoryHandle('system')
            .then(d => d.getDirectoryHandle('language', { create: true }));
        const newFileHandle = await langDir.getFileHandle(file.name, { create: true });
        const writable = await newFileHandle.createWritable();
        await writable.write(file);
        await writable.close();

        this.config.language = langName;
        await this.saveConfig();
        await this.loadLanguage(langName);
        this.showOSPopup('言語', `${langName} を適用しました。`);
        if (this.activeAppId === 'sys.settings') this.renderSysApp('sys.settings');
    } catch(e) {
        if (e.name !== 'AbortError') {
            this.showOSPopup('エラー', 'アップロードに失敗しました。');
            console.error(e);
        }
    }
}



// 言語を切り替え

async loadLanguage(langName) {
    this.currentLanguage = langName;
    this.translations.clear();
    try {
        const langDir = await this.root.getDirectoryHandle('system').then(d => d.getDirectoryHandle('language', { create: true }));
        const fileHandle = await langDir.getFileHandle(langName + '.txt');
        const file = await fileHandle.getFile();
        const text = await file.text();
        const lines = text.split('\n');
        for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) continue;
            const eqIndex = trimmed.indexOf('=');
            if (eqIndex > 0) {
                const key = trimmed.substring(0, eqIndex).trim();
                const value = trimmed.substring(eqIndex + 1).trim();
                if (key && value) {
                    this.translations.set(key, value);
                }
            }
        }
        // ★ 次のフレームで翻訳適用（DOM が最新の状態になってから）
        requestAnimationFrame(() => this.applyTranslations());
        return true;
    } catch(e) {
        console.warn('Language load failed:', e);
        return false;
    }
}

_t(text) {
    return this.translations.get(text) || text;
}

// カスタムテーマをアップロード
async uploadCustomTheme() {
    try {
        const [fileHandle] = await window.showOpenFilePicker({
            types: [{
                description: 'CSS Theme File',
                accept: { 'text/css': ['.css'] }
            }]
        });
        const file = await fileHandle.getFile();
        const themeName = file.name.replace(/\.css$/i, '');
        if (!themeName) {
            this.showOSPopup('エラー', 'ファイル名が無効です');
            return;
        }
        const themeDir = await this.root.getDirectoryHandle('system')
            .then(d => d.getDirectoryHandle('themes', { create: true }));
        const newFileHandle = await themeDir.getFileHandle(file.name, { create: true });
        const writable = await newFileHandle.createWritable();
        await writable.write(file);
        await writable.close();

        this.config.customThemeFile = file.name;
        this.config.customThemeEnabled = true;
        await this.saveConfig();
        await this.applyCustomTheme();
        this.showOSPopup('テーマ', `${themeName} を適用しました。`);
        if (this.activeAppId === 'sys.settings') this.renderSysApp('sys.settings');
    } catch(e) {
        if (e.name !== 'AbortError') {
            this.showOSPopup('エラー', 'テーマのアップロードに失敗しました。');
            console.error(e);
        }
    }
}

// カスタムテーマを適用（オンなら読み込み、オフなら削除）
async applyCustomTheme() {
    const themeId = 'custom-theme-style';
    const existing = document.getElementById(themeId);
    if (existing) existing.remove();

    if (!this.config.customThemeEnabled || !this.config.customThemeFile) {
        // カスタムテーマが無効なら、標準テーマを適用
        this.applyTheme(); // 標準テーマに戻す
        return;
    }

    try {
        const themeDir = await this.root.getDirectoryHandle('system')
            .then(d => d.getDirectoryHandle('themes', { create: true }));
        const fileHandle = await themeDir.getFileHandle(this.config.customThemeFile);
        const file = await fileHandle.getFile();
        const css = await file.text();

        const style = document.createElement('style');
        style.id = themeId;
        style.textContent = css;
        document.head.appendChild(style);

        // カスタムテーマが適用されているので、標準テーマは上書きされる（ただし、標準テーマも適用しておく）
        this.applyTheme(); // 標準のCSS変数を設定（カスタムCSSが後から上書き）
    } catch(e) {
        console.warn('Custom theme apply failed:', e);
        // ファイルがなければ何もしない
    }
}

// カスタムテーマのオン/オフ切り替え
async toggleCustomTheme() {
    this.config.customThemeEnabled = !this.config.customThemeEnabled;
    await this.saveConfig();
    await this.applyCustomTheme();
    if (this.activeAppId === 'sys.settings') this.renderSysApp('sys.settings');
    this.showOSPopup('テーマ', this.config.customThemeEnabled ? 'カスタムテーマを有効化' : 'カスタムテーマを無効化');
}

// カスタムテーマを削除（ファイルごと削除）
async deleteCustomTheme() {
    if (!this.config.customThemeFile) {
        this.showOSPopup('テーマ', '削除するテーマがありません');
        return;
    }
    const confirm = await this.showDialog('[警告]テーマ削除', 'カスタムテーマを削除しますか？', [
        { label: '削除', value: 'ok' },
        { label: 'キャンセル', value: 'cancel' }
    ]);
    if (confirm !== 'ok') return;

    try {
        const themeDir = await this.root.getDirectoryHandle('system')
            .then(d => d.getDirectoryHandle('themes', { create: true }));
        await themeDir.removeEntry(this.config.customThemeFile);
        this.config.customThemeFile = null;
        this.config.customThemeEnabled = false;
        await this.saveConfig();
        await this.applyCustomTheme();
        if (this.activeAppId === 'sys.settings') this.renderSysApp('sys.settings');
        this.showOSPopup('テーマ', 'カスタムテーマを削除しました。');
    } catch(e) {
        this.showOSPopup('エラー', '削除に失敗しました。');
        console.error(e);
    }
}

applyTranslations() {
    if (!this.translations || this.translations.size === 0) return;

    // ★ 走査対象：device 全体 + 各 iframe の document
    const roots = [document.getElementById('device')];
    document.querySelectorAll('iframe').forEach(frame => {
        try {
            const doc = frame.contentDocument || frame.contentWindow?.document;
            if (doc && doc.body) roots.push(doc.body);
        } catch (_) { /* cross-origin は無視 */ }
    });

    roots.forEach(root => {
        if (!root) return;
        this._translateNodeTree(root);
    });
}

/* ★ ノードツリーを再帰的に翻訳置換（内部ヘルパー） */
_translateNodeTree(node) {
    if (!node) return;

    // --- テキストノード ---
    if (node.nodeType === Node.TEXT_NODE) {
        const raw = node.nodeValue;
        if (!raw) return;
        const trimmed = raw.trim();
        if (!trimmed) return;

        const translated = this.translations.get(trimmed);
        if (translated && translated !== trimmed) {
            // 前後の空白（改行・インデント）を維持して置換
            const before = raw.match(/^\s*/)[0];
            const after  = raw.match(/\s*$/)[0];
            node.nodeValue = before + translated + after;
        }
        return;
    }

    // --- 要素ノード ---
    if (node.nodeType === Node.ELEMENT_NODE) {
        // <script>, <style> は触らない（壊れる原因）
        const tag = node.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT') return;

        // placeholder 属性
        if (node.placeholder) {
            const t = this.translations.get(node.placeholder.trim());
            if (t) node.placeholder = t;
        }
        // title 属性
        if (node.title) {
            const t = this.translations.get(node.title.trim());
            if (t) node.title = t;
        }
        // value 属性（button/input 用）
        if ((tag === 'BUTTON' || tag === 'INPUT') && node.value) {
            const t = this.translations.get(String(node.value).trim());
            if (t) node.value = t;
        }
        // aria-label
        const aria = node.getAttribute?.('aria-label');
        if (aria) {
            const t = this.translations.get(aria.trim());
            if (t) node.setAttribute('aria-label', t);
        }

        // 子ノードを再帰処理
        // ※ childNodes のスナップショットを取る（置換中に変わる可能性があるため）
        Array.from(node.childNodes).forEach(child => this._translateNodeTree(child));
    }
}

async getAvailableLanguages() {
    try {
        const langDir = await this.root.getDirectoryHandle('system').then(d => d.getDirectoryHandle('language'));
        const files = [];
        for await (const entry of langDir.values()) {
            if (entry.kind === 'file' && entry.name.endsWith('.txt')) {
                files.push(entry.name.replace(/\.txt$/i, ''));
            }
        }
        return files;
    } catch(e) {
        return [];
    }
}

// アクセントカラー関連
// =====================================================
/**
 * PaaOS 独自カラーピッカー（SV面 + Hueバー）
 * @param {string} initialColor  例: '#ff3e3e'
 * @param {(hex:string)=>void} onChange  ドラッグ中に呼ばれる
 * @returns {Promise<string|null>}  決定時はHEX、キャンセル時は null
 */
showColorPicker(initialColor = '#ff3e3e', onChange = null) {
    return new Promise((resolve) => {
        // 既存を削除
        document.querySelectorAll('.paa-color-picker').forEach(el => el.remove());

        const [h0, s0, v0] = (() => {
            const rgb = this._hexToRgb(initialColor) || [255, 62, 62];
            return this._rgbToHsv(rgb[0], rgb[1], rgb[2]);
        })();

        let h = h0, s = s0, v = v0;

        const wrap = document.createElement('div');
        wrap.className = 'paa-color-picker';
        wrap.innerHTML = `
            <div class="paa-color-picker-inner">
                <div style="font-size:16px; font-weight:700; margin-bottom:14px;">色を選択</div>
                <div class="paa-color-sv" id="paa-sv">
                    <canvas id="paa-sv-canvas"></canvas>
                    <div class="paa-color-sv-dot" id="paa-sv-dot"></div>
                </div>
                <div class="paa-color-hue" id="paa-hue">
                    <div class="paa-color-hue-dot" id="paa-hue-dot"></div>
                </div>
                <div class="paa-color-preview-row">
                    <div class="paa-color-preview" id="paa-preview"></div>
                    <input class="paa-color-hex" id="paa-hex" type="text" value="${initialColor}" spellcheck="false" autocomplete="off">
                </div>
                <div class="paa-color-actions">
                    <button class="cancel" id="paa-cancel">キャンセル</button>
                    <button class="ok" id="paa-ok">決定</button>
                </div>
            </div>
        `;
        (document.getElementById('device') || document.body).appendChild(wrap);
        // 強制リフロー → active
        void wrap.offsetHeight;
        wrap.classList.add('active');

        const svEl = wrap.querySelector('#paa-sv');
        const svCanvas = wrap.querySelector('#paa-sv-canvas');
        const svDot = wrap.querySelector('#paa-sv-dot');
        const hueEl = wrap.querySelector('#paa-hue');
        const hueDot = wrap.querySelector('#paa-hue-dot');
        const previewEl = wrap.querySelector('#paa-preview');
        const hexInput = wrap.querySelector('#paa-hex');

        // --- SV面キャンバス描画（hue に応じた色で） ---
        const renderSV = () => {
            const w = svEl.clientWidth || 260;
            const hgt = svEl.clientHeight || 260;
            if (svCanvas.width !== w) { svCanvas.width = w; svCanvas.height = hgt; }
            const ctx = svCanvas.getContext('2d');
            // 白色ベース
            ctx.fillStyle = `hsl(${h}, 100%, 50%)`;
            ctx.fillRect(0, 0, w, hgt);
            // 左→右：白グラデ
            const gW = ctx.createLinearGradient(0, 0, w, 0);
            gW.addColorStop(0, 'rgba(255,255,255,1)');
            gW.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gW;
            ctx.fillRect(0, 0, w, hgt);
            // 上→下：黒グラデ
            const gB = ctx.createLinearGradient(0, 0, 0, hgt);
            gB.addColorStop(0, 'rgba(0,0,0,0)');
            gB.addColorStop(1, 'rgba(0,0,0,1)');
            ctx.fillStyle = gB;
            ctx.fillRect(0, 0, w, hgt);
        };

        const updateDots = () => {
            const w = svEl.clientWidth, hgt = svEl.clientHeight;
            svDot.style.left = (s * w) + 'px';
            svDot.style.top  = ((1 - v) * hgt) + 'px';
            hueDot.style.left = (h / 360 * 100) + '%';
            const hex = this._hsvToHex(h, s, v);
            previewEl.style.background = hex;
            if (document.activeElement !== hexInput) hexInput.value = hex;
            if (onChange) onChange(hex);
        };

        renderSV(); updateDots();

        // --- SV 操作 ---
        const updateSV = (clientX, clientY) => {
            const r = svEl.getBoundingClientRect();
            s = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
            v = 1 - Math.max(0, Math.min(1, (clientY - r.top) / r.height));
            updateDots();
        };
        let svDrag = false;
        const svDown = (e) => {
            e.preventDefault();
            svDrag = true;
            const p = e.touches ? e.touches[0] : e;
            updateSV(p.clientX, p.clientY);
        };
        const svMove = (e) => {
            if (!svDrag) return;
            e.preventDefault();
            const p = e.touches ? e.touches[0] : e;
            updateSV(p.clientX, p.clientY);
        };
        const svUp = () => { svDrag = false; };

        svEl.addEventListener('mousedown', svDown);
        svEl.addEventListener('touchstart', svDown, { passive: false });
        window.addEventListener('mousemove', svMove);
        window.addEventListener('touchmove', svMove, { passive: false });
        window.addEventListener('mouseup', svUp);
        window.addEventListener('touchend', svUp);
        window.addEventListener('touchcancel', svUp);

        // --- Hue 操作 ---
        const updateHue = (clientX) => {
            const r = hueEl.getBoundingClientRect();
            h = Math.max(0, Math.min(360, ((clientX - r.left) / r.width) * 360));
            renderSV();
            updateDots();
        };
        let hueDrag = false;
        const hueDown = (e) => {
            e.preventDefault();
            hueDrag = true;
            const p = e.touches ? e.touches[0] : e;
            updateHue(p.clientX);
        };
        const hueMove = (e) => {
            if (!hueDrag) return;
            e.preventDefault();
            const p = e.touches ? e.touches[0] : e;
            updateHue(p.clientX);
        };
        const hueUp = () => { hueDrag = false; };

        hueEl.addEventListener('mousedown', hueDown);
        hueEl.addEventListener('touchstart', hueDown, { passive: false });
        window.addEventListener('mousemove', hueMove);
        window.addEventListener('touchmove', hueMove, { passive: false });
        window.addEventListener('mouseup', hueUp);
        window.addEventListener('touchend', hueUp);
        window.addEventListener('touchcancel', hueUp);

        // --- HEX 手入力 ---
        hexInput.addEventListener('input', () => {
            const v2 = hexInput.value.trim();
            if (/^#?[0-9a-fA-F]{6}$/.test(v2)) {
                const hex = v2.startsWith('#') ? v2 : '#' + v2;
                const rgb = this._hexToRgb(hex);
                if (rgb) {
                    const [hh, ss, vv] = this._rgbToHsv(rgb[0], rgb[1], rgb[2]);
                    h = hh; s = ss; v = vv;
                    renderSV();
                    const w = svEl.clientWidth, hgt = svEl.clientHeight;
                    svDot.style.left = (s * w) + 'px';
                    svDot.style.top  = ((1 - v) * hgt) + 'px';
                    hueDot.style.left = (h / 360 * 100) + '%';
                    previewEl.style.background = hex;
                    if (onChange) onChange(hex);
                }
            }
        });

        // --- ボタン ---
        const cleanup = () => {
            window.removeEventListener('mousemove', svMove);
            window.removeEventListener('touchmove', svMove);
            window.removeEventListener('mouseup', svUp);
            window.removeEventListener('touchend', svUp);
            window.removeEventListener('touchcancel', svUp);
            window.removeEventListener('mousemove', hueMove);
            window.removeEventListener('touchmove', hueMove);
            window.removeEventListener('mouseup', hueUp);
            window.removeEventListener('touchend', hueUp);
            window.removeEventListener('touchcancel', hueUp);
        };

        wrap.querySelector('#paa-ok').onclick = () => {
            const hex = this._hsvToHex(h, s, v);
            wrap.classList.remove('active');
            cleanup();
            setTimeout(() => { wrap.remove(); resolve(hex); }, 200);
        };
        wrap.querySelector('#paa-cancel').onclick = () => {
            wrap.classList.remove('active');
            cleanup();
            setTimeout(() => { wrap.remove(); resolve(null); }, 200);
        };
    });
}

// ---- カラー変換ヘルパー（追加） ----
_rgbToHsv(r, g, b) {
    r/=255; g/=255; b/=255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
    let h = 0;
    if (d !== 0) {
        if (max === r) h = ((g-b)/d) % 6;
        else if (max === g) h = (b-r)/d + 2;
        else h = (r-g)/d + 4;
    }
    h *= 60; if (h < 0) h += 360;
    const s = max === 0 ? 0 : d / max;
    const v = max;
    return [h, s, v];
}
_hsvToHex(h, s, v) {
    const c = v * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = v - c;
    let r=0, g=0, b=0;
    if (h < 60) { r=c; g=x; }
    else if (h < 120) { r=x; g=c; }
    else if (h < 180) { g=c; b=x; }
    else if (h < 240) { g=x; b=c; }
    else if (h < 300) { r=x; b=c; }
    else { r=c; b=x; }
    const toHex = (n) => Math.round((n+m)*255).toString(16).padStart(2,'0');
    return '#' + toHex(r) + toHex(g) + toHex(b);
}
// ---- カラーピッカー初期化 ----
_setupColorPicker() {
    const hueSlider = document.getElementById('hue-slider');
    const satSlider = document.getElementById('sat-slider');
    const lightSlider = document.getElementById('light-slider');
    const preview = document.getElementById('color-preview-large');
    const hueVal = document.getElementById('hue-value');
    const satVal = document.getElementById('sat-value');
    const lightVal = document.getElementById('light-value');

    if (!hueSlider) return;

    // 現在のアクセントカラーをHSVに変換して初期値に設定
    const currentColor = this.config.accentColor || '#ff3e3e';
    const rgb = this._hexToRgb(currentColor);
    if (rgb) {
        const [h, s, l] = this._rgbToHsl(rgb[0], rgb[1], rgb[2]);
        hueSlider.value = Math.round(h);
        satSlider.value = Math.round(s * 100);
        lightSlider.value = Math.round(l * 100);
    }

    const updateColor = () => {
        const h = parseInt(hueSlider.value);
        const s = parseInt(satSlider.value);
        const l = parseInt(lightSlider.value);
        const color = `hsl(${h}, ${s}%, ${l}%)`;
        preview.style.background = color;
        hueVal.textContent = h + '°';
        satVal.textContent = s + '%';
        lightVal.textContent = l + '%';
        this._tempColor = color;
    };

    hueSlider.addEventListener('input', updateColor);
    satSlider.addEventListener('input', updateColor);
    lightSlider.addEventListener('input', updateColor);
    updateColor();
}

// ---- 壁紙から色を抽出 ----
async _extractColorsFromWallpaper() {
    const container = document.getElementById('wallpaper-container');
    const bgImage = container.style.backgroundImage;
    if (!bgImage || bgImage === 'none') {
        this.showOSPopup('壁紙', '壁紙が設定されていません');
        return;
    }
    const urlMatch = bgImage.match(/url\(["']?(.*?)["']?\)/);
    if (!urlMatch) {
        this.showOSPopup('壁紙', '壁紙のURLを取得できません');
        return;
    }
    const url = urlMatch[1];
    try {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.src = url;
        await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
        });
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        const colors = [];
        const step = Math.max(1, Math.floor((canvas.width * canvas.height) / 200));
        for (let i = 0; i < data.length; i += step * 4) {
            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];
            if (r + g + b > 50) {
                const hex = '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
                colors.push(hex);
            }
        }
        // 色相でソートして重複を排除、最大5色
        const sorted = colors.sort((a,b) => {
            const [r1,g1,b1] = this._hexToRgb(a);
            const [r2,g2,b2] = this._hexToRgb(b);
            return this._rgbToHue(r1,g1,b1) - this._rgbToHue(r2,g2,b2);
        });
        const unique = [];
        const seen = new Set();
        for (const c of sorted) {
            if (!seen.has(c)) {
                seen.add(c);
                unique.push(c);
                if (unique.length >= 5) break;
            }
        }
        this._renderAccentSuggestions(unique);
    } catch(e) {
        console.error('色抽出エラー:', e);
        this.showOSPopup('壁紙', '色の抽出に失敗しました。 (クロスオリジン制限の可能性があります)');
    }
}

_renderAccentSuggestions(colors) {
    const container = document.getElementById('accent-suggestions');
    if (!container) return;
    container.innerHTML = '';
    colors.forEach(color => {
        const div = document.createElement('div');
        div.style.cssText = `width: 40px; height: 40px; border-radius: 50%; background: ${color}; cursor: pointer; border: 2px solid rgba(128,128,128,0.3); transition: transform 0.1s;`;
        div.onclick = () => this._setAccentColor(color);
        div.onmouseenter = () => div.style.transform = 'scale(1.1)';
        div.onmouseleave = () => div.style.transform = 'scale(1)';
        container.appendChild(div);
    });
}

// ---- 色を適用 ----
_setAccentColor(color) {
    if (!color) return;
    this.config.accentColor = color;
    this.saveConfig();
    document.documentElement.style.setProperty('--accent', color);

    // ★ 再描画せず、DOM 部分更新のみ
    const preview = document.getElementById('accent-color-preview');
    if (preview) preview.style.background = color;
    const hexDisplay = document.getElementById('accent-color-hex');
    if (hexDisplay) hexDisplay.textContent = color;

    // プレビュー用の「この色を適用」ボタンも更新
    const largePreview = document.getElementById('color-preview-large');
    if (largePreview) largePreview.style.background = color;

    // 通知は控えめに（連続変更時にうるさいので）
    clearTimeout(this._accentToastTimer);
    this._accentToastTimer = setTimeout(() => {
        this.showOSPopup('アクセントカラー', `カラーを ${color} に変更しました。`);
    }, 400);
}

_applyCustomAccentColor() {
    const color = this._tempColor || '#ff3e3e';
    // HSL→HEX変換
    const hslMatch = color.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
    if (hslMatch) {
        const h = parseInt(hslMatch[1]);
        const s = parseInt(hslMatch[2]) / 100;
        const l = parseInt(hslMatch[3]) / 100;
        const hex = this._hslToHex(h, s, l);
        this._setAccentColor(hex);
    } else {
        this._setAccentColor(color);
    }
}

// ---- カラー変換ユーティリティ ----
_hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? [parseInt(result[1], 16), parseInt(result[2], 16), parseInt(result[3], 16)] : null;
}

_rgbToHue(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0;
    if (max !== min) {
        const d = max - min;
        switch (max) {
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
        }
    }
    return h * 360;
}

_rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0, l = (max + min) / 2;
    if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
        }
    }
    return [h * 360, s, l];
}

_hslToHex(h, s, l) {
    // h: 0-360, s: 0-1, l: 0-1
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;
    let r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    const toHex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return '#' + toHex(r) + toHex(g) + toHex(b);
}

function levenshtein(a, b) {
    const m = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null));
    for (let i = 0; i <= a.length; i++) m[0][i] = i;
    for (let j = 0; j <= b.length; j++) m[j][0] = j;
    for (let j = 1; j <= b.length; j++) {
        for (let i = 1; i <= a.length; i++) {
            const cost = a[i-1] === b[j-1] ? 0 : 1;
            m[j][i] = Math.min(m[j][i-1] + 1, m[j-1][i] + 1, m[j-1][i-1] + cost);
        }
    }
    return m[b.length][a.length];
}

    async saveNotificationRecord(title, message, appId = null) {
        const entry = {
            title: title || "システム",
            message: message,
            time: new Date().toLocaleString('ja-JP'),
            appId: appId || null   // ★ 送信元アプリID（あれば「開く」可能）
        };
        const sys = await this.root.getDirectoryHandle('system');
        const handle = await sys.getFileHandle('notification.json', {create:true});
        const file = await handle.getFile();
        const currentText = await file.text();
        const writable = await handle.createWritable();
        await writable.write(currentText + JSON.stringify(entry) + "\n");
        await writable.close();
        // ★ キャッシュに追記（次回開いた時に即表示）
        if (this._notificationCache) {
            this._notificationCache.push(entry);
        }
    }

    async deleteNotification(index) {
        let logs = await this.loadNotifications();
        logs.splice(index, 1);
        const sys = await this.root.getDirectoryHandle('system');
        const writable = await (await sys.getFileHandle('notification.json', {create:true})).createWritable();
        await writable.write(logs.map(l => JSON.stringify(l)).join('\n') + (logs.length > 0 ? "\n" : ""));
        await writable.close();
        // ★ キャッシュを更新

    async updateSystem() {
  try {
    const [fileHandle] = await window.showOpenFilePicker({
      types: [{
        description: 'PaaOS Update File (.zip)',
        accept: { 'application/zip': ['.zip'] }
      }]
    });
    const file = await fileHandle.getFile();
    const zip = await JSZip.loadAsync(file);
    
    // 必須: os.html の存在確認
    const osFile = zip.file("os.html");
    if (!osFile) {
      await this.showDialog('[エラー] アップデート', 'このファイルはアップデートファイルとして認識されませんでした。 ', [{ label: 'OK', value: 'ok' }]);
      return false;
    }
    
    // オプション: info.txt の処理
    const infoFile = zip.file("info.txt");
    if (infoFile) {
      try {
        const infoContent = await infoFile.async("text");
        const sysDir = await this.root.getDirectoryHandle('system', { create: true });
        const infoHandle = await sysDir.getFileHandle('info.txt', { create: true });
        const writable = await infoHandle.createWritable();
        await writable.write(infoContent);
        await writable.close();
        this.showOSPopup("アップデート", "システム情報 (info.txt) を更新しました。");
      } catch (infoErr) {
        console.warn("info.txtの保存に失敗しました。:", infoErr);
        this.showOSPopup("[エラー]", "info.txtの保存に失敗しましたが、更新は続行します");
      }
    }
    
    // os.html の処理
    const osContent = await osFile.async("blob");
    const rand = Math.floor(Math.random() * 10000);
    const newFileName = `${rand}os.html`;
    const newFileHandle = await this.root.getFileHandle(newFileName, { create: true });
    const writable = await newFileHandle.createWritable();
    await writable.write(osContent);
    await writable.close();
    
    await this.showDialog('更新完了', ` 更新が完了しました。[${newFileName}] を起動します。`, [{ label: 'OK', value: 'ok' }]);
    
    // 古い os.html の削除（あれば）
    try {
      const sysDir = await this.root.getDirectoryHandle('system');
      await sysDir.removeEntry("os.html");
    } catch(e) {
      try { await this.root.removeEntry("os.html"); } catch(e2){}
    }
    
    location.href = `${newFileName}`;
    return true;
    
  } catch (err) {
    console.error("Update Error:", err);
    if (err.name !== 'AbortError') {
      await this.showDialog('[エラー] アップデート','アップデート中にエラーが発生しました。', [{ label: 'OK', value: 'ok' }]);
    }
    // ★★★ AbortError も含めて false を返す ★★★
    return false;
  }
}

// PaaOS_Kernel クラスのメソッドとして追加
async _generateIconFromEmoji(appName, emoji) {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');

    // 白背景
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 256, 256);

    // 絵文字を中央に描画（Noto Color Emoji を指定）
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '180px "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    ctx.fillStyle = '#000000';
    ctx.fillText(emoji, 128, 128);

    // PNG データを取得
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('PNG生成失敗');

    // apps/[appName]/icon.png に保存
    const appsDir = await this.root.getDirectoryHandle('apps', { create: true });
    const appDir = await appsDir.getDirectoryHandle(appName);
    const fileHandle = await appDir.getFileHandle('icon.png', { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
}

// =====================================================
// OAuth 2.0 認証（Google Identity Services）
// =====================================================

_initYoutubeOAuth() {
    const clientId = this._getYoutubeOAuthClientId();
    if (!clientId) return;
    
    // 既存のスクリプトを読み込み
    if (typeof google === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://accounts.google.com/gsi/client';
        script.onload = () => this._setupOAuth(clientId);
        document.head.appendChild(script);
    } else {
        this._setupOAuth(clientId);
    }
}

_setupOAuth(clientId) {
    try {
        window.google.accounts.id.initialize({
            client_id: clientId,
            callback: (response) => this._handleOAuthResponse(response)
        });
        // ボタンをレンダリング（設定オーバーレイ内に配置）
        const btnContainer = document.getElementById('yt-oauth-status');
        if (btnContainer && !this._youtubeAccessToken) {
            window.google.accounts.id.renderButton(btnContainer, {
                type: 'standard',
                shape: 'pill',
                theme: 'outline',
                text: 'signin_with',
                size: 'medium'
            });
        }
    } catch(e) {
        console.warn('OAuth setup error:', e);
    }
}

_handleOAuthResponse(response) {
    if (response.credential) {
        // IDトークンからユーザー情報を取得（簡易的なログイン状態として保持）
        this._youtubeIdToken = response.credential;
        this._youtubeAccessToken = response.access_token || 'dummy';
        this._youtubeUserInfo = this._decodeJwt(response.credential);
        this.showOSPopup('YouTube', `ログインしました: ${this._youtubeUserInfo?.name || 'ユーザー'}`);
        this._saveYoutubeSettings();
        this._loadYoutubeAccount();
        this._updateOAuthStatus();
    }
}

_decodeJwt(token) {
    try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(base64));
    } catch(e) { return null; }
}

_youtubeLogin() {
    const clientId = this._getYoutubeOAuthClientId();
    if (!clientId) {
        this.showOSPopup('YouTube', 'OAuth Client ID が設定されていません');
        return;
    }
    // Google Identity Services でログインポップアップを表示
    if (window.google && window.google.accounts) {
        window.google.accounts.id.prompt();
    } else {
        // フォールバック: 直接認証URLを開く（簡易版）
        const redirectUri = window.location.origin + window.location.pathname;
        const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
            `client_id=${encodeURIComponent(clientId)}&` +
            `redirect_uri=${encodeURIComponent(redirectUri)}&` +
            `response_type=token&` +
            `scope=https://www.googleapis.com/auth/youtube.readonly&` +
            `include_granted_scopes=true`;
        window.open(authUrl, '_blank', 'width=500,height=600');
    }
}

_youtubeLogout() {
    this._youtubeAccessToken = null;
    this._youtubeIdToken = null;
    this._youtubeUserInfo = null;
    this.saveConfig();
    this._updateOAuthStatus();
    this.showOSPopup('YouTube', 'ログアウトしました');
    this._loadYoutubeAccount();
}


_updateOAuthStatus() {
    const status = document.getElementById('yt-oauth-status');
    if (status) {
        status.textContent = this._youtubeAccessToken ? '✅ ログイン中' : 'ログインしていません';
    }
    const loginStatus = document.getElementById('yt-login-status');
    if (loginStatus) {
        loginStatus.textContent = this._youtubeAccessToken ? '✅' : '🔒';
    }
}

async _saveYoutubeSettings() {
    const keyInput = document.getElementById('yt-settings-key');
    const oauthInput = document.getElementById('yt-settings-oauth');
    const channelInput = document.getElementById('yt-settings-channel');
    const embedCheck = document.getElementById('yt-settings-embed');
    if (keyInput) this.config.youtubeApiKey = keyInput.value.trim() || '';
    if (oauthInput) this.config.youtubeOAuthClientId = oauthInput.value.trim() || '';
    if (channelInput) this.config.youtubeChannelId = channelInput.value.trim() || '';
    if (embedCheck) this.config.youtubeEmbedMode = embedCheck.checked;
    await this.saveConfig();
    this._closeYoutubeSettings();

    this.showOSPopup('YouTube', '設定を保存しました');

_loadYoutubeShorts() {
    const container = document.getElementById('yt-tab-shorts');
    if (!container) return;
    container.innerHTML = '<div style="text-align:center; padding:40px; opacity:0.7;">読み込み中...</div>';
    const key = this._getYoutubeApiKey();
    if (!key) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:#ff6b6b;">⚠️ APIキーが未設定</div>`;

    }

_loadYoutubeAccount() {
    const container = document.getElementById('yt-tab-account');
    if (!container) return;
    container.innerHTML = '<div style="text-align:center; padding:40px; opacity:0.7;">読み込み中...</div>';
    const key = this._getYoutubeApiKey();
    if (!key) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:#ff6b6b;">⚠️ APIキーが未設定</div>`;
        return;
    }

    // 認証済みユーザーのチャンネルを優先
    const useOAuth = !!this._youtubeAccessToken;
    const channelId = this.config.youtubeChannelId || '';

    const loadChannel = (id) => {
        if (!id) {
            container.innerHTML = `<div style="text-align:center; padding:30px; opacity:0.5;">
                チャンネルが指定されていません<br>
                <span style="font-size:12px;">設定でチャンネルIDまたは@handleを入力するか、Googleログインしてください</span>
            </div>`;
            return;
        }
        // チャンネルIDかハンドルかを判定
        let paramName = 'id';
        let paramValue = id;
        if (id.startsWith('@')) {
            paramName = 'forHandle';
            paramValue = id.substring(1);
        }
        const channelUrl = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&${paramName}=${encodeURIComponent(paramValue)}&key=${key}`;
        fetch(channelUrl).then(res => res.json()).then(data => {
            const ch = data.items?.[0];
            if (!ch) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#ff6b6b;">チャンネルが見つかりません: ${id}</div>`;
                return;
            }
            // チャンネルヘッダー
            const header = document.createElement('div');
            header.style.cssText = 'background:rgba(128,128,128,0.05); border-radius:16px; padding:16px; margin-bottom:16px; display:flex; gap:12px; align-items:center;';
            header.innerHTML = `
                <img src="${ch.snippet.thumbnails?.default?.url || ''}" style="width:60px; height:60px; border-radius:50%;">
                <div>
                    <div style="font-size:18px; font-weight:bold;">${ch.snippet.title}</div>
                    <div style="font-size:12px; opacity:0.6;">登録者 ${parseInt(ch.statistics.subscriberCount || 0).toLocaleString()} · 動画 ${parseInt(ch.statistics.videoCount || 0).toLocaleString()}</div>
                    <div style="font-size:12px; opacity:0.5;">${ch.snippet.description || ''}</div>
                    <div style="font-size:11px; opacity:0.4; margin-top:4px;">チャンネルID: ${ch.id}</div>
                </div>
            `;
            container.appendChild(header);

            // アップロード動画を取得
            const uploadsPlaylistId = ch.contentDetails?.relatedPlaylists?.uploads;
            if (uploadsPlaylistId) {
                const playlistUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=20&playlistId=${uploadsPlaylistId}&key=${key}`;
                fetch(playlistUrl).then(res => res.json()).then(playlistData => {
                    const items = playlistData.items || [];
                    const listContainer = document.createElement('div');
                    listContainer.id = 'yt-account-videos';
                    container.appendChild(listContainer);
                    // 動画IDを収集して詳細情報を取得
                    const videoIds = items.map(item => item.snippet.resourceId.videoId).filter(id => id);
                    if (videoIds.length > 0) {
                        const detailUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoIds.join(',')}&key=${key}`;
                        fetch(detailUrl).then(res => res.json()).then(videoData => {
                            this._renderVideoCards(listContainer, videoData.items || [], 'account');
                        }).catch(() => this._renderVideoCards(listContainer, items, 'account'));
                    } else {
                        listContainer.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.5;">アップロード動画がありません</div>';
                    }
                }).catch(() => {});
            }
        }).catch(err => {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:#ff6b6b;">チャンネル情報の取得に失敗: ${err.message}</div>`;
        });
    };

    // OAuth 認証済みなら mine=true でチャンネルを取得
    if (useOAuth) {
        const oauthUrl = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&mine=true&key=${key}`;
        // OAuth トークンを使ってリクエスト
        fetch(oauthUrl, {
            headers: { 'Authorization': `Bearer ${this._youtubeAccessToken}` }
        }).then(res => res.json()).then(data => {
            if (data.items && data.items.length > 0) {
                const ch = data.items[0];
                this.config.youtubeChannelId = ch.id;
                this.saveConfig();
                loadChannel(ch.id);
            } else {
                loadChannel(this.config.youtubeChannelId || '');
            }
        }).catch(() => {
            loadChannel(this.config.youtubeChannelId || '');
        });
    } else {
        loadChannel(this.config.youtubeChannelId || '');
    }
}
